<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <meta http-equiv="x-ua-compatible" content="ie=edge">
  <title> Design Bootstrap</title>
  <!-- Font Awesome -->
  <!-- <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.8.2/css/all.css"> -->
  <!-- Bootstrap core CSS -->
  <link href="app/modules/newlogin/css/bootstrap.min.css" rel="stylesheet">
  <!-- Material Design Bootstrap -->
  <link href="app/modules/newlogin/css/mdb.min.css" rel="stylesheet">
  <!-- Your custom styles (optional) -->
 
</head>
<style>

  *{
    padding: 0;
    margin: 0;
  }
  html,body{
    height: 100%;
  }
 .bodysection{
  background-image: url("app/modules/newlogin/images.jpg");
  background-position: center center;
  background-size: cover;
  background-repeat: no-repeat;
  height: 100vh;
  width: 100%;
  }
  .card{
    width: 25%;
    position: relative;
    top: 20%;
  }
  .flex-column {
    position: relative;
  }
  .submit-button{
    border-radius:20px; 
  }
  #particles-js{
    background-position: center center;
  }
</style>

<body>

  <!-- Start your project here-->
  <section class="bodysection" > 
    <div class="flex-center flex-column "  id="particles-js" >
      <!-- Material form login -->
      <div class="card">

      <h3 class="mt-5 ml-5" data-wow-delay="0.6s"><strong>Sign
              in</strong></h3>
      <p class="fadeInUp mt-1 ml-5" >to Continue Your Account</p>
  
    <!--Card content-->
    <div class="card-body px-lg-5 pt-0">
  
      <!-- Form -->
      <form class="text-center" style="color: #757575;">
  
        <!-- Email -->
        <div class="md-form">
          <input type="email" id="materialLoginFormEmail" class="form-control">
          <label for="materialLoginFormEmail">User Name</label>
        </div>
  
        <!-- Password -->
        <div class="md-form">
          <input type="password" id="materialLoginFormPassword" class="form-control">
          <label for="materialLoginFormPassword">Password</label>
        </div>
  
        <div class="d-flex justify-content-around">
          <div>
            <!-- Remember me -->
          </div>
          <div>
            <!-- Forgot password -->
            <a href="">Forgot password?</a>
          </div>
        </div>
  
        <!-- Sign in button -->
        <!-- <button class="btn btn-outline-info btn-rounded btn-block my-4 waves-effect z-depth-0" type="submit">Sign in</button> -->
        <button class="btn btn-outline-info  btn-block my-4 waves-effect z-depth-0 submit-button" type="submit">Sign in</button>
      
      </form>
      <!-- Form -->
  
    </div>
  
  </div>
  <!-- Material form login -->
    </div>
  </section>
  <!-- Start your project here-->

  <!-- SCRIPTS -->
  <!-- JQuery -->
  <script type="text/javascript" src="app/modules/newlogin/js/jquery-3.4.1.min.js"></script>
  <!-- Bootstrap tooltips -->
  <script type="text/javascript" src="app/modules/newlogin/js/popper.min.js"></script>
  <!-- Bootstrap core JavaScript -->
  <script type="text/javascript" src="app/modules/newlogin/js/bootstrap.min.js"></script>
  <!-- MDB core JavaScript -->
  <script type="text/javascript" src="app/modules/newlogin/js/mdb.min.js"></script>
  <script src="app/modules/newlogin/particles.js"></script>
  <script src="app/modules/newlogin/app.js"></script>
</body>

</html>
