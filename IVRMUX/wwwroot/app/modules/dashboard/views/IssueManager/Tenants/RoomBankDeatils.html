
<section class="content" ng-init="loaddata()">
    <form class="form-horizontal ng-pristine ng-valid" role="form" name="myForm" method="post" novalidate>
        <div class="box box-primary">
            <div class="box-header with-border">
                <h3 class="box-title">Room Wise Bank Details</h3>
                <div class="box-tools pull-right">
                    <button type="button" class="btn btn-box-tool" data-widget="collapse"><i class="fa fa-minus"></i></button>
                </div>
            </div>
            <div class="box-body">
                <div class="col-sm-12">
                    <div class="col-sm-6">
                        <label class="control-label col-sm-3"> Room :<strong style="color:red;">*</strong></label>
                        <div class="col-sm-9">
                            <select class="form-control" id="sel1ww" name="roomname" ng-model="HRMR_Id" required>
                                <option value="">--Select Room--</option>
                                <option ng-repeat="option in rooms" value="{{option.hrmR_Id}}"
                                        ng-selected="{{option.hrmR_Id == hrmR_Id}}">
                                    {{option.hrmR_RoomName}}
                                </option>
                            </select>
                            <div class="error-messages" ng-if="interacted(myForm.roomname)" ng-messages="myForm.roomname.$error">
                                <div ng-message="required">Select Room</div>
                            </div>
                        </div>
                    </div>

                    <div class="col-sm-6">
                        <label class="control-label col-sm-3"> Bank Name :<strong style="color:red;">*</strong></label>
                        <div class="col-sm-9">
                            <select class="form-control" ng-model="HRMBD_Id" name="Bankname" id="id0" required>
                                <option value="">--Select--</option>
                                <option ng-repeat="dd in banklist" value="{{dd.hrmbD_Id}}">
                                    {{dd.hrmbD_BankName}}&nbsp; - &nbsp;{{dd.hrmbD_BankAccountNo}}
                                </option>
                            </select>
                            <div class="error-messages" ng-if="interacted(myForm.Bankname)" ng-messages="myForm.Bankname.$error">
                                <div ng-message="required">Select Bank</div>
                            </div>
                        </div>
                    </div>
                </div>

                <br />
                <br />




                <hr />
                <div class="text-center">

                    <md-button type="button" class="md-raised md-primary" ng-disabled="form.$invalid" ng-click="savedata()" id="save-btn">
                        <i class="fa fa-floppy-o" aria-hidden="true"></i>
                        Save
                    </md-button>
                    <md-button type="button" class="md-raised md-warn" ng-click="Clearid()">
                        <i class="fa fa-times" aria-hidden="true"></i>
                        Cancel
                    </md-button>
                </div>
            </div>
            </div>
    </form>



    <!--<div class="box box-primary" ng-show="get_levl.length>0">-->
    <div class="box box-primary">
        <div class="box-header with-border">
            <h3 class="box-title">Room Wise Bank Details</h3>
            <div class="box-tools pull-right">
                <button type="button" class="btn btn-box-tool" data-widget="collapse" data-placement="bottom" data-toggle="tooltip" title="collapsible"><i class="fa fa-minus"></i></button>
            </div>
        </div>
        <!-- /.box-header -->
        <div class="box-body">
            <div class="row">
                <div class="col-sm-4">
                    <div class="form-group">
                        <label class="control-label">
                            <b> Total Grid Records :</b>
                            <label class="badge">
                                {{presentCountgrid}}
                            </label>
                        </label>
                    </div>
                </div>
                <div class="col-sm-4">
                    <div class="form-group" ng-if="searchValue!=''">
                        <label class="control-label">
                            <b>Total Records Searched : </b>
                            <label class="badge">
                                {{filterValue1.length}}
                            </label>
                        </label>
                    </div>
                </div>
                <div class="col-sm-4 pull-right">
                    <div class="form-group">
                        <div class="input-group">
                            <span class="input-group-addon">
                                <i class="fa fa-search"></i>
                            </span>
                            <input class="form-control" ng-model="searchValue" type="text" placeholder="search here...">
                        </div>
                    </div>
                </div>
            </div>
            <table class="table table-hover table-responsive table-bordered text-center">
                <thead>
                    <tr>
                        <th>
                            <a href="" ng-click="sortBy('sno')">SL.No.</a>
                        </th>
                        <th><a href="" ng-click="sortBy('HRMR_RoomName')">Tenant Name</a></th>
                        <th><a href="" ng-click="sortBy('HRMBD_BankName')">Bank Name - Account No</a> </th>

                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr dir-paginate="user in filterValue1 = (get_levl | filter : searchValue)  | orderBy:propertyName:reverse |itemsPerPage:itemsPerPage" current-page="currentPage" ng-class-odd="'odd'">
                        <td>{{itemsPerPage *(currentPage-1)+$index+1}}</td>
                        <td>{{user.hrmR_RoomName}}</td>
                        <td>{{user.hrmbD_BankName}}</td>

                        <td hidden="hidden">{{user.HRMRBD_Id}}</td>
                        <td class="text-center">
                            <a class="text-aqua" href="" ng-click="edit(user)" data-placement="bottom" data-toggle="tooltip" title="Edit">
                                <i class="fa fa-pencil-square-o" aria-hidden="true"></i>
                            </a>
                            &nbsp;
                            <span ng-if="user.hrmrbD_ActiveFlag === false">
                                <a href="" ng-click="deactive(user)" class="text-green" data-placement="bottom" data-toggle="tooltip" title="Activate">
                                    <i> Activate </i>
                                </a>
                            </span>
                            <span ng-if="user.hrmrbD_ActiveFlag === true">
                                <a href="" ng-click="deactive(user)" class="text-danger" data-placement="bottom" data-toggle="tooltip" title="Deactivate">
                                    <i> Deactivate</i>
                                </a>
                            </span>
                        </td>
                    </tr>
                </tbody>
            </table>
            <dir-pagination-controls max-size="5"
                                     direction-links="true"
                                     boundary-links="true">
            </dir-pagination-controls>

        </div>
    </div>
</section>
