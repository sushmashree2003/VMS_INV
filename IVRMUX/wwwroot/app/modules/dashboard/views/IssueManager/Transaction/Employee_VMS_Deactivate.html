<style>
    .box-content {
        list-style-type: none;
        position: relative;
        border: 1px solid #3e85a0;
        padding: 12px;
        min-height: 280px;
        border-radius: 5px;
    }

    .box-label {
        list-style-type: none;
        position: relative;
        border: 3px solid #3e85a0;
        padding: 5px;
        min-height: 34px;
        border-radius: 5px;
        margin: 3px;
        font-size: 14px;
        font-weight: bold;
        font-family: sans-serif;
    }

        .box-label:hover {
            box-shadow: 0px 37px 20px -10px rgba(0,0,0,0.2);
            transform: translate(0px, -5px) scale(1.0);
        }

    .file-bluedd:before {
        content: 'Download Template';
        background: #2757a6;
        border-color: #2757a6;
        color: #FFF;
        text-shadow: 1px 1px rgba(000,000,000,0.5);
    }

    .lessonplanner .file-blue:before {
        content: 'Browse';
        font-size: 13px;
        text-align: center
    }

    .multiselect {
        width: 100%;
        height: 8em;
        /*border: solid 1px #5cb7ff;*/
        overflow: auto;
        margin-left: 2.7%;
        margin-bottom: 1%;
        padding: 2%;
    }

    .md-icon-button + .md-datepicker-input-container {
        margin-left: -10px;
        width: 53%;
    }

    .data-box, .droupdown-box {
        box-shadow: 0px 10px 10px rgba(0,0,0,0.1);
    }

    .dropdown-menu {
        max-height: 300px;
        min-width: 200px;
        /* overflow-y: auto; */
    }

    .md-datepicker-calendar-pane {
        z-index: 9999;
    }
</style>

<section class="content" ng-init="loaddata()">
    <form class="form-horizontal ng-pristine ng-valid" role="form" name="myForm" method="post" novalidate>
        <div class="box box-primary">
            <div class="box-header with-border">
                <h3 class="box-title">Active Deactive Employee</h3>
                <div class="box-tools pull-right">
                    <button type="button" class="btn btn-box-tool" data-widget="collapse"><i class="fa fa-minus"></i></button>
                </div>
            </div>
            <div class="box-body">
                <div class="col-sm-12">
                    <table class="table table-responsive table-bordered">
                        <thead>
                            <tr>
                                <th>SL No.</th>
                                <th>Employee Name</th>
                                <th>Designation</th>
                                <th>Activate/Deactivate</th>                            
                            </tr>
                        </thead>
                        <tbody>
                            <tr ng-repeat="obj in get_employeelist">
                                <td>{{$index+1}}</td>
                                <td>{{obj.employeename}}</td>
                                <td>{{obj.HRMDES_DesignationName}}</td>
                                <td>
                                    <label class="radio-inline">
                                        <input type="checkbox" ng-model="obj.Activeflag" ng-true-value="1" ng-false-value="0" name="scldbet">
                                        <span class="lbl padding-8"></span>                                       
                                    </label>
                                    <span class="lbl padding-8" ng-if="obj.Activeflag==1" style="color:green;font-weight:700">Actived</span>
                                    <span class="lbl padding-8" ng-if="obj.Activeflag==0" style="color:red;font-weight:700">Deactived</span>
                                </td>                               
                            </tr>
                        </tbody>
                    </table>


                </div>

                <div class="box-body">
                    <div class="text-center">
                        <md-button type="submit" class="md-raised md-primary" ng-disabled="form.$invalid" ng-click="Savedata()" id="save-btn">
                            <i class="fa fa-floppy-o" aria-hidden="true"></i>
                            Save
                        </md-button>
                        <md-button class="md-raised md-warn" ng-click="cancel()">
                            <i class="fa fa-times" aria-hidden="true"></i>
                            Cancel
                        </md-button>
                        <!--<md-button type="button" class="md-raised md-primary" id="print-btn" ng-show="screport" ng-click="Print()">
                            <i class="fa fa-print" aria-hidden="true"></i>
                            Print
                        </md-button>
                        <md-button type="submit" class="md-raised md-primary" ng-show="export" ng-click="exportToExcel('#PrintInwardData,#PrintOutwardData')">
                            <i class="fa fa-file-excel-o" aria-hidden="true"></i> Excel
                        </md-button>-->
                    </div>
                </div>


            </div>
        </div>
        

    </form>
</section>
