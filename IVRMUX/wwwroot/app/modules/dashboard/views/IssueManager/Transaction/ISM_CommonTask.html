<section class="content" ng-init="Loaddata()">
    <div class="box box-primary">
        <div class="box-header with-border">
            <h3 class="box-title">Common Task</h3>
            <div class="box-tools pull-right">
                <button type="button" class="btn btn-box-tool" data-widget="collapse" data-placement="bottom" data-toggle="tooltip" title="collapsible"><i class="fa fa-minus"></i></button>
            </div>
        </div>
        <div class="box-body">
            <form class="form-horizontal ng-pristine ng-valid" role="form" name="frmmodule" novalidate>
                <div class="row">
                    <div class="col-sm-6">
                        <div class="form-group">
                            <label class="control-label col-sm-4">Task :</label>
                            <div class="col-sm-8">
                                <input type="text" name="task" class="form-control" ng-model="ismtask" placeholder="Enter Task Name.." required />
                                <div class="error-messages text-center" ng-if="interacted(frmmodule.task)" ng-messages="frmmodule.task.$error">
                                    <div ng-message="required">Enter Task Name</div>
                                </div>
                            </div>
                        </div>

                        <div class="form-group" style="padding-top:10px;">
                            <label class="control-label col-sm-4">Description:</label>
                            <div class="col-sm-8">
                                <textarea maxlength="250" name="remarks" ng-model="spccE_Remarks" class="form-control" resize: none; rows="5" />
                                <div class="error-messages" ng-if="interacted(frmmodule.remarks)" ng-messages="frmmodule.remarks.$error">
                                    <div ng-message="required">Enter "></div>
                                </div>
                            </div>
                        </div>

                        <div class="form-group" ng-show="dateflag">
                            <label class="control-label col-sm-4">Start Date:<span style="color:Red">*</span></label>
                            <div class="col-sm-8" style="padding-left:0px;">
                                <md-datepicker name="startdate" ng-model="spccE_StartDate" md-placeholder="Select date..." required></md-datepicker>
                                <div class="error-messages" ng-if="interacted(frmmodule.startdate)" ng-messages="frmmodule.startdate.$error">
                                    <div ng-message="required">Please Select Start Date</div>
                                </div>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="control-label col-sm-4">Start Date:<span style="color:Red">*</span></label>
                            <div class="col-sm-8" style="padding-left:0px;">
                                <md-datepicker name="startdate" ng-model="spccE_StartDate" md-placeholder="Start Date..." required></md-datepicker>
                                <div class="error-messages" ng-if="interacted(frmmodule.startdate)" ng-messages="frmmodule.startdate.$error">
                                    <div ng-message="required">Please Select Start Date</div>
                                </div>
                            </div>
                        </div>

                        <div class="form-group" ng-show="changeradiobutton">
                            <label class="control-label col-sm-4"> Day Name :<strong style="color:red;display:inline; font-weight: bolder; margin-left: 1px;">*</strong></label>
                            <div class="multiselect col-sm-8">
                                <input class="form-control" ng-model="searchchkbxday" type="text" placeholder="search here...">
                                <label>
                                    <input name="stdd" value="1" ng-model="usercheckday" type="checkbox" data-ng-click="all_checkDay()">
                                    <span class="lbl padding-8">
                                        All
                                    </span>
                                </label>
                                <label data-ng-model="ASMS_Id" ng-repeat="day in daylist |filter:searchchkbxday" value="{{day.fomD_Id}}">
                                    <input name="ddy" value="1" data-ng-model="day.selectday" type="checkbox" ng-click="togchkbxDay();" ng-required="isOptionsRequiredDay()">
                                    <span class="lbl padding-8">
                                        {{day.fomD_DayName}}
                                    </span>
                                </label>
                            </div>
                            <div class="error-messages" ng-if="interacted(frmmodule.ddy)" ng-messages="frmmodule.ddy.$error">
                                <div ng-message="required" style="color:red">Select Day Name</div>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="control-label col-sm-4"> Department :<strong style="color:red;display:inline; font-weight: bolder; margin-left: 1px;">*</strong></label>
                            <div class="multiselect col-sm-8">
                                <input class="form-control" ng-model="searchchkbxdept" type="text" placeholder="search here...">
                                <label>
                                    <input name="stdd" value="1" ng-model="usercheckdept" type="checkbox" data-ng-click="all_checkdept()">
                                    <span class="lbl padding-8">
                                        All
                                    </span>
                                </label>
                                <label data-ng-model="hrmD_Id" ng-repeat="dept in departmentlist |filter:searchchkbxdept" value="{{dept.hrmD_Id}}">
                                    <input name="dpt" value="1" data-ng-model="dept.selectdept" type="checkbox" ng-change="change_dept();" ng-required="isOptionsRequireddept()">
                                    <span class="lbl padding-8">
                                        {{dept.hrmD_DepartmentName}}
                                    </span>
                                </label>
                            </div>

                            <div class="error-messages" ng-if="interacted(frmmodule.dpt)" ng-messages="frmmodule.dpt.$error">
                                <div ng-message="required" style="color:red">Select Department Name</div>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="checkbox-inline">
                                <input type="checkbox" data-ng-model="spccE_SponsorFlag">
                                <span class="lbl padding-8">Send Notification</span>
                            </label>
                        </div>
                    </div>
                    <div class="col-sm-6">
                        <div class="form-group">
                            <div class="radio text-center well" ng-init="Type='weekly'">
                                <label>
                                    <input name="optradio3" type="radio" value="weekly" data-ng-model="Type" required ng-change="get_radiobuttonvalue();">
                                    <span class="lbl padding-8">Weekly</span>
                                </label>
                                <label>
                                    <input name="optradio3" type="radio" value="daily" data-ng-model="Type" required ng-change="get_radiobuttonvalue();">
                                    <span class="lbl padding-8">Daily</span>
                                </label>
                                <label>
                                    <input name="optradio3" type="radio" value="monthly" data-ng-model="Type" required ng-change="get_radiobuttonvalue();">
                                    <span class="lbl padding-8">Monthly</span>
                                </label>
                            </div>
                            <div class="error-messages" ng-if="interacted(frmmodule.optradio3)" ng-messages="frmmodule.optradio3.$error">
                                <div ng-message="required">Select any one of the radio button</div>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="control-label col-sm-4">Venue:<span style="color:Red">*</span></label>
                            <div class="col-sm-8">
                                <select class="form-control" ng-model="ismmvnE_Id" name="venue" required>
                                    <option value="">--Select--</option>
                                    <option ng-repeat="val in venuelsit" value="{{val.ismmvnE_Id}}" ng-selected="val.Selected==true">
                                        {{val.ismmvnE_VenueName}}
                                    </option>
                                </select>
                                <div class="error-messages" ng-if="interacted(frmmodule.venue)" ng-messages="frmmodule.venue.$error">
                                    <div ng-message="required">Select Venue Name</div>
                                </div>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="control-label col-sm-4">Meeting Room:<span style="color:Red">*</span></label>
                            <div class="col-sm-8">
                                <select class="form-control" ng-model="ismmmeR_Id" name="room" required>
                                    <option value="">--Select--</option>
                                    <option ng-repeat="val in mettingroomlist" value="{{val.ismmmeR_Id}}" ng-selected="val.Selected==true">
                                        {{val.ismmmeR_MeetingRoomName}}
                                    </option>
                                </select>
                                <div class="error-messages" ng-if="interacted(frmmodule.room)" ng-messages="frmmodule.room.$error">
                                    <div ng-message="required">Select Meeting Room</div>
                                </div>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="control-label col-sm-4">Minutes Of Meeting:<span style="color:Red">*</span></label>
                            <div class="col-sm-8">
                                <select class="form-control" ng-model="spccmeV_Id" name="venue" required>
                                    <option value="">--Select--</option>
                                    <option ng-repeat="val in venuelist" value="{{val.spccmeV_Id}}" ng-selected="val.Selected==true">
                                        {{val.spccmeV_EventVenue}}
                                    </option>
                                </select>
                                <div class="error-messages" ng-if="interacted(frmmodule.venue)" ng-messages="frmmodule.venue.$error">
                                    <div ng-message="required">Select Minutes Of Meeting</div>
                                </div>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="control-label col-sm-4">End Date:<span style="color:Red">*</span></label>
                            <div class="col-sm-8" style="padding-left:0px;">
                                <md-datepicker name="enddate" ng-model="spccE_EndDate" md-placeholder="End Date..." required></md-datepicker>
                                <div class="error-messages" ng-if="interacted(frmmodule.enddate)" ng-messages="frmmodule.enddate.$error">
                                    <div ng-message="required">Please Select End Date</div>
                                </div>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="control-label col-sm-4"> Designation :<strong style="color:red;display:inline; font-weight: bolder; margin-left: 1px;">*</strong></label>
                            <div class="multiselect col-sm-8">
                                <input class="form-control" ng-model="searchchkbxdesg" type="text" placeholder="search here...">
                                <label>
                                    <input name="stdd" value="1" ng-model="usercheckdesg" type="checkbox" data-ng-click="all_checkdesg()">
                                    <span class="lbl padding-8">
                                        All
                                    </span>
                                </label>
                                <label data-ng-model="hrmdeS_Id" ng-repeat="desg in designationlist |filter:searchchkbxdesg" value="{{desg.hrmdeS_Id}}">
                                    <input name="desg" value="1" data-ng-model="desg.selectdesg" type="checkbox" ng-click="change_desig();" ng-required="isOptionsRequireddesg()">
                                    <span class="lbl padding-8">
                                        {{desg.hrmdeS_DesignationName}}
                                    </span>
                                </label>
                            </div>

                            <div class="error-messages" ng-if="interacted(frmmodule.desg)" ng-messages="frmmodule.desg.$error">
                                <div ng-message="required" style="color:red">Select Designation</div>
                            </div>

                        </div>

                        <div class="form-group">
                            <label class="control-label col-sm-4"> Employee :<strong style="color:red;display:inline; font-weight: bolder; margin-left: 1px;">*</strong></label>
                            <div class="multiselect col-sm-8">
                                <input class="form-control" ng-model="searchchkbxemp" type="text" placeholder="search here...">
                                <label>
                                    <input name="stdd" value="1" ng-model="usercheckemp" type="checkbox" data-ng-click="all_checkemp()">
                                    <span class="lbl padding-8">
                                        All
                                    </span>
                                </label>
                                <label data-ng-model="hrmE_Id" ng-repeat="emp in employeelist |filter:searchchkbxemp" value="{{emp.hrmE_Id}}">
                                    <input name="empp" value="1" data-ng-model="emp.selectemp" type="checkbox" ng-click="togchkbxemp();" ng-required="isOptionsRequiredemp()">
                                    <span class="lbl padding-8">
                                        {{emp.hrmE_EmployeeFirstName}}  :  {{emp.hrmE_EmployeeCode}}
                                    </span>
                                </label>
                            </div>

                            <div class="error-messages" ng-if="interacted(frmmodule.empp)" ng-messages="frmmodule.empp.$error">
                                <div ng-message="required" style="color:red">Select Section</div>
                            </div>
                        </div>
                    </div>
                </div>
                <hr />
                <div class="text-center">
                    <input type="hidden" ng-model="ismmclT_Id" value="{{ismmclT_Id}}" />
                    <md-button type="button" class="md-raised md-primary" ng-disabled="form.$invalid" ng-click="savedata()" id="save-btn">
                        <i class="fa fa-list-alt" aria-hidden="true"></i>
                        Save
                    </md-button>
                    <md-button type="button" class="md-raised md-warn" ng-click="Clearid()">
                        <i class="fa fa-times" aria-hidden="true"></i>
                        Cancel
                    </md-button>
                </div>
            </form>
        </div>
    </div>

    <div class="box box-primary">
        <div class="box-header with-border">
            <h3 class="box-title">Common Task Details</h3>
            <div class="box-tools pull-right">
                <button type="button" class="btn btn-box-tool" data-widget="collapse" data-placement="bottom" data-toggle="tooltip" title="collapsible"><i class="fa fa-minus"></i></button>
            </div>
        </div>
        <div class="box-body">
            <div class="row">
                <div class="col-sm-4">
                    <div class="form-group">
                        <label class="control-label">
                            <b> Total Grid Records :</b>
                            <label class="badge">
                                {{newuser.length}}
                            </label>
                        </label>
                    </div>
                </div>

                <div class="col-sm-4 pull-right">
                    <div class="form-group">
                        <div class="input-group">
                            <span class="input-group-addon">
                                <i class="fa fa-search"></i>
                            </span>
                            <input class="form-control" ng-model="searchValueU" type="text" placeholder="search here...">
                        </div>
                    </div>
                </div>
            </div>
            <div style="overflow-x:auto">
                <table class="table table-hover table-responsive table-bordered">
                    <thead>
                        <tr>
                            <th class="text-center">SL NO</th>
                            <th class="text-center"><a href="" ng-click="sortBy('ivrmM_ModuleName')">Company Name</a></th>
                            <th class="text-center"><a href="" ng-click="sortBy('ivrmM_ModuleName')">Department Name</a></th>
                            <th class="text-center"><a href="" ng-click="sortBy('ivrmM_ModuleDesc')">Remarks </a></th>
                            <th class="text-center"><a href="" ng-click="sortBy('ivrmM_ModuleDesc')">Deviation Flag </a></th>
                            <th class="text-center">Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr dir-paginate="userU in lengthval = (newuser | filter : searchValueU)  | orderBy:propertyName:reverse |itemsPerPage:itemsPerPageU"
                            current-page="currentPageU" ng-class-odd="'odd'">
                            <td class="text-center">{{itemsPerPageU *(currentPageU-1)+$index+1}}</td>
                            <td class="text-left">{{userU.instituitonname}}</td>
                            <td class="text-left">{{userU.departmentname}}</td>
                            <td class="text-left">{{userU.remarks}}</td>
                            <td class="text-center">
                                <i ng-if="userU.ismdR_ReasonFlag==true" class="fa fa-check text-green" title="Deviation Flag True"></i>
                                <i ng-if="userU.ismdR_ReasonFlag==false" class="fa fa-times text-red" title="Deviation Flag False"></i>
                            </td>
                            <td class="text-center">
                                <a class="text-aqua" href="" ng-click="Editdata(userU)" data-placement="bottom" data-toggle="tooltip" title="Edit">
                                    <i class="fa fa-pencil-square-o" aria-hidden="true"></i>
                                </a>
                                |
                                &nbsp;
                                <span ng-if="userU.ismdR_ActiveFlag === false">
                                    <a href="" ng-click="deactive(userU)"
                                       class="text-green" data-placement="bottom" data-toggle="tooltip" title="Activate">
                                        <i> Activate </i>
                                    </a>
                                </span>
                                <span ng-if="userU.ismdR_ActiveFlag === true">
                                    <a href="" ng-click="deactive(userU)"
                                       class="text-danger" data-placement="bottom" data-toggle="tooltip" title="Deactivate">
                                        <i> Deactivate</i>
                                    </a>
                                </span>
                            </td>
                            <td hidden="hidden">{{newuser.ivrmM_Id}}</td>
                        </tr>
                    </tbody>
                </table>
                <dir-pagination-controls max-size="5"
                                         direction-links="true"
                                         boundary-links="true">
                </dir-pagination-controls>
            </div>
        </div>
    </div>
</section>
