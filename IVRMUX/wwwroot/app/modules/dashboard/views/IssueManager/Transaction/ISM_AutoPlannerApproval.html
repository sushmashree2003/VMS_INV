<style>

    .theadab-dark {
        background-color: #797978;
    }
</style>
<section class="content" ng-init="loaddata()">
    <form class="form-horizontal ng-pristine ng-valid" role="form" name="myForm" novalidate>
        <div class="box box-primary">
            <div class="box-header with-border">
                <h3 class="box-title">Planner  Auto Approval   </h3>
                <div class="box-tools pull-right">
                    <button type="button" class="btn btn-box-tool" data-widget="collapse"><i class="fa fa-minus"></i></button>
                </div>
            </div>
            <div class="box-body" ng-if="get_userEmplist.length > 0">
                <div class="row">
                    <div class="col-sm-12 form-horizontal">
                        <div class="col-sm-6 col-sm-offset-3">
                            <div class="form-group">
                                <label class="control-label col-sm-4">Employee Name :<strong style="color:red;">*</strong></label>
                                <div class="multiselect col-sm-8">
                                    <input class="form-control" ng-model="searchValue" type="text" placeholder="search Employee Name here..." ng-paste="$event.preventDefault()" onkeydown="return false">
                                    <label>
                                        <input name="alitem" value="1" ng-model="allmi" type="checkbox" ng-click="all_miid(allmi)">
                                        <span class="lbl padding-8">
                                            All
                                        </span>
                                    </label>
                                    <label ng-repeat="mi in get_userEmplist | filter : searchValue">
                                        <input name="mi" ng-model="mi.checked" type="checkbox" ng-required="isRequiredmi()">
                                        <span class="lbl padding-8">
                                            {{mi.HRME_EmployeeFirstName}} /{{mi.HRME_EmployeeCode}}
                                        </span>
                                    </label>

                                </div>
                                <div class="error-messages" ng-if="interacted(myForm.mi)" ng-messages="myForm.mi.$error">
                                    <div ng-message="required">Please Select Atleast One checkbox</div>
                                </div>

                            </div>

                        </div>

                    </div>


                </div>
                <hr />
                <div class="row">
                    <div class="col-sm-12 text-center">

                        <md-button type="submit" class="md-raised md-primary" ng-disabled="form.$invalid" ng-click="savedata()" id="save-btn">
                            <i class="fa fa-floppy-o" aria-hidden="true"></i>
                            SAVE
                        </md-button>
                        <md-button type="button" class="md-raised md-warn" ng-click="Clearid()">
                            <i class="fa fa-times" aria-hidden="true"></i>

                            CANCEL
                        </md-button>



                    </div>
                </div>
            </div>
            <div class="box-body" ng-if="get_userEmplist.length == 0">
                <div class="text-center"><b style="color:red">Planner Not Available For  Auto Approval </b></div>
            </div>

        </div>
    </form>
    <div class="box box-primary" ng-show="get_employeelist.length>0">
        <div class="box-header with-border">
            <h3 class="box-title">Planner  Auto Approval</h3>
            <div class="box-tools pull-right">
                <button type="button" class="btn btn-box-tool" data-widget="collapse" data-placement="bottom" data-toggle="tooltip" title="collapsible"><i class="fa fa-minus"></i></button>
            </div>
        </div>
        <div>
            <div class="box-body">
                <div class="col-sm-12" style="overflow:scroll; max-height:600px;">

                    <table class="table table-bordered table-condensed">
                        <thead>
                            <tr>
                                <th>
                                    SL No
                                </th>
                                <th>
                                    <input type="checkbox" ng-model="obj.alll" ng-click="AllAutoplaner()" />
                                    <span class="lbl padding-8"></span>
                                    Removed Planer
                                </th>
                                <th>
                                    Employee Name
                                </th>
                                <th>
                                    Employee Code
                                </th>
                                <!--<th>
                                    Action
                                </th>-->

                            </tr>
                        </thead>
                        <tbody>
                            <tr ng-repeat="emp in get_employeelist">
                                <td>
                                    {{$index+1}}
                                </td>
                                <td>
                                    <input type="checkbox" ng-model="emp.checked" />
                                    <span class="lbl padding-8"></span>
                                </td>
                                <td>
                                    {{emp.HRME_EmployeeFirstName}}
                                </td>
                                <td>
                                    {{emp.HRME_EmployeeCode}}
                                </td>
                                <!--<td class="text-center">
                                    <a href="" ng-click="deactive(emp)"
                                       class="text-red" data-placement="bottom" data-toggle="tooltip" title="Activate">
                                        <i> Removed Planer </i>
                                    </a>
                                </td>-->
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div class="row">
                    <div class="col-sm-12 text-center">

                        <md-button class="md-raised md-primary" ng-click="deactive()" id="save-btn">
                            <i class="fa fa-floppy-o" aria-hidden="true"></i>
                            Removed Auto Planer
                        </md-button>
                        <md-button type="button" class="md-raised md-warn" ng-click="Clearidtwo()">
                            <i class="fa fa-times" aria-hidden="true"></i>

                            CLEAR
                        </md-button>



                    </div>
                </div>

            </div>
        </div>

    </div>
</section>
