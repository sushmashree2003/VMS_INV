
<section class="content">
    <div data-ng-init="Loaddata()">
        <div class="box box-primary">
            <div class="box-header with-border">
                <h3 class="box-title">CLIENT USER MAPPING</h3>
                <div class="box-tools pull-right">
                    <button type="button" class="btn btn-box-tool" data-widget="collapse"><i class="fa fa-minus"></i></button>
                </div>
            </div>
            <div class="box-body">
                <form class="form-horizontal ng-pristine ng-valid" role="form" name="myForm2" novalidate>
                    <div class="row">
                        <div class="col-sm-6">
                            <div class="form-group">
                                <label class="control-label col-sm-4">Client Name :<span style="color:red;">*</span></label>
                                <div class="col-sm-8">
                                    <select class="form-control" name="clint" id="flor" ng-model="ismmclT_Id" required>
                                        <option value="" label="">--Select Client--</option>
                                        <option ng-repeat="user in clientlist" value="{{user.ismmclT_Id}}" ng-selected="{{option.Selected == true}}">
                                            {{user.ismmclT_ClientName}}
                                        </option>
                                    </select>
                                    <div class="error-messages" ng-if="interacted2(myForm2.clint)" ng-messages="myForm2.clint.$error">
                                        <div ng-message="required">Please Select Client Name</div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="col-sm-6">
                            <div class="form-group">
                                <label for="sel2" class="control-label col-sm-4">User Name : <span style="color:red;">*</span></label>
                                <div class="multiselect col-sm-8">
                                    <input class="form-control" ng-model="searchchkbx1" type="text" placeholder="search here..." />
                                    <label>
                                        <input name="clsoption" value="all" ng-model="usercheckC" type="checkbox" ng-click="all_checkC(usercheckC)">
                                        <span class="lbl padding-8">
                                            All
                                        </span>
                                    </label>
                                    <label ng-repeat="role in ieEmpList | filter:searchchkbx1" value="{{hrmE_Id}}">
                                        <input type="checkbox" ng-model="role.selected" ng-click="togchkbxC()" ng-required="isOptionsRequired()" name="clweres" />
                                        <span class="lbl padding-8">{{role.ieEmpname}}</span>
                                    </label>
                                </div>
                            </div>
                            <div class="error-messages col-sm-offset-4" ng-if="interacted2(myForm2.clweres)" ng-messages="myForm2.clweres.$error">
                                <div ng-message="required">Please Select Any One User Name</div>
                            </div>
                        </div>
                    </div>
                    <hr />
                    <div class="text-center">
                        <input type="hidden" ng-model="ismmcltuS_Id" value="{{ismmcltuS_Id}}" />
                        <md-button type="submit" class="md-raised md-primary" ng-click="saveClientMappingdata()" id="save-btn">
                            <i class="fa fa-floppy-o" aria-hidden="true"></i>
                            Save
                        </md-button>
                        <md-button type="button" class="md-raised md-warn" ng-click="cancel()">
                            <i class="fa fa-times" aria-hidden="true"></i>
                            Cancel
                        </md-button>
                    </div>

                    <div class="box box-primary" ng-show="allIeMappingdata.length>0">
                        <div class="box-header with-border">
                            <h3 class="box-title"> CLIENT USER MAPPING</h3>
                            <div class="box-tools pull-right">
                                <button type="button" class="btn btn-box-tool" data-widget="collapse" data-placement="bottom" data-toggle="tooltip" title="collapsible"><i class="fa fa-minus"></i></button>
                            </div>
                        </div>
                        <div class="box-body">
                            <div class="col-sm-4">
                                <div class="form-group">
                                    <label class="control-label">
                                        <b> Total Grid Records :</b>
                                        <label class="badge">
                                            {{allIeMappingdata.length}}
                                        </label>
                                    </label>
                                </div>
                            </div>
                            <div class="col-sm-4 pull-right">
                                <div class="form-group">
                                    <div class="input-group">
                                        <span class="input-group-addon">
                                            <i class="fa fa-search"></i>
                                        </span>
                                        <input class="form-control" ng-model="searchValue" type="text" placeholder="search here...">
                                    </div>
                                </div>
                            </div>
                            <table class="table table-hover table-responsive table-bordered text-center">
                                <thead>
                                    <tr>
                                        <th>
                                            <a href="" ng-click="sortBy('sno')">SL.No.</a>
                                        </th>
                                        <th><a href="" ng-click="sortBy('ismtcR_TaskNo')">Client</a></th>                                     
                                        <th><a href="" ng-click="sortBy('ismtcR_Title')">User </a> </th>
                                                                          
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr dir-paginate="user in filterValue = (allIeMappingdata | filter : searchValue)  | orderBy:propertyName:reverse |itemsPerPage:itemsPerPage" current-page="currentPage" ng-class-odd="'odd'">
                                        <td class="text-left">{{itemsPerPage *(currentPage-1)+$index+1}}</td>
                                        <td class="text-left">{{user.ismmclT_ClientName}}</td>                                        
                                        <td class="text-left">{{user.username}}</td>                                                                                                                                       
                                    </tr>
                                </tbody>
                            </table>
                            <dir-pagination-controls max-size="5"
                                                     direction-links="true"
                                                     boundary-links="true">
                            </dir-pagination-controls>
                       </div>
                    </div>
                </form>
