<style>
    td {
        background-color: #fafafa;
    }

    .fc-view-container {
        margin-top: -20px;
    }

    .fc-left h2 {
        font-size: 18px;
    }

    .fc-right {
        font-size: 12px;
    }

    .fc-ltr .fc-basic-view .fc-day-number {
        text-align: center !important;
    }

    .fc td, .fc th {
        border-style: none !important;
    }

    .fc-widget-content {
        height: 0px !important;
    }

    .fc-basic-view td.fc-day-number, .fc-basic-view td.fc-week-number span {
        padding-top: 0px !important;
        padding-bottom: 2px;
    }

    .fc-day-number {
        font-size: 15px;
        font-weight: bold;
    }
    .glyphicon glyphicon-play-circle {
        content:none !important;
    }

    thead {
        background: white!important;
        color: black!important;
        text-align: center;
    }

</style>

<section class="content StudentDashBoard" ng-init="loaddata()">

    <div class="box box-primary">
        <div class="box-body">
            <div class="col-xs-12">

                <div class="col-lg-6">
                    <div class="small-box bg-green" style="height: 106px;">
                        <div class="inner">
                            <div class="text-head">
                                <h4 class="col-sm-6"  style="color:white;">Total Tasks  <h3  style="color:white;">{{totaltask}}</h3>  </h4>
                            </div>
                        </div>
                        <div class="icon">
                            <i class="fa fa-fw fa-tasks"></i>
                        </div>
                        <a href="#" class="small-box-footer" ng-click="taskreg()" >View info <i class="fa fa-arrow-circle-right"></i></a>
                    </div>
                   
                </div>

                <div class="col-lg-6">
                    <div class="small-box bg-red" style="height: 106px;">
                        <div class="inner">
                            <div class="text-head">
                                <h4 class="col-sm-6" style="color:white;"> Total Pending Task  <h3  style="color:white;"> {{pendingcount}}</h3> </h4>
                            </div>
                        </div>
                        <div class="icon">
                            <i class="fa fa-fw fa-bug"></i>
                        </div>
                        <a href="#" class="small-box-footer" ng-click="taskreg()" >View info <i class="fa fa-arrow-circle-right"></i></a>
                    </div>
                </div>

                <div class="col-md-12 col-sm-12 col-xs-12">
                    <div class="box box-info">
                        <div class="box-body chart-responsive">
                            <div class="calendar ng-pristine ng-untouched ng-valid ng-isolate-scope fc fc-ltr fc-unthemed" ng-model="eventSources" calendar="myCalendar1" ui-calendar="calendarOptions.calendar" aria-invalid="false"></div>
                        </div>
                    </div>
                </div>

            </div>

        </div>

        <!-- ===============================  GRAPH  ====================================== -->
        <div class="box-body">
            <div class="col-sm-10 col-sm-offset-1">
                <div id="chartColumn" style="height: 300px; width: 100%;"></div>
            </div>
        </div>
    </div>

</section>
