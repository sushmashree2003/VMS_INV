
<section class="content" ng-init="Loaddata()">
    <form class="form-horizontal ng-pristine ng-valid" role="form" name="myForm" method="post" novalidate>

        <div class="box box-primary">
            <dCanceliv class="box-header with-border">
                <h3 class="box-title">WORKING DAY'S</h3>
                <div class="box-tools pull-right">
                    <button type="button" class="btn btn-box-tool" data-widget="collapse"><i class="fa fa-minus"></i></button>
                </div>
            </dCanceliv>
            <div class="box-body">
                <div class="row">

                    <div class="col-sm-6">
                        <div class="form-group">
                            <label class="control-label col-sm-4">Hours :<span style="color:red;">*</span></label>
                            <div class="col-sm-6">
                                <input class="form-control" name="Hours" id="catgry" ng-model="ISMMWD_Hours" placeholder="Enter Hours/day" required ng-blur="get_totalhours();" type="text" allow-pattern="[0-9.]" maxlength="2">
                                <div class="error-messages" ng-if="interacted(myForm.Hours)" ng-messages="myForm.Hours.$error">
                                    <div ng-message="required">Enter the Hours</div>
                                </div>
                            </div>
                        </div>
                        <div>
                            <label class="col-sm-12">Total Working Hours : &nbsp;&nbsp;&nbsp;&nbsp;<b style="color:darkgreen;font-size:15px">{{totalhours}}</b></label>
                        </div>
                    </div>

                    <div class="col-sm-6">
                        <div class="form-group">
                            <label class="control-label col-sm-4">Day's :<span style="color:red;">*</span></label>
                            <div class="multiselect col-sm-6">
                                <label data-ng-model="FOMD_Id" ng-repeat="day in daylist |filter:sportsfilterchkbx" value="{{day.fomD_Id}}">
                                    <input name="day" value="1" data-ng-model="day.selected" type="checkbox" ng-required="isOptionsRequired();" ng-click="selectedDays();" ng-disabled="editflag">
                                    <span class="lbl padding-8">
                                        {{day.fomD_DayName}}
                                    </span>
                                </label>
                            </div>
                            <div class="error-messages col-sm-offset-2" ng-if="interacted(myForm.day)" ng-messages="myForm.day.$error">
                                <div ng-message="required" style="color:red">Select Day</div>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-12">Total Working Day's : &nbsp;&nbsp;&nbsp;&nbsp;<b style="color:darkgreen;font-size:15px">{{count}}</b></label>
                        </div>
                    </div>
                </div>


                <hr />
                <div class="text-center">
                    <input type="hidden" ng-model="ismmwD_Id" value="{{ismmwD_Id}}" />
                    <md-button type="submit" class="md-raised md-primary" ng-disabled="form.$invalid" ng-click="saverecord()" id="save-btn">
                        <i class="fa fa-floppy-o" aria-hidden="true"></i>
                        Save
                    </md-button>
                    <md-button type="button" class="md-raised md-warn" ng-click="Clearid()">
                        <i class="fa fa-times" aria-hidden="true"></i>
                        Cancel
                    </md-button>
                </div>
            </div>
        </div>

    </form>

    <div class="box box-primary" ng-show="alldata.length>0">

        <div class="box-header with-border">
            <h3 class="box-title">WORKING DAY'S</h3>
            <div class="box-tools pull-right">
                <button type="button" class="btn btn-box-tool" data-widget="collapse" data-placement="bottom" data-toggle="tooltip" title="collapsible"><i class="fa fa-minus"></i></button>
            </div>
        </div>


        <div class="box-body">

            <div class="col-sm-4">
                <div class="form-group">
                    <label class="control-label">
                        <b> Total Grid Records :</b>
                        <label class="badge">
                            {{alldata.length}}
                        </label>
                    </label>
                </div>
            </div>

            <div class="col-sm-4">
                <div class="form-group" ng-if="search!=''">
                    <label class="control-label">
                        <b>Total Records Searched : </b>
                        <label class="badge">
                            {{filterValue.length}}
                        </label>
                    </label>
                </div>
            </div>

            <div class="col-sm-4 pull-right">
                <div class="form-group">
                    <div class="input-group">
                        <span class="input-group-addon">
                            <i class="fa fa-search"></i>
                        </span>
                        <input class="form-control" type="text" ng-model="search" placeholder="search here...">
                    </div>
                </div>
            </div>

            <table class="table table-hover table-responsive table-bordered text-center">
                <thead>
                    <tr>
                        <th>
                            SL.No.
                        </th>

                        <th>
                            <a href="" ng-click="sort('fomD_DayName')">Day Name</a>
                        </th>
                        <th>
                            <a href="" ng-click="sort('ismmwD_Hours')">Per Day Hours</a>
                        </th>
                       
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>

                    <tr dir-paginate="user in filterValue=(alldata | filter : search) | orderBy:sortKey:reverse |itemsPerPage:itemsPerPage" current-page="currentPage">
                        <td>{{itemsPerPage *(currentPage-1)+$index+1}}</td>
                        <td>{{user.fomD_DayName}}</td>
                        <td>{{user.ismmwD_Hours}}</td>
                        <td style="text-align:center">
                            <a href="javascript:void(0)" ng-click="EditData(user)" class="text-primary" data-placement="bottom" data-toggle="tooltip" title="Edit">
                                <i class="fa fa-pencil-square-o" aria-hidden="true"></i>
                            </a>

                            <span ng-if="!user.ismprtY_ActiveFlag">
                                <a href="" ng-click="deactiveY(user)" class="text-green" data-placement="bottom" data-toggle="tooltip" title="Activate">
                                    Activate
                                </a>
                            </span>
                            <span ng-if="user.ismprtY_ActiveFlag">
                                <a href="" ng-click="deactiveY(user)" class="text-danger" data-placement="bottom" data-toggle="tooltip" title="Deactivate">
                                    Deactivate
                                </a>
                            </span>
                        </td>
                    </tr>
                </tbody>
            </table>
            <dir-pagination-controls max-size="5"
                                     direction-links="true"
                                     boundary-links="true">
            </dir-pagination-controls>
        </div>
    </div>
</section>
