
<link href="./css/ISM/site.css" rel="stylesheet" />
<link href="./css/ISM/StyleSheet.css" rel="stylesheet" />

<section class="content" ng-init="loaddata()">
    <form class="form-horizontal ng-pristine ng-valid" role="form" name="myForm" method="post" novalidate>
        <div class="box box-primary">
            <div class="box-header with-border">
                <h3 class="box-title"> Remarks-Wise Deviation Report </h3>
                <div class="box-tools pull-right">
                    <button type="button" class="btn btn-box-tool" data-widget="collapse"><i class="fa fa-minus"></i></button>
                </div>
            </div>
            <div class="box-body">
                <div class="col-sm-5">
                    <div class="form-group">
                        <label class="control-label col-sm-4">Start Date:<span style="color:red;">*</span></label>
                        <div class="col-sm-8">
                            <md-datepicker ng-model="start_Date" ng-disabled="plannerflg" name="startdate" id="date1" md-placeholder="Enter date" md-max-date="end_Date" required></md-datepicker>
                        </div>
                        <div class="error-messages" ng-if="interacted(myForm.startdate)" ng-messages="myForm.startdate.$error">
                            <div ng-message="required" class="col-sm-8 col-sm-offset-6">Select Start Date</div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="control-label col-sm-4">End Date:<span style="color:red;">*</span></label>
                        <div class="col-sm-8">
                            <md-datepicker ng-model="end_Date" name="endate" ng-disabled="plannerflg" md-min-date="start_Date" md-placeholder="Enter Date" required></md-datepicker>
                        </div>
                        <div class="error-messages" ng-if="interacted(myForm.endate)" ng-messages="myForm.endate.$error">
                            <div ng-message="required" class="col-sm-8 col-sm-offset-6">Select End Date</div>
                        </div>
                    </div>
                    <div class="form-group">
                        <div class="text-left" ng-init="noofdays='0'">
                            <label class="radio-inline">
                                <input type="radio" value="0" name="all" ng-model="noofdays">
                                <span class="lbl padding-8"> All</span>
                            </label>
                            <label class="radio-inline">
                                <input type="radio" value="10" name="ten" ng-model="noofdays">
                                <span class="lbl padding-8">  <b>></b> 10 Days </span>
                            </label>
                            <label class="radio-inline">
                                <input type="radio" value="20" name="twenty" ng-model="noofdays">
                                <span class="lbl padding-8">  <b>></b> 20 Days</span>
                            </label>
                            <label class="radio-inline">
                                <input type="radio" value="30" name="month" ng-model="noofdays">
                                <span class="lbl padding-8">  <b>></b> One Month</span>
                            </label>
                        </div>
                    </div>
                </div>
                <div class="col-sm-4">
                    <div class="form-group">
                        <div class="multiselect col-sm-8">
                            <span ng-show="get_userEmplist.length>0">
                                <input class="form-control" ng-model="searchValueUEM" type="text" placeholder="search Employee here...">
                            </span>
                            <label>
                                <input name="all" value="1" ng-model="checkall" type="checkbox" ng-click="all_check(checkall)">
                                <span class="lbl padding-8">
                                    All
                                </span>
                            </label>
                            <label ng-repeat="user in get_userEmplist | filter : searchValueUEMD">
                                <input name="emp" ng-model="user.empck" type="checkbox" ng-click="togchkbx();" title="Select Employee" ng-required="isOptionsRequired()">
                                <span class="lbl padding-8">
                                    <b>  {{user.userEmpName}}</b> : {{user.HRMD_DepartmentName}}
                                </span>
                            </label>
                        </div>
                        <div class="error-messages" ng-if="interacted(myForm.emp)" ng-messages="myForm.emp.$error">
                            <div ng-message="required" class="col-sm-8">Please Select Atleast One checkbox</div>
                        </div>
                    </div>
                </div>
                <div class="col-sm-2">
                    <div class="form-group">
                        <div class="multiselect" style="width:100%;">
                            <span ng-show="get_Status.length>0">
                                <input class="form-control" ng-model="searchValueS" type="text" placeholder="search Status here...">
                            </span>
                            <label>
                                <input name="all" value="1" ng-model="checkallS" type="checkbox" ng-click="all_checkS(checkallS)">
                                <span class="lbl padding-8">
                                    All
                                </span>
                            </label>
                            <label ng-repeat="user in get_Status | filter : searchValueSD">
                                <input name="status" ng-model="user.stck" type="checkbox" ng-click="togchkbxS();" title="Select Status" ng-required="isOptionsRequiredS()">
                                <span class="lbl padding-8">
                                    {{user.ISMMISTS_StatusName}}
                                </span>
                            </label>
                        </div>
                        <div class="error-messages" ng-if="interacted(myForm.status)" ng-messages="myForm.status.$error">
                            <div ng-message="required" class="col-sm-8">Please Select Atleast One checkbox</div>
                        </div>
                    </div>
                </div>
            </div>
            <hr />
            <div class="text-center">
                <md-button type="button" class="md-raised md-primary" ng-disabled="form.$invalid" ng-click="deviationremarksReport()" id="save-btn">
                    <i class="fa fa-search-minus" aria-hidden="true"></i>
                    Deviation Report
                </md-button>
                <!--<md-button ng-if="get_deviationRemarksReport.length>0" type="submit" class="md-raised md-primary" id="save-btn" ng-click="printData()">
                    <i class="fa fa-floppy-o" aria-hidden="true"></i>
                    Print
                </md-button>
                <md-button ng-show="get_deviationRemarksReport.length>0" type="button" class="md-raised md-primary" id="excel-btn" aria-disabled="false" ng-click="exportToExcel('#printDRR')">
                    <i class="fa fa-file-excel-o" aria-hidden="true"></i>
                    Export To Excel
                </md-button>-->
                <md-button type="button" ng-if="get_deviationRemarksReport.length>0" class="md-raised md-warn" ng-click="Clear()" ng-disabled="form.$invalid">
                    <i class="fa fa-times" aria-hidden="true"></i> Clear
                </md-button>
            </div>

        </div>
    </form>


    <div class="box box-primary">
        <div class="box-header with-border">
            <h3 class="box-title">REMARKS-WISE DEVIATION REPORT</h3>
            <div class="box-tools pull-right">
                <button type="button" class="btn btn-box-tool" data-widget="collapse" data-placement="bottom" data-toggle="tooltip" title="collapsible"><i class="fa fa-minus"></i></button>
            </div>
        </div>
        <div id="printDRR">
            <div class="box-body">
                <div id="gridall" style="overflow:scroll"></div>
                <div id="table">
                </div>
            </div>
