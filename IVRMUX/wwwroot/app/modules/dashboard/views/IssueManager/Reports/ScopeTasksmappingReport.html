                <div class="box-body" ng-show="get_report.length>0">

                    <table class="table table-hover table-responsive table-bordered" id="table">
                        <thead>
                            <tr>
                                <th class="hdTH" ng-if="get_report.length>1">
                                    <label>
                                        <input name="checkalltask" type="checkbox" ng-model="checkalltask" ng-click="togglecheckboxAll(checkalltask)">
                                        <span class="lbl padding-8"></span><span style="color:lightgreen;font-size:20px;"></span>
                                    </label>
                                </th>
                                <th ng-if="get_report.length<=1"></th>
                                <th><a href="" ng-click="sortBy('sno')"><b>SL.No.</b></a></th>
                                <th><a href="" ng-click="sortBy('ISMTCR_TaskNo')"><b>Task Number</b></a> </th>

                                <th><a href="" ng-click="sortBy('ISMTCR_Title')"><b>Task Title</b></a> </th>
                                <th><a href="" ng-click="sortBy('ISMTCR_Desc')"><b>Task Description</b></a> </th>
                                <th><a href="" ng-click="sortBy('CreatedDate')"><b>Task Created Date</b></a> </th>

                                <!--<th><a href="" ng-click="sortBy('INVMI_ItemName')"><b>Task Assigned To</b></a> </th>-->

                            </tr>
                        </thead>
                        <tbody ng-repeat="user in get_report">
                            <tr>
                                <td class="hidden">{{user.ISMTCR_Id}}</td>
                                <td class="text-center">
                                    <input type="checkbox" ng-model="user.checked" ng-change="optionToggled(user,user.length+1)">
                                    <span class="lbl padding-8"></span><span style="color:lightgreen;font-size:20px;"></span>
                                </td>
                                <td class="text-center">{{$index+1}}</td>
                                <td class="text-center">{{user.ISMTCR_TaskNo}}</td>
                                <td class="text-center">{{user.ISMTCR_Title}}</td>
                                <td class="text-center">{{user.ISMTCR_Desc}}</td>
                                <td class="text-center">{{user.CreatedDate| date:'dd/MM/yyyy'}}</td>
                                <!--<td class="text-center">{{user.June}}</td>-->
                                <!--<td class="text-center">{{user.July}}</td>
                    <td class="text-center">{{user.August}}</td>
                    <td class="text-center">{{user.September}}</td>-->
