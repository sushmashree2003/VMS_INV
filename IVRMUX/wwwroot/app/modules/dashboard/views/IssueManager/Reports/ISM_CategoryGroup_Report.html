
<link href="./css/ISM/site.css" rel="stylesheet" />
<link href="./css/ISM/StyleSheet.css" rel="stylesheet" />
<section class="content" ng-init="loaddata()">
    <form class="form-horizontal ng-pristine ng-valid" role="form" name="myForm" method="post" novalidate>
        <div class="box box-primary">
            <div class="box-header with-border">
                <h3 class="box-title">Categroy Group Report </h3>
                <div class="box-tools pull-right">
                    <button type="button" class="btn btn-box-tool" data-widget="collapse"><i class="fa fa-minus"></i></button>
                </div>
            </div>
            <div class="box-body">
                <div class="row">
                    <div class="col-sm-12">
                        <div class="col-sm-6">
                            <div class="form-group">
                                <label class="control-label col-sm-4">Department: <span style="color:red">*</span></label>
                                <div class="col-sm-8">
                                    <select class="form-control" ng-model="Dept_Id" name="deptid" required ng-change="onchangedept()">
                                        <option value="">--Select Department--</option>
                                        <option ng-repeat="dept in department_list" value="{{dept.HRMDC_ID}}">{{dept.HRMDC_Name}}</option>
                                    </select>
                                </div>

                                <div class="error-messages" ng-if="interacted(myForm.deptid)" ng-messages="myForm.deptid.$error">
                                    <div ng-message="required" style="color:red">Select Department </div>
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="control-label col-sm-4">Employee :<span style="color:red">*</span> </label>
                                <div class="multiselect col-sm-8">
                                    <input class="form-control" ng-model="searchchkbxtype" type="text" placeholder="search here...">
                                    <label>
                                        <input type="checkbox" name="type" value="1" ng-model="userchecktype" data-ng-click="all_checktype()" />
                                        <span class="lbl padding-8">All</span>
                                    </label>
                                    <label data-ng-model="HRMD_Id" ng-repeat="dept in getemployee|filter:filterchkbxtype" value="{{dept.HRME_Id}}">
                                        <input type="checkbox" name="department" value="1" data-ng-model="dept.selectdemployee" ng-click="togchkbxtype()" ng-required="isOptionsRequiredtype()" />
                                        <span class="lbl padding-8">{{dept.userEmpName}}</span>
                                    </label>
                                </div>
                                <div class="error-messages text-center" ng-if="interacted(myForm.department)" ng-messages="myForm.department.$error">
                                    <div ng-message="required" style="color:red">Select Employee</div>
                                </div>
                            </div>
                        </div>
                        <div class="col-sm-6">
                            <div class="form-group">
                                <label class="control-label col-sm-4" style="text-align:center">Cateogry :<span style="color:red">*</span> </label>
                                <div class="multiselect col-sm-8">
                                    <input class="form-control" ng-model="filterchkbxsearch" type="text" placeholder="search here...">
                                    <label>
                                        <input type="checkbox" name="stdd" value="1" ng-model="usercheck" data-ng-click="all_check()" />
                                        <span class="lbl padding-8">All</span>
                                    </label>
                                    <label data-ng-model="ISMMTCAT_Id" ng-repeat="group in getcategory |filter:filterchkbx" value="{{group.ismmtcaT_Id}}">
                                        <input type="checkbox" name="taskgroup" value="1" data-ng-model="group.selectdcaategory" ng-click="togchkbx()" ng-required="isOptionsRequired()" />
                                        <span class="lbl padding-8">{{group.ismmtcaT_TaskCategoryName}}</span>
                                    </label>
                                </div>
                                <div class="error-messages" ng-if="interacted(myForm.taskgroup)" ng-messages="myForm.taskgroup.$error">
                                    <div ng-message="required" style="color:red">Select Cateogry</div>
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="control-label col-sm-4">Start Date:<span style="color:red;">*</span></label>
                                <div class="col-sm-8">
                                    <md-datepicker ng-model="start_Date" onkeypress="return false" name="startdate" md-placeholder="Enter Date" ng-change="onchangestartdate()" required>
                                    </md-datepicker>
                                    <div class="error-messages" ng-if="interacted(myForm.startdate)" ng-messages="myForm.startdate.$error">
                                        <div ng-message="required">Select Start Date</div>
                                        <div ng-message="valid">The entered value is not Valid!</div>
                                    </div>
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="control-label col-sm-4">End Date:<span style="color:red;">*</span></label>
                                <div class="col-sm-8">
                                    <md-datepicker ng-model="end_Date" name="endate" ng-disabled="!start_Date" md-min-date="start_Date" md-max-date="getMaxDate" md-placeholder="Enter Date" required></md-datepicker>
                                </div>
                                <div class="error-messages" ng-if="interacted(myForm.endate)" ng-messages="myForm.endate.$error">
                                    <div ng-message="required">Select End Date</div>
                                    <div ng-message="valid">The entered value is not Valid!</div>
                                </div>
                            </div>

                        </div>

                    </div>

                </div>
                <hr />
                <div class="text-center">
                    <md-button type="button" class="md-raised md-primary" ng-disabled="form.$invalid" ng-click="categorygroupReport()" id="save-btn">
                        <i class="fa fa-search-minus" aria-hidden="true"></i>
                        Report
                    </md-button>                 
                    
                    <md-button type="button" class="md-raised md-warn" ng-click="Clear()" ng-disabled="form.$invalid">
                        <i class="fa fa-times" aria-hidden="true"></i> Clear
                    </md-button>
                </div>
            </div>
        </div>
        <div class="box box-primary">
            <div class="box-header with-border">
                <h3 class="box-title">Category GROUP REPORT</h3>
                <div class="box-tools pull-right">
                    <button type="button" class="btn btn-box-tool" data-widget="collapse" data-placement="bottom" data-toggle="tooltip" title="collapsible"><i class="fa fa-minus"></i></button>
                </div>
            </div>
            <div class="box-body">
                <div>
                    <div id="gridall" style="overflow:scroll"></div>
                </div>
            </div>
        </div>
    </form>    
</section>
