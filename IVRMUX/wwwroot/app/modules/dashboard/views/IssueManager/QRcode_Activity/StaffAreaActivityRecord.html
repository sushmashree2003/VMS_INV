
<section class="content twocoloumn">

    <div ng-init="loaddata()">
        <div class="box box-primary">
            <div class="box-header with-border">
                <h3 class="box-title">Activity Details</h3>
                <div class="box-tools pull-right">
                    <button type="button" class="btn btn-box-tool" data-widget="collapse"><i class="fa fa-minus"></i></button>
                </div>
            </div>
            <div class="box-body">
                <form class="form-horizontal ng-pristine ng-valid" role="form" method="post" name="myForm" novalidate>

                    <div class="clearfix">
                        <div style="width:100%;overflow:auto;">
                            <div class="box-body">
                                <table class="table table-hover table-responsive table-bordered clearfix " style="overflow:auto !important">
                                    <thead>
                                        <tr>
                                            <th style="text-align:left"> Sl.No</th>
                                            <th class="hdTH">
                                                <label>
                                                    <!--type="checkbox"-->
                                                    <input ng-model="all" ng-click="toggleAll(all)">
                                                    <span class="lbl padding-8"></span>
                                                </label>
                                            </th>
                                            <th style="text-align:left;width:100px;">Status </th>
                                            <th style="text-align:left;width:150px;">Remarks </th>
                                            <th style="text-align:left">Time </th>
                                            <th style="text-align:left"> FloorName</th>
                                            <th style="text-align:left"> AreaName</th>
                                            <th style="text-align:left">ActivityName </th>

                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr dir-paginate="user in filterValue = (QRcodeActivityDetails | filter : searchValue)  | orderBy:propertyName:reverse |itemsPerPage:itemsPerPageI" current-page="currentPageI" ng-class-odd="'odd'" pagination-id="xyzzz">
                                            <td>{{itemsPerPageI *(currentPageI-1)+$index+1}}</td>
                                            <td class="text-center  hdTD">
                                                <label>
                                                    <input type="checkbox" data-ng-model="user.selected" ng-change="optionToggled1(user)">
                                                    <span class="lbl padding-8"></span>
                                                </label>
                                            </td>
                                            <td>
                                                <select class="form-control" name="Status" ng-model="user.HRSTARACTRCD_Status" required>
                                                    <option value="">--Select Status--</option>
                                                    <option value="1">Completed</option>
                                                    <option value="2">Not Complted</option>
                                                    <option value="3"> In progress</option>
                                                </select>
                                                <div class="error-messages" ng-if="interacted(myForm.Status)" ng-messages="myForm.Status.$error">
                                                    <div ng-message="required">Please Select Levels</div>
                                                </div>
                                            </td>
                                            <td>
                                                <textarea class="form-control" name="Remarks" type="text" placeholder="Enter Remarks .... " ng-model="user.HRSTARACTRCD_Remarks" rows="3" maxlength="70" style="resize:none" required></textarea>
                                                <div class="error-messages" ng-if="interacted(myForm.Remarks)" ng-messages="myForm.Remarks.$error">
                                                    <div ng-message="required">Please Enter Task </div>
                                                </div>
                                            </td>
                                            <td style="text-align:left">{{ user.HRMARACTT_Time  | date : 'shortTime'}}</td>
                                            <td style="text-align:left">{{ user.HRMF_FloorName}}</td>
                                            <td style="text-align:left">{{ user.HRMAR_AreaName}}</td>
                                            <td style="text-align:left">{{ user.HRMARACT_ActivityName}}</td>


                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                    <hr />
                    <div class="text-center">
                        <md-button type="submit" class="md-raised md-primary" ng-click="QRclick()" ng-disabled="form.$invalid">
                            <i class="fa fa-save" aria-hidden="true"></i> Save
                        </md-button>
                        <md-button type="button" class="md-raised md-warn" ng-click="cancel()" ng-disabled="form.$invalid">
                            <i class="fa fa-times" aria-hidden="true"></i> Cancel
                        </md-button>
                    </div>

                </form>

            </div>
        </div>

    </div>

</section>
