<style>
    .multiselect {
        width: 100%;
        height: 10em;
        border: solid 1px #5cb7ff;
        overflow: auto;
        margin-bottom: 1%;
        padding: 2%;
    }

    .textareaclass {
        resize: none;
    }

    .modal-dialog {
        width: 95%;
        padding: 0;
    }

    .modal-content {
        height: auto;
        min-height: 100%;
        border-radius: 0;
    }

    .modal-header {
        padding: 5px;
        border-bottom: 0px solid #e5e5e5;
        border-bottom-color: #f4f4f4;
        background: #205081;
        color: #fff;
    }

    .well {
        position: relative;
        border-radius: 3px;
        background: #ffffff !important;
        border-top: 3px solid #d2d6de !important;
        padding: 5px !important;
        margin-bottom: 5px !important;
        width: 66%;
        -webkit-box-shadow: 0 0px 5px rgba(0,0,0,.2) !important;
        box-shadow: 0 0px 5px rgba(0,0,0,.2) !important;
    }
</style>
<section class="content" ng-init="loaddata()">
    <form class="form-horizontal ng-pristine ng-valid" role="form" name="myForm" novalidate>
        <div class="box box-primary">
            <div class="box-header with-border">
                <h3 class="box-title">Client Project Payment Configuration</h3>
                <div class="box-tools pull-right">
                    <button type="button" class="btn btn-box-tool" data-widget="collapse"><i class="fa fa-minus"></i></button>
                </div>
            </div>
            <div class="box-body">
                <div class="row">
                    <div class="col-sm-12">
                        <div class="col-sm-6">
                            <div class="form-group">
                                <div class="col-sm-4">
                                    <label class="control-label">Reminder Days :<span style="color:red;">*</span></label>
                                </div>
                                <div class="col-sm-8">
                                    <input class="form-control" name="iamount" id="iamount" type="text" ng-model="ISMCPC_RemainderDays" required
                                           allow-pattern="\d" maxlength="3">
                                    <div class="error-messages" ng-if="interacted(myForm.iamount)" ng-messages="myForm.iamount.$error">
                                        <div ng-message="required">Enter Reminder Days</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="col-sm-6">
                            <div class="form-group">
                                <div class="col-sm-4">
                                    <label class="control-label">Reminder Flag :<span style="color:red;">*</span></label>
                                </div>
                                <div class="col-sm-8 well text-center">
                                    <div ng-init="ISMCPC_FullORPartialPayment='Full'">
                                        <label class="radio-inline">
                                            <input type="radio" value="Full" name="enhc" ng-model="ISMCPC_FullORPartialPayment" required>
                                            <span class="lbl padding-8"><b> Full Payment </b></span>
                                        </label>
                                        <label class="radio-inline">
                                            <input type="radio" value="Partial" name="enhc" ng-model="ISMCPC_FullORPartialPayment" required>
                                            <span class="lbl padding-8"><b>Partial Payment</b></span>
                                        </label>
                                    </div>
                                    <div class="error-messages" ng-if="interacted(myForm.enhc)" ng-messages="myForm.enhc.$error">
                                        <div ng-message="required">Select Reminder Flag </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <hr />
                <div class="text-center">
                    <input type="hidden" ng-model="ismcltprP_Id " value="{{ismcltprP_Id}}" />
                    <md-button type="submit" class="md-raised md-primary" ng-disabled="form.$invalid" ng-click="savedata()" id="save-btn">
                        <i class="fa fa-floppy-o" aria-hidden="true"></i>
                        Save
                    </md-button>
                    <md-button type="button" class="md-raised md-warn" ng-click="Clearid()">
                        <i class="fa fa-times" aria-hidden="true"></i>
                        Cancel
                    </md-button>
                </div>
            </div>

        </div>
    </form>
</section>
