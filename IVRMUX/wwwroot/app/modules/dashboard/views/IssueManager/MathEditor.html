<html>
<head>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/froala-editor@3.1.0/css/froala_style.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/froala-editor@3.1.0/css/froala_editor.pkgd.min.css">
    <script src="https://cdn.jsdelivr.net/npm/froala-editor@3.1.0/js/froala_editor.pkgd.min.js"></script>
    <script src="https://www.wiris.net/demo/plugins/app/WIRISplugins.js?viewer=image"></script>
    <script src="https://cdn.jsdelivr.net/npm/@wiris/mathtype-froala3@7.17.0/wiris.js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/froala-editor@3.2.0/css/froala_editor.css">


    <link href='https://cdn.jsdelivr.net/npm/froala-editor@3.2.0/css/froala_editor.pkgd.min.css' rel='stylesheet' type='text/css' />


    <script type='text/javascript' src='https://cdn.jsdelivr.net/npm/froala-editor@3.2.0/js/froala_editor.pkgd.min.js'></script>
    <link href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet" integrity="sha384-wvfXpqpZZVQGK6TAh5PVlGOfQNHSoD2xbE+QkPxCAFlNEevoEH3Sl0sibVcOQVnN" crossorigin="anonymous">
    <script src="https://requirejs.org/docs/release/2.3.6/minified/require.js"></script>
    <script>
        require.config({
            packages: [{
                name: 'froala-editor',
                main: 'js/froala_editor.min'
            }],
            paths: {
                // Change this to your server if you do not wish to use our CDN.
                'froala-editor': 'https://cdn.jsdelivr.net/npm/froala-editor@3.2.0'
            }
        });
    </script>

    <style>
        body {
            text-align: center;
        }

        div#editor {
            width: 81%;
            margin: auto;
            text-align: left;
        }

        .ss {
            background-color: red;
        }
    </style>
</head>

<body>
    <div id="editor">
        <div id='edit' style='margin-top:30px;'>
        </div>
    </div>

    <script>
        require([
            'froala-editor',
            'froala-editor/js/plugins/align.min'
        ], function (FroalaEditor) {
            new FroalaEditor('#edit', {
                htmlAllowedTags: ['.*'],
                htmlAllowedAttrs: ['.*'],
                imageEditButtons: ['wirisEditor', 'wirisChemistry'],
                toolbarButtonsXS: ['wirisEditor', 'wirisChemistry'],
                toolbarButtons: ['undo', 'redo', '|', 'bold', 'italic', 'underline', 'strikeThrough', 'subscript', 'superscript', 'outdent', 'indent', 'clearFormatting', 'insertTable', 'html', 'wirisEditor', 'wirisChemistry'],
     
                useClasses: false})
            //new FroalaEditor('#edit', {
            //    toolbarButtons: ['wirisEditor', 'wirisChemistry'],
            //    toolbarButtonsMD: ['wirisEditor', 'wirisChemistry'],
            //    toolbarButtonsSM: ['wirisEditor', 'wirisChemistry'],
            //    toolbarButtonsXS: ['wirisEditor', 'wirisChemistry'],
            //    imageEditButtons: ['wirisEditor', 'wirisChemistry'],
            //    htmlAllowedTags: ['.*'],
            //    htmlAllowedAttrs: ['.*'],
            //    useClasses: false
            //})


        });
    </script>
</body>

</html>
