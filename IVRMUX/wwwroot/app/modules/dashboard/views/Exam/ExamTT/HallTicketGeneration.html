<section class="content">
    <form class="form-horizontal ng-pristine ng-valid" name="myForm" role="form" ng-init="BindData()" novalidate>

        <div class="box box-primary">
            <div class="box-header with-border">
                <h3 class="box-title">Exam Time Table</h3>
                <div class="box-tools pull-right">
                    <button type="button" class="btn btn-box-tool" data-widget="collapse"><i class="fa fa-minus"></i></button>
                </div>
            </div>
            <div class="box-body">

                <div class="row">
                    <div class="col-sm-6">
                        <div class="form-group">
                            <label class="control-label col-sm-4">Academic Year :<span style="color:Red">*</span></label>
                            <div class="col-sm-8">
                                <select class="form-control" id="sel1" name="Year" ng-model="ASMAY_Id" data-ng-change="onselectAcdYear(ASMAY_Id)" required>
                                    <option value="" label="Select Academic Year"> </option>
                                    <option ng-repeat="option1 in acdlist" value="{{option1.asmaY_Id}}" ng-selected="{{option1.Selected == option1.asmaY_Id}}">
                                        {{option1.asmaY_Year}}
                                    </option>
                                </select>
                            </div>
                            <div class="col-sm-8 col-sm-offset-4 error-messages" ng-if="interacted(myForm.Year)" ng-messages="myForm.Year.$error">
                                <div ng-message="required">Please Select Academic Year</div>
                            </div>
                        </div>
                    </div>


                    <div class="col-sm-6">
                        <div class="form-group">
                            <label class="control-label col-sm-4">Class :<span style="color:Red">*</span></label>
                            <div class="col-sm-8">
                                <select class="form-control" id="sel2" name="cls" ng-model="ASMCL_Id" data-ng-change="onselectclass(ASMCL_Id,ASMAY_Id,EMCA_Id)" required>
                                    <option value="" label="Select Class"> </option>
                                    <option ng-repeat="option2 in ctlist" value="{{option2.asmcL_Id}}" ng-selected="{{option2.Selected == option2.asmcL_Id}}">
                                        {{option2.asmcL_ClassName}}
                                    </option>
                                </select>
                            </div>
                            <div class="col-sm-8 col-sm-offset-4 error-messages" ng-if="interacted(myForm.cls)" ng-messages="myForm.cls.$error">

                                <div ng-message="required">Please Select Class</div>

                            </div>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <!--<div class="col-sm-6">
                        <div class="form-group">
                            <label class="control-label col-sm-4">Section :<span style="color:Red">*</span></label>
                            <div class="col-sm-8">
                                <select class="form-control" id="sel3" name="sec" ng-model="ASMS_Id" data-ng-change="onselectSection()" required>
                                    <option value="" label="Select Section"> </option>
                                    <option ng-repeat="option3 in seclist" value="{{option3.asmS_Id}}" ng-selected="{{option3.Selected == option3.asmS_Id}}">
                                        {{option3.asmC_SectionName}}
                                    </option>
                                </select>
                            </div>
                            <div class="col-sm-8 col-sm-offset-4 error-messages" ng-if="interacted(myForm.sec)" ng-messages="myForm.sec.$error">
                                <div ng-message="required">Please Select Section</div>
                            </div>
                        </div>
                    </div>-->

                    <div class="col-sm-6">
                        <div class="form-group">
                            <label class="control-label col-sm-4">Section :<span style="color:Red">*</span></label>
                            <div class="multiselect col-sm-8">
                                <label ng-repeat="option3 in seclist" data-ng-model="section" value="{{option3.asmS_Id}}">
                                    <input name="asd" ng-model="option3.section" type="checkbox" ng-required="isOptionsRequired1();">
                                    <span class="lbl padding-8">
                                        {{option3.asmC_SectionName}}
                                    </span>
                                </label>
                            </div>
                            <div class="col-sm-8 error-messages" ng-if="interacted(myForm.asd)" ng-messages="myForm.asd.$error" style="padding-left:188px">
                                <div ng-message="required">Select Atleast one Checkbox</div>
                            </div>
                        </div>
                    </div>


                    <div class="col-sm-6">
                        <div class="form-group">
                            <label class="control-label col-sm-4">Exam Name :<span style="color:Red">*</span></label>
                            <div class="col-sm-8">
                                <select class="form-control" id="sel8" name="exm" ng-model="EME_Id" required>
                                    <option value="" label="Select Exam"> </option>
                                    <option ng-repeat="option8 in examlist" value="{{option8.emE_Id}}" ng-selected="{{option8.Selected == option8.emE_Id}}">
                                        {{option8.emE_ExamName}}
                                    </option>
                                </select>
                            </div>
                            <div class="col-sm-8 col-sm-offset-4 error-messages" ng-if="interacted(myForm.exm)" ng-messages="myForm.exm.$error">
                                <div ng-message="required">Please Select Exam</div>
                            </div>
                        </div>
                    </div>
                </div>


                <div class="row">
                    <div class="col-sm-6">
                        <div class="form-group">
                            <label class="control-label col-sm-4">Prefix :<strong style="color:red;">*</strong></label>
                            <div class="col-sm-8">

                                <input type="text" name="prefx" class="form-control" ng-model="prefix" ng-paste="$event.preventDefault()"  maxlength="20" required />
                            </div>
                            <div class="col-sm-8 col-sm-offset-4 error-messages" ng-if="interacted(myForm.prefx)" ng-messages="myForm.prefx.$error">
                                <div ng-message="required">Enter Prefix</div>
                            </div>
                        </div>
                    </div>


                    <div class="col-sm-6">
                        <div class="form-group">
                            <label class="control-label col-sm-4">Starting No. :<strong style="color:red;">*</strong></label>
                            <div class="col-sm-8">

                                <input type="text" name="start" class="form-control" ng-model="startno" ng-paste="$event.preventDefault()" maxlength="5" required />
                            </div>
                            <div class="col-sm-8 col-sm-offset-4 error-messages" ng-if="interacted(myForm.start)" ng-messages="myForm.start.$error">
                                <div ng-message="required">Enter Starting Number</div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-sm-6">
                        <div class="form-group">
                            <label class="control-label col-sm-4">Increment :<strong style="color:red;">*</strong></label>
                            <div class="col-sm-8">

                                <input type="text" name="inc" class="form-control" ng-model="increment" ng-paste="$event.preventDefault()" maxlength="5" required />
                            </div>
                            <div class="col-sm-8 col-sm-offset-4 error-messages" ng-if="interacted(myForm.inc)" ng-messages="myForm.inc.$error">
                                <div ng-message="required">Enter Increment Number</div>
                            </div>
                        </div>
                    </div>

                    <div class="col-sm-3">
                        <div class="form-group">
                            <label class="control-label col-sm-4">PrefixNo.:<strong style="color:red;">*</strong></label>
                            <label class="radio-inline">
                                <input type="radio" ng-model="qualification_type" ng-change="onselectradio()" value="yes" name="radio1" id="radio4">
                                <span class="lbl padding-8">Yes</span>
                            </label>
                            <label class="radio-inline">
                                <input type="radio" ng-model="qualification_type" ng-change="onselectradio()" value="no" name="radio1" id="radio5">
                                <span class="lbl padding-8">No</span>
                            </label>
                        </div>
                    </div>

                    <div class="col-sm-3" ng-show="qualification_type == 'yes'">
                        <div class="col-sm-6">
                            <input type="number" name="pren" class="form-control" ng-model="preno" ng-paste="$event.preventDefault()" min="0" max="5" ng-required="qualification_type == 'yes'" />
                        </div>
                        </div>

                    </div>

                <div class="form-group" style="text-align:center">
                    <md-button type="button" class="md-raised md-primary" ng-click="savedetail()">
                        <i class="fa fa-save" aria-hidden="true"></i> Save and Generate
                    </md-button>
                    <md-button type="button" class="md-raised md-warn" ng-click="cancel()">
                        <i class="fa fa-times" aria-hidden="true"></i>
                        Cancel
                    </md-button>
                </div>

            </div>


        </div>
    </form>
</section>
