
<section class="content">
    <div data-ng-init="BindData()">
        <div class="box box-primary">
            <!-- /.box-header -->
            <div class="box-body">
                <div ng-cloak>
                    <md-content>
                        <md-tabs md-dynamic-height md-border-bottom>
                            <md-tab label="Maste Life Skills">
                                <!--ng-click="loadData()"-->
                                <md-content class="md-padding">
                                    <form class="form-horizontal ng-pristine ng-valid" name="myForm" role="form" novalidate>
                                        <div class="box box-primary">
                                            <div class="box-header with-border">
                                                <h3 class="box-title"> Life Skills</h3>
                                                <div class="box-tools pull-right">
                                                    <button type="button" class="btn btn-box-tool" data-widget="collapse" data-placement="bottom" data-toggle="tooltip" title="collapsible"><i class="fa fa-minus"></i></button>
                                                </div>
                                            </div>
                                            <div class="box-body">
                                                <div class="row">
                                                    <div>
                                                        <div>
                                                            <div class="col-sm-6 col-sm-offset-3">
                                                                <div class="form-group">
                                                                    <label class="control-label col-sm-6">Co-Scholastic Skills:<span style="color:red;">*</span></label>
                                                                    <div class="col-sm-6">
                                                                        <!--<textarea class="form-control" rows="4" ng-model="description"  required></textarea>-->
                                                                        <input type="text" name="skillname" class="form-control" ng-model="ecS_SkillName" maxlength="100" required />
                                                                    </div>
                                                                    <div class="col-sm-8 col-sm-offset-4 error-messages" ng-if="interacted(myForm.skillname)" ng-messages="myForm.skillname.$error">
                                                                        <div ng-message="required">Co-Scholastic Skills</div>
                                                                    </div>
                                                                </div>
                                                                <div class="form-group">
                                                                    <label class="control-label col-sm-6">Co-Scholastic Skill Code:<span style="color:red;">*</span></label>
                                                                    <div class="col-sm-6">
                                                                        <input type="text" name="skillcode" class="form-control active" ng-model="ecS_SkillCode" maxlength="100" required />
                                                                    </div>
                                                                    <div class="col-sm-8 col-sm-offset-4 error-messages" ng-if="interacted(myForm.skillcode)" ng-messages="myForm.skillcode.$error">
                                                                        <div ng-message="required">Enter Co-Scholastic Skills Code</div>
                                                                    </div>
                                                                </div>
                                                            </div>

                                                        </div>
                                                    </div>

                                                </div>
                                            </div>
                                        </div>

                                        <div class="text-center">
                                            <input type="hidden" ng-model="ecS_Id" value="{{ecS_Id}}" />
                                            <md-button type="submit" class="md-raised md-primary" ng-click="Savedata()">
                                                <i class="fa fa-save" aria-hidden="true"></i> Save
                                            </md-button>
                                            <md-button type="button" class="md-raised md-warn" ng-click="cancel()">
                                                <i class="fa fa-times" aria-hidden="true"></i> Cancel
                                            </md-button>

                                        </div>
                                    </form>
                                    <div class="box box-primary">
                                        <div class="box-header with-border">
                                            <h3 class="box-title">Master Life Skill Grid</h3>
                                            <div class="box-tools pull-right">
                                                <button type="button" class="btn btn-box-tool" data-widget="collapse" data-placement="bottom" data-toggle="tooltip" title="collapsible"><i class="fa fa-minus"></i></button>
                                            </div>
                                        </div>
                                        <!-- /.box-header -->
                                        <div class="box-body">
                                            <div ui-grid="gridOptions" ui-grid-pagination class="grid text-center" id="style-4" style="height: 270px;"></div>
                                        </div>

                                        <!---Order Set -->

                                    </div>

                                </md-content>
                            </md-tab>
                            <md-tab label="Skill Area">
                                <md-content class="md-padding">
                                    <form class="form-horizontal ng-pristine ng-valid" name="myForm2" role="form" novalidate>
                                        <div class="box box-primary">
                                            <div class="box-header with-border">
                                                <h3 class="box-title">Life Skill Area</h3>
                                                <div class="box-tools pull-right">
                                                    <button type="button" class="btn btn-box-tool" data-widget="collapse" data-placement="bottom" data-toggle="tooltip" title="collapsible"><i class="fa fa-minus"></i></button>
                                                </div>
                                            </div>
                                            <div class="box-body">
                                                <div class="row">
                                                    <div>
                                                        <div>
                                                            <div class="col-sm-6 col-sm-offset-3">
                                                                <div class="form-group">
                                                                    <label class="control-label col-sm-5">Skill Area Name:<span style="color:red;">*</span></label>
                                                                    <div class="col-sm-7">
                                                                        <input type="text" name="skillarea" class="form-control" ng-model="ecsA_SkillArea" maxlength="100" required />
                                                                    </div>
                                                                    <div class="col-sm-8 col-sm-offset-5 error-messages" ng-if="interacted1(myForm2.skillarea)" ng-messages="myForm2.skillarea.$error">

                                                                        <div ng-message="required">Co-Scholastic Skill Area</div>

                                                                    </div>
                                                                </div>
                                                                <div class="form-group">
                                                                    <label class="control-label col-sm-5">Skill Area Order :<span style="color:red;">*</span></label>
                                                                    <div class="col-sm-7">
                                                                        <input type="text" name="skillorder" class="form-control" ng-model="ecsA_SkillOrder" maxlength="100" required allow-pattern="[0-9]" ng-disabled="edit==true" />
                                                                    </div>
                                                                    <div class="col-sm-8 col-sm-offset-5 error-messages" ng-if="interacted1(myForm2.skillorder)" ng-messages="myForm2.skillorder.$error">
                                                                        <div ng-message="required">Skill Area Order</div>
                                                                    </div>
                                                                </div>
                                                            </div>
                                                        </div>

                                                    </div>
                                                </div>
                                                <div class="text-center">
                                                    <input type="hidden" ng-model="ecsA_Id" value="{{ecsA_Id}}" />
                                                    <md-button type="submit" class="md-raised md-primary" ng-click="Savedataarea()">
                                                        <i class="fa fa-save" aria-hidden="true"></i> Save
                                                    </md-button>
                                                    <md-button type="button" class="md-raised md-warn" ng-click="cancelarea()">
                                                        <i class="fa fa-times" aria-hidden="true"></i> Cancel
                                                    </md-button>
                                                    <md-button type="button" class="md-raised md-primary" data-toggle="modal" data-target="#myModal">
                                                        Set  order
                                                    </md-button>
                                                </div>
                                            </div>
                                        </div>
                                    </form>
                                    <div class="box box-primary">
                                        <div class="box-header with-border">
                                            <h3 class="box-title">Master Life Skill Area Grid</h3>
                                            <div class="box-tools pull-right">
                                                <button type="button" class="btn btn-box-tool" data-widget="collapse" data-placement="bottom" data-toggle="tooltip" title="collapsible"><i class="fa fa-minus"></i></button>
                                            </div>
                                        </div>
                                        <!-- /.box-header -->
                                        <div class="box-body">
                                            <div ui-grid="gridOptions1" ui-grid-pagination class="grid text-center" id="style-4" style="height: 270px;"></div>
                                        </div>
                                    </div>
                                </md-content>
                            </md-tab>
                            <md-tab label="Skill Area Mapping">
                                <md-content class="md-padding">
                                    <form class="form-horizontal ng-pristine ng-valid" name="myForm3" role="form" novalidate>
                                        <div class="box-header with-border">
                                            <h3 class="box-title">Skill Area Mapping</h3>
                                            <div class="box-tools pull-right">
                                                <button type="button" class="btn btn-box-tool" data-widget="collapse" data-placement="bottom" data-toggle="tooltip" title="collapsible"><i class="fa fa-minus"></i></button>
                                            </div>
                                        </div>
                                        <div class="box-body">
                                            <div class="row">
                                                <div class="col-sm-6">
                                                    <div class="form-group">
                                                        <label class="control-label col-sm-5">Skill Name:<span style="color:red;">*</span></label>
                                                        <div class="col-sm-7">
                                                            <select class="form-control" id="sm" name="skill" ng-model="ECS_Id" ng-disabled="edit1==true" required>
                                                                <option value="">Select</option>
                                                                <option ng-repeat="skill in fillskill" value="{{skill.ecS_Id}}" ng-selected="skill.Selected == true">
                                                                {{skill.ecS_SkillName}}
                                                                </option>
                                                            </select>
                                                        </div>
                                                        <div class="col-sm-8 col-sm-offset-5 error-messages" ng-if="interacted2(myForm3.skill)" ng-messages="myForm3.skill.$error">
                                                            <div ng-message="required">Skill Name</div>
                                                        </div>
                                                    </div>
                                                    <div class="form-group">
                                                        <label class="control-label col-sm-5">Skill Area Name:<span style="color:red;">*</span></label>
                                                        <div class="col-sm-7">
                                                            <select class="form-control" id="sm" name="skill" ng-model="ECSA_Id" ng-disabled="edit1==true" required>
                                                                <option value="">Select</option>
                                                                <option ng-repeat="area in fillskillarea" value="{{area.ecsA_Id}}" ng- ng-selected="area.Selected == true">
                                                                    {{area.ecsA_SkillArea}}
                                                                </option>
                                                            </select>
                                                        </div>
                                                        <div class="col-sm-8 col-sm-offset-5 error-messages" ng-if="interacted2(myForm3.skill)" ng-messages="myForm3.skill.$error">
                                                            <div ng-message="required">Skill Area Name</div>
                                                        </div>
                                                    </div>
                                                    <div class="form-group">
                                                        <label class="control-label col-sm-5">Master Grade:<span style="color:red;">*</span></label>
                                                        <div class="col-sm-7">
                                                            <select class="form-control" id="sm" name="mastergradename" ng-disabled="edit1==true" ng-model="emgR_Id" required ng-change="MasterGradeselect(emgR_Id)">
                                                                <option value="">Select</option>
                                                                <option ng-repeat="grade in fillMastergrade" value="{{grade.emgR_Id}}" ng-selected="grade.Selected == true">
                                                                    {{grade.emgR_GradeName}}
                                                                </option>
                                                            </select>
                                                        </div>
                                                        <div class="col-sm-8 col-sm-offset-5 error-messages" ng-if="interacted2(myForm3.mastergradename)" ng-messages="myForm3.mastergradename.$error">
                                                            <div ng-message="required">Select Master Grade Name</div>
                                                        </div>
                                                    </div>

                                                </div>
                                                <div class="col-sm-6">
                                                    <div class="form-group">
                                                        <label class="control-label col-sm-5">Indicators Description:<span style="color:red;">*</span></label>
                                                        <div class="col-sm-7">
                                                            <textarea type="text" name="desc" class="form-control active" ng-model="ECSAM_IndicatorDescription" required />
                                                        </div>
                                                        <div class="col-sm-8 col-sm-offset-5 error-messages" ng-if="interacted2(myForm3.desc)" ng-messages="myForm3.desc.$error">
                                                            <div ng-message="required">Enter Description</div>
                                                        </div>
                                                    </div>

                                                    <div class="form-group">
                                                        <label class="control-label col-sm-5">Grade Name:<span style="color:red;">*</span></label>
                                                        <div class="col-sm-7">
                                                            <select class="form-control" id="sm" name="gradename" ng-model="emgD_Id" ng-change="Gradepointselect(fillgradename,emgD_Id)" required>
                                                                <option value="">Select</option>
                                                                <option ng-repeat="grade1 in fillgradename" value="{{grade1.emgD_Id}}" ng-selected="grade1.emgD_Id == emgD_Id">
                                                                    {{grade1.emgD_Name}}
                                                                </option>
                                                            </select>
                                                        </div>
                                                        <div class="col-sm-8 col-sm-offset-5 error-messages" ng-if="interacted2(myForm3.gradename)" ng-messages="myForm3.gradename.$error">
                                                            <div ng-message="required">Select Grade Name</div>
                                                        </div>
                                                    </div>                                                   
                                                </div>
                                            </div>


                                            <div class="text-center">
                                                <input type="hidden" ng-model="ECSAM_Id" value="{{ECSAM_Id}}" />
                                                <md-button type="submit" class="md-raised md-primary" ng-click="Savedataareamapping()">
                                                    <i class="fa fa-save" aria-hidden="true"></i> Save
                                                </md-button>
                                                <md-button type="button" class="md-raised md-warn" ng-click="cancelareamapping()">
                                                    <i class="fa fa-times" aria-hidden="true"></i> Cancel
                                                </md-button>

                                            </div>
                                        </div>
                                    </form>
                                    <div class="box box-primary">
                                        <div class="box-header with-border">
                                            <h3 class="box-title">Skill Area Mapping Grid</h3>
                                            <div class="box-tools pull-right">
                                                <button type="button" class="btn btn-box-tool" data-widget="collapse" data-placement="bottom" data-toggle="tooltip" title="collapsible"><i class="fa fa-minus"></i></button>
                                            </div>
                                        </div>
                                        <!-- /.box-header -->
                                        <div class="box-body">
                                            <div ui-grid="gridOptions3" ui-grid-pagination class="grid text-center" id="style-4" style="height: 270px;"></div>
                                        </div>

                                        <!---Order Set -->

                                    </div>
                                </md-content>
                            </md-tab>
                        </md-tabs>
                    </md-content>
                </div>

            </div>
            <!-- /.box-body -->
        </div>
        <!---Order Set -->
        <div class="modal fade modal-medium" id="myModal" role="dialog">
            <div class="modal-dialog modal-md">
                <!-- Modal content-->
                <div class="modal-content">
                    <div class="modal-header">
                        <button type="button" class="close" data-dismiss="modal" ng-click="BindData()"><i class="fa fa-times text-white" aria-hidden="true"></i><!--&times;--></button>
                        <h4 class="modal-title text-white">Master Life Skill Area</h4>
                    </div>
                    <div class="modal-body">
                        <table class="table table-hover table-responsive table-bordered">
                            <thead>
                                <tr>
                                    <th>
                                        SLNO
                                    </th>
                                    <th>
                                        Skill Area Name
                                    </th>
                                    <th>
                                        Skill Area Order
                                    </th>

                                </tr>
                            </thead>
                            <tbody ng-sortable="configA">
                                <tr ng-repeat="user in grouptypeListOrder">
                                    <td>{{$index+1}}</td>
                                    <td>{{ user.ecsA_SkillArea}}</td>
                                    <td>{{ user.ecsA_SkillOrder}}</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <div class="modal-footer">
                        <button type="button" class="btn btn-default" data-dismiss="modal" ng-click="getOrder(grouptypeListOrder);">Save</button>
                        <button type="button" class="btn btn-default" data-dismiss="modal" ng-click="BindData()">Close</button>
                    </div>
                </div>

            </div>
        </div>
    </div>
</section>
