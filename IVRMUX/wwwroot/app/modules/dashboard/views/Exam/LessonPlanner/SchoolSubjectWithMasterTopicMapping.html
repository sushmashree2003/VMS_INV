

<section class="content">
    <div class="box box-primary">
        <div class="box-header with-border">
            <h3 class="box-title">Subject With Master Topic</h3>
            <div class="box-tools pull-right">
                <button type="button" class="btn btn-box-tool" data-widget="collapse"><i class="fa fa-minus"></i></button>
            </div>
        </div>
        <div class="box-body">
            <form class="form-horizontal ng-pristine ng-valid" name="myForm" data-ng-submit="saveddata()" role="form" novalidate>
                <div data-ng-init="BindData()">

                    <div class="row">
                        <div class="col-sm-6 col-sm-offset-3">
                            <div class="form-group">
                                <label class="control-label col-sm-4">Subject Name :<strong style="color:red;">*</strong></label>
                                <div class="col-sm-8">
                                    <select class="form-control" id="sel1" name="stuayear" data-ng-model="ISMS_Id" ng-change="onchangesubject()" required>
                                        <option value="">-- Select Subject --</option>
                                        <option ng-repeat="acedmicYear in subjectlist" value="{{acedmicYear.ismS_Id}}" ng-selected="{{acedmicYear.Selected == true}}">
                                            {{acedmicYear.ismS_SubjectName}}
                                        </option>
                                    </select>
                                    <div class="error-messages" ng-if="interacted1(myForm.stuayear)" ng-messages="myForm.stuayear.$error">
                                        <div ng-message="required">Select Subject Name</div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="col-sm-6 col-sm-offset-3">
                            <div class="form-group">
                                <label class="control-label col-sm-4">Topic Name:<strong style="color:red;">*</strong></label>
                                <div class="multiselect col-sm-8">
                                    <input class="form-control" ng-model="search" type="text" placeholder="search here...">
                                    <label ng-repeat="className in topicdetails | filter:search">
                                        <input type="checkbox" ng-model="className.Selected" name="loc"
                                               ng-required="isOptionsRequired()">
                                        <span class="lbl padding-8"> {{className.lpmT_TopicName}}  </span>
                                    </label>
                                </div>
                                <div class="col-sm-8 error-messages pull-right" ng-if="interacted(myForm.loc)" ng-messages="myForm.loc.$error">
                                    <div ng-message="required">Select Atleast One Topic Name</div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="text-center">
                            <input type="hidden" ng-model="LPSMTM_Id" value="{{LPSMTM_Id}}" />
                            <md-button type="submit" class="md-raised md-primary" ng-disabled="form.$invalid">
                                <i class="fa fa-save" aria-hidden="true"></i> Save
                            </md-button>
                            <md-button type="button" class="md-raised md-warn" ng-click="cancel()">
                                <i class="fa fa-times" aria-hidden="true"></i> Cancel
                            </md-button>
                            <md-button type="button" ng-show="showbtn" class="md-raised md-primary" data-toggle="modal" data-target="#myModal">
                                Set  order
                            </md-button>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>
    <div class="box box-primary">
        <div class="box-header with-border">
            <h3 class="box-title">Subject With Master Topic</h3>
            <div class="box-tools pull-right">
                <button type="button" class="btn btn-box-tool" data-widget="collapse" data-placement="bottom" data-toggle="tooltip" title="collapsible"><i class="fa fa-minus"></i></button>

            </div>
        </div>
        <!-- /.box-header -->
        <div class="box-body">
            <div ui-grid="gridOptions" ui-grid-pagination class="grid text-center" id="style-4" style="height: 270px;"></div>
        </div>

        <!---Order Set -->
        <div class="modal fade modal-medium" id="myModal" role="dialog" data-backdrop="static">
            <div class="modal-dialog modal-md">
                <!-- Modal content-->
                <div class="modal-content">
                    <div class="modal-header">
                        <button type="button" class="close" data-dismiss="modal" ng-click="BindData()"><i class="fa fa-times text-white" aria-hidden="true"></i><!--&times;--></button>
                        <h4 class="modal-title text-white">Master Topic</h4>
                    </div>
                    <div class="modal-body">
                        <table class="table table-hover table-responsive table-bordered">
                            <thead>
                                <tr>
                                    <th>
                                        SLNO
                                    </th>
                                    <th>
                                        Subject Name
                                    </th>
                                    <th>
                                        Topic Name
                                    </th>
                                    <th>
                                        Topic Order
                                    </th>
                                </tr>
                            </thead>
                            <tbody ng-sortable="configA">
                                <tr ng-repeat="user in grouptypeListOrder">
                                    <td>{{$index+1}}</td>
                                    <td>{{ user.ismS_SubjectName}}</td>
                                    <td>{{ user.lpmT_TopicName}}</td>
                                    <td>{{ user.lpsmtM_Order}}</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <div class="modal-footer">
                        <button type="button" class="btn btn-default" data-dismiss="modal" ng-click="getOrder(grouptypeListOrder);">Save</button>
                        <button type="button" class="btn btn-default" data-dismiss="modal" ng-click="BindData()">Close</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

</section>
