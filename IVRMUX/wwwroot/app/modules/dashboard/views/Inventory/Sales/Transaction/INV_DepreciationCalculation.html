
<section class="content">
    <div class="" ng-init="loaddata()">
        <form class="form-horizontal" role="form" name="myForm" enctype="multipart/form-data" novalidate>
            <div class="box box-primary">
                <div class="box-header with-border">
                    <h3 class="box-title">INV Depreciation Report</h3>
                </div>
                <div class="box-body">
                    <div class="row">
                        <div class="col-sm-6 col-md-offset-2">
                            <div class="form-group">
                                <label class="control-label col-sm-4">Institutions:<span style="color:red;">*</span></label>
                                <div class="col-sm-8">
                                    <select class="form-control" id="sel11" ng-model="MI_Id" name="ins" required>
                                        <option value="">--Select--</option>
                                        <option ng-repeat="mi in Institution" value="{{mi.mI_Id}}" ng-selected="{{mi.Selected==true}}"> {{mi.mI_Name}}</option>
                                    </select>
                                    <div class="error-messages" ng-if="interacted(myForm.ins)" ng-messages="myForm.ins.$error">
                                        <div ng-message="required">Select Institutions</div>
                                    </div>
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="control-label col-sm-4">Year :<span style="color:red;">*</span></label>
                                <div class="col-sm-8">
                                    <select class="form-control" ng-model="imfY_FinancialYear" name="year"
                                            required>
                                        <option value="">Select Year </option>
                                        <option ng-repeat="option in year" value="{{option.imfY_Id}}" ng-selected="{{option.imfY_Id == imfY_FinancialYear}}">
                                            {{option.imfY_FinancialYear}}
                                        </option>
                                    </select>
                                    <div class="error-messages" ng-if="interacted(myForm.year)" ng-messages="myForm.year.$error">
                                        <div ng-message="required"> Select Year </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="text-center">
                        <br />
                        <md-button type="submit" class="md-raised md-primary" ng-disabled="form.$invalid" id="save-btn" ng-click="onreport()">
                            <i class="fa fa-floppy-o" aria-hidden="true"></i>
                            calculate
                        </md-button>
                        <md-button type="submit" class="md-raised md-warn" ng-click="cancel()">
                            <i class="fa fa-times" aria-hidden="true"></i>
                            Cancel
                        </md-button>
                       
                    </div>
                </div>
            </div>
        </form>

        


    </div>

</section>
