
<section class="content twocoloumn">
    <div ng-init="loaddata()">
        <form class="form-horizontal ng-pristine ng-valid" role="form" name="myForm" method="post" novalidate>
            <div class="box box-primary">
                <div class="box-header with-border">
                    <h3 class="box-title">Employee Mapping</h3>
                    <div class="box-tools pull-right">
                        <button type="button" class="btn btn-box-tool" data-widget="collapse"><i class="fa fa-minus"></i></button>
                    </div>
                </div>
                <div class="box-body">
                    <div class="row">
                        <div class="col-sm-6 col-sm-offset-3">
                            <div class="form-group">
                                <label class="control-label col-sm-4">Site/Building :<span style="color:red;">*</span></label>
                                <div class="col-sm-8">
                                    <select class="form-control" id="sel1" ng-model="obj.invmsI_Id" name="site" required>
                                        <option value="">Select Site/Building </option>
                                        <option ng-repeat="option in get_sites" value="{{option.invmsI_Id}}" ng-selected="{{option.Selected == true}}">
                                            {{option.invmsI_SiteBuildingName}}
                                        </option>
                                    </select>
                                    <div class="error-messages" ng-if="interacted(myForm.site)" ng-messages="myForm.site.$error">
                                        <div ng-message="required">Please Select Sites/Building</div>
                                    </div>
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="control-label col-sm-4">Location/Room :<span style="color:Red">*</span></label>
                                <div class="col-sm-8">
                                    <ui-select id="sel1" name="location" ng-model="obj.invmlO_Id" theme="bootstrap" ng-keyup="searchfilter($select);" title="Select Location" required>
                                        <ui-select-match ng-trim="false" placeholder="Select or search location in the list...">{{$select.selected.invmlO_LocationRoomName}}</ui-select-match>
                                        <ui-select-choices repeat="option3 in get_locations | filter: $select.search " value="{{option3.invmlO_Id}}" ng-selected="{{option3.Selected == true}}">
                                            <div ng-bind-html="option3.invmlO_LocationRoomName | highlight: $select.search"></div>
                                        </ui-select-choices>
                                    </ui-select>
                                    <div class="error-messages" ng-if="interacted(myForm.location)" ng-messages="myForm.location.$error">
                                        <div ng-message="required">Please Select Location </div>
                                    </div>
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="control-label col-sm-4">Employee :<span style="color:Red">*</span></label>
                                <div class="col-sm-8">
                                    <div class="multiselect" style="height: 150px; overflow-y: auto; border: 1px solid #ccc; padding: 5px; width: 100%; display: block;">
                                        <input class="form-control" ng-model="searchchkbx" type="text" placeholder="search here..." style="margin-bottom: 5px;">
                                        <label style="display: block; width: 100%;">
                                            <input name="emp" value="1" ng-model="usercheck" type="checkbox" data-ng-click="all_check()">
                                            <span class="lbl padding-8"> All </span>
                                        </label>
                                        <label style="display: block; width: 100%;" ng-repeat="option in get_employee | filter:searchchkbx" value="{{option.hrmE_Id}}">
                                            <input name="emp" ng-model="option.Selected" type="checkbox" ng-change="togchkbx();" ng-required="isOptionsRequired()">
                                            <span class="lbl padding-8">
                                                {{option.employeename}}
                                            </span>
                                        </label>
                                    </div>
                                    <div class="error-messages" ng-if="interacted(myForm.emp)" ng-messages="myForm.emp.$error" style="clear: both; margin-top: 5px;">
                                        <div ng-message="required" style="color: red;">Please Select At Least One Employee</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <hr />
                    <div class="text-center">
                        <md-button type="submit" class="md-raised md-primary" ng-click="savedata()" id="save-btn">
                            <i class="fa fa-floppy-o" aria-hidden="true"></i> Save
                        </md-button>
                        <md-button type="button" class="md-raised md-warn" data-ng-click="cancel()">
                            <i class="fa fa-times" aria-hidden="true"></i> Cancel
                        </md-button>
                    </div>
                </div>
            </div>
        </form>
    </div>
</section>
