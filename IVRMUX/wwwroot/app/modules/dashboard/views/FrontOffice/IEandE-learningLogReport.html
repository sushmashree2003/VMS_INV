<style>
    .multiselect {
        width: 22em;
        height: 10em;
        border: solid 1px #5cb7ff;
        overflow: auto;
        margin-left: 4%;
        margin-bottom: 1%;
        padding: 2%;
    }

    .aaa {
        margin-top: 28px;
        margin-right: 10px;
        padding-right: 1px;
        text-align: center;
    }
</style>
<section class="content" data-ng-init="loaddata()">
    <form class="form-horizontal ng-pristine ng-valid" role="form" name="myForm"  novalidate>
        <div class="box box-primary">
            <div class="box-header with-border">
                <h3 class="box-title">Log Report</h3>
                <div class="box-tools pull-right">
                    <button type="button" class="btn btn-box-tool" data-widget="collapse"><i class="fa fa-minus"></i></button>
                </div>
            </div>

            <div class="box-body">
                <!--<div class="row ">
                    <div class="col-sm-12 text-center">
                        <div class="well">
                            <div style="text-align:center;" data-ng-init="Logtype='IE_Team'">
                                <input value="IE_Team" ng-model="Logtype" type="radio" name="Logtype">
                                <span class="lbl padding-8">
                                    IE-Team
                                </span>
                                <input value="E_Learning" ng-model="Logtype" type="radio" name="Logtype">
                                <span class="lbl padding-8">
                                    E-Learning
                                </span>
                            </div>
                            <div class="error-messages" ng-if="interacted(myForm.Logtype)" ng-messages="myForm.Logtype.$error">
                                <div ng-message="required">Select Option</div>
                            </div>
                        </div>
                    </div>
                </div>-->

                <div class="col-sm-3"></div>
                <div class="col-sm-6 text-center " style="margin-top:25px">
                    <div class="row">
                        <div class="col-sm-4 ">
                            <label>Employee Name:</label>
                        </div>
                        <div class="col-sm-6 ">
                            <div class="form-group text-center">
                                <ui-select ng-model="obj.hrmE_Id" name="stucst" required>
                                    <ui-select-match placeholder="Select Employee Name">
                                        <span ng-bind="$select.selected.emplYoeeName"></span>
                                    </ui-select-match>
                                    <ui-select-choices repeat="item in (employeelist | filter: $select.search) track by item.hrmE_Id" value="item.selected.hrmE_Id"
                                                       ng-selected="{{item.Selected == true}}">
                                        <span ng-bind-html="item.emplYoeeName | highlight: $select.search"></span>
                                    </ui-select-choices>
                                </ui-select>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-sm-3"></div>

                <div class="col-sm-12" style="margin-top:15px">
                    <div class="row">
                        <div class="col-sm-2"></div>
                        <div class="form-group col-sm-4">
                            <label class="control-label col-sm-2">Year:<span style="color:Red">*</span></label>
                            <div class="col-sm-10">
                                <select class="form-control" data-ng-model="hreS_Year" name="hreS_Year" required>
                                    <option value="">Select</option>
                                    <option ng-repeat="leaveyear in leaveyeardropdown" value="{{leaveyear.hrmlY_LeaveYear}}" ng-selected="{{leaveyear.Selected===true}}">
                                        {{leaveyear.hrmlY_LeaveYear}}
                                    </option>
                                </select>
                                <div class="error-messages" ng-if="interacted(myForm.hreS_Year)" ng-messages="myForm.hreS_Year.$error">
                                    <div ng-message="required">Select  Year</div>
                                </div>
                            </div>
                        </div>

                        <div class="form-group col-sm-4">
                            <label class="control-label col-sm-2">Month:<span style="color:Red">*</span></label>
                            <div class="col-sm-10">
                                <select class="form-control" name="mnth" id="sel12" data-ng-model="month" ng-change="monthdays(month)" ng-required="all1=='0''">
                                    <option value="">--Select--</option>
                                    <option value="01">JANUARY</option>
                                    <option value="02">FEBRUARY</option>
                                    <option value="03">MARCH</option>
                                    <option value="04">APRIL</option>
                                    <option value="05">MAY</option>
                                    <option value="06">JUNE</option>
                                    <option value="07">JULY</option>
                                    <option value="08">AUGUST</option>
                                    <option value="09">SEPTEMBER</option>
                                    <option value="10">OCTOBER</option>
                                    <option value="11">NOVEMBER</option>
                                    <option value="12">DECEMBER</option>
                                </select>
                                <div class="error-messages" ng-if="interacted(myForm.mnth)" ng-messages="myForm.mnth.$error">
                                    <div ng-message="required">Select Month Name</div>
                                </div>
                            </div>

                        </div>
                        <div class="col-sm-2"></div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-12" style="margin-top:25px;">
                        <div class="text-center">
                            <input type="hidden" ng-model="Id" />
                            <md-button type="submit" class="md-raised md-primary" ng-disabled="checkenable" ng-click="Showreport()" id="save-btn">
                                <i class="fa fa-floppy-o" aria-hidden="true"></i>
                                Report
                            </md-button>
                            <md-button type="button" class="md-raised md-warn" data-ng-click="Clearid()">
                                <i class="fa fa-times" aria-hidden="true"></i>
                                Cancel
                            </md-button>
                        </div>
                    </div>
                </div>

            </div>
        </div>
       </form>
        <div class="box box-primary" ng-if="logindetails.length>0">
            <div class="box-header with-border">
                <h3 class="box-title">Employee Log Report</h3>
                <div class="box-tools pull-right">
                    <button type="button" class="btn btn-box-tool" data-widget="collapse"><i class="fa fa-minus"></i></button>
                </div>
            </div>
            <div class="box-body">
                <div class="col-sm-12">
                    <div class="row clearfix">
                        <div class="col-sm-4 text-left">
                            <div class="form-group">
                                <label class="control-label">
                                    <b> Total Grid Records :</b>
                                    <label class="badge">
                                        {{presentCountgrid}}
                                    </label>
                                </label>
                            </div>
                        </div>
                        <div class="col-sm-4 pull-right">
                            <div class="form-group">
                                <div class="input-group">
                                    <span class="input-group-addon">
                                        <i class="fa fa-search"></i>
                                    </span>
                                    <input class="form-control" ng-model="searchValue" type="text" placeholder="search here...">
                                </div>
                            </div>
                        </div>
                    </div>
                    <table class="table table-hover table-responsive table-bordered text-center">
                        <thead>
                            <tr>
                                <th>Sl No</th>
                                <th>Department Name</th>
                                <th>Login Type</th>
                                <th>Login Date Time</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr ng-repeat="user in  filterValue = (logindetails | filter : searchValue)">
                                <td>{{$index+1}}</td>
                                <td>{{user.HRMD_DepartmentName}}</td>
                                <td>{{user.IVRMMALD_logintype}}</td>
                                <td>{{user.IVRMMALD_DateTime  |date: 'dd/MM/yyyy'}}</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
</section>
