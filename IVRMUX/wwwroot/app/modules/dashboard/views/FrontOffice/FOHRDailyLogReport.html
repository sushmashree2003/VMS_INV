                                                            </div>

                                                </tbody>

<div id="showpdf" class="modal fade" role="dialog">

        <div class="modal-content">
            <div class="modal-footer">

            </div>

            <embed ng-src="{{content}}" style="width: 100%;" height="1000" />
            <div class="modal-body" oncontextmenu="return false"></div>
        </div>
    </div>
</div>
