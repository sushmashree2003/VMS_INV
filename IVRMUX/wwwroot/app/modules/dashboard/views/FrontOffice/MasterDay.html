

<section class="content twocoloumn">

    <div ng-init="loaddata()">

        <form class="form-horizontal ng-pristine ng-valid" role="form" name="myForm" method="post" novalidate>
            <div class="box box-primary">
                <div class="box-header with-border">
                    <h3 class="box-title"> Master Day Entry</h3>
                    <div class="box-tools pull-right">
                        <button type="button" class="btn btn-box-tool" data-widget="collapse"><i class="fa fa-minus"></i></button>
                    </div>
                </div>
                <div class="box-body">
                    <div class="row">
                        <div class="col-sm-4 col-sm-offset-4">
                            <div class="form-group">
                                <label class="control-label col-sm-4">Day Name:<span style="color:Red">*</span></label>
                                <div class="col-sm-8">
                                    <input type="text" class="form-control active" name="Name" placeholder="Enter Day Name" ng-model="fomD_DayName" required>
                                    <div class="error-messages" ng-if="interacted(myForm.Name)" ng-messages="myForm.Name.$error">
                                        <div ng-message="required">Please Enter Day Name</div>
                                    </div>
                                </div>
                            </div>

                            <!--<div class="form-group">
                                <label class="control-label col-sm-4">Day Code:<span style="color:Red">*</span></label>
                                <div class="col-sm-8">
                                    <input type="text" class="form-control active" name="Name" placeholder="Enter Day Name" ng-model="invmT_TaxName" required>
                                    <div class="error-messages" ng-if="interacted(myForm.Name)" ng-messages="myForm.Name.$error">
                                        <div ng-message="required">Please Enter Day Code</div>


                                    </div>
                                </div>
                            </div>-->

                            <div class="form-group">
                                <label class="control-label col-sm-4">Day Code:<span style="color:Red">*</span></label>
                                <div class="col-sm-8">
                                    <select class="form-control"  ng-model="fomD_DayCode" name="codeName" >
                                        <option value="">--Select--</option>
                                        <option value="MON">MON</option>
                                        <option value="TUE">TUE</option>
                                        <option value="WED">WED</option>
                                        <option value="THU">THU</option>
                                        <option value="FRI">FRI</option>
                                        <option value="SAT">SAT</option>
                                        <option value="SUN">SUN</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>


                <div class="text-center">
                    <input type="hidden" ng-model="fomD_Id" value="{{fomD_Id}}" />
                    <md-button type="submit" class="md-raised md-primary" ng-click="savedata()" ng-disabled="form.$invalid" id="save-btn">
                        <i class="fa fa-floppy-o" aria-hidden="true"></i>
                        Save
                    </md-button>
                    <md-button type="button" class="md-raised md-warn" data-ng-click="cancel()">
                        <i class="fa fa-times" aria-hidden="true"></i>
                        Cancel
                    </md-button>
                </div>
            </div>



        </form>
        <!--ng-show="get_tax.length>0"-->
        <div class="box box-primary">
            <div class="box-header with-border">
                <h3 class="box-title">Master Day List</h3>
                <div class="box-tools pull-right">
                    <button type="button" class="btn btn-box-tool" data-widget="collapse" data-placement="bottom" data-toggle="tooltip" title="collapsible"><i class="fa fa-minus"></i></button>
                </div>
            </div>
            <!-- /.box-header -->
            <div class="box-body">
                <div class="row">
                    <div class="col-sm-4">
                        <div class="form-group">
                            <label class="control-label">
                                <b> Total Grid Records :</b>
                                <label class="badge">
                                    {{presentCountgrid}}
                                </label>
                            </label>
                        </div>
                    </div>
                    <!--<div class="col-sm-4">
                        <div class="form-group" ng-if="searchValue!=''">
                            <label class="control-label">
                                <b>Total Records Searched : </b>
                                <label class="badge">
                                    {{filterValue1.length}}
                                </label>
                            </label>
                        </div>
                    </div>-->
                    <!--<div class="col-sm-4 pull-right">
                        <div class="form-group">
                            <div class="input-group">
                                <span class="input-group-addon">
                                    <i class="fa fa-search"></i>
                                </span>
                                <input class="form-control" ng-model="searchValue" type="text" placeholder="search here...">
                            </div>
                        </div>
                    </div>-->
                </div>
                <table class="table table-hover table-responsive table-bordered text-center">
                    <thead>
                        <tr>
                            <th>
                                <a href="" ng-click="sortBy('sno')">SL.No.</a>
                            </th>
                            <th><a href="" ng-click="sortBy('FOMD_DayName')">Day Name</a></th>
                            <th><a href="" ng-click="sortBy('FOMD_DayCode')">Day Code</a> </th>

                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>

                        <tr ng-repeat="user in getarray">
                            <td>{{itemsPerPage *(currentPage-1)+$index+1}}</td>
                            <td>{{user.fomD_DayName}}</td>
                            <td>{{user.fomD_DayCode}}</td>

                            <td class="text-center">
                                <a class="text-aqua" href="" ng-click="edit(user)" data-placement="bottom" data-toggle="tooltip" title="Edit">
                                    <i class="fa fa-pencil-square-o" aria-hidden="true"></i>
                                </a>
                                &nbsp;
                                <span ng-if="user.fomD_ActiveFlag === false">
                                    <a href="" ng-click="deactive(user)"
                                       class="text-green" data-placement="bottom" data-toggle="tooltip" title="Activate">
                                        <i> Activate </i>
                                    </a>
                                </span>
                                <span ng-if="user.fomD_ActiveFlag === true">
                                    <a href="" ng-click="deactive(user)"
                                       class="text-danger" data-placement="bottom" data-toggle="tooltip" title="Deactivate">
                                        <i> Deactivate</i>
                                    </a>
                                </span>
                            </td>
                        </tr>
                    </tbody>
                </table>
                <dir-pagination-controls max-size="5"
                                         direction-links="true"
                                         boundary-links="true">
                </dir-pagination-controls>

            </div>
        </div>

    </div>
</section>
