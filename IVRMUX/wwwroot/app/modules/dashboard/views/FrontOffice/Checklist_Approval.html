<section class="content" data-ng-init="onLoadGetData()">
    <div class="box box-primary">
        <div class="box-header with-border">
            <h3 class="box-title">Checklist Approval</h3>
            <div class="box-tools pull-right">
                <button type="button" class="btn btn-box-tool" data-widget="collapse" data-placement="bottom" data-toggle="tooltip" title="collapsible"><i class="fa fa-minus"></i></button>
            </div>
        </div>
        <form class="form-horizontal" role="form" name="myForm1">
            <div class="box-body">
                <div class="row">
                    <div class="col-sm-6">
                        <div class="form-group">
                            <label class="control-label col-sm-5">Checklist Type :<strong style="color:red;display:inline; font-weight: bolder; margin-left: 7px;">*</strong></label>
                            <div class="col-sm-7">
                                <select class="form-control" id="sel1" name="PosId" data-ng-model="chklst.ismclT_Id" required>
                                    <option value="">--Select--</option>
                                    <option ng-repeat="chk in checklisttypeList" value="{{chk.ismclT_Id}}" ng-selected="{{chk.Selected == true}}">
                                        {{chk.ismclT_Name}}
                                    </option>
                                </select>
                                <div class="error-messages" ng-if="interacted1(myForm1.PosId)" ng-messages="myForm1.PosId.$error">
                                    <div ng-message="required">Select Checklist Type</div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="col-sm-6">
                        <div class="form-group">
                            <label class="control-label col-sm-5">Floor :<strong style="color:red;display:inline; font-weight: bolder; margin-left: 7px;">*</strong></label>
                            <div class="col-sm-7">
                                <select class="form-control" id="sel2" name="floorname" data-ng-model="chklst.hrmF_Id" required>
                                    <option value="">--Select--</option>
                                    <option ng-repeat="floor in floorList" value="{{floor.hrmF_Id}}" ng-selected="{{floor.Selected == true}}">
                                        {{floor.hrmF_FloorName}}
                                    </option>
                                </select>
                                <div class="error-messages" ng-if="interacted1(myForm1.floorname)" ng-messages="myForm1.floorname.$error">
                                    <div ng-message="required">Select Floor</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="box-footer text-center">
                    <md-button type="button" class="md-raised md-primary" data-ng-click="savejob(chklst)">
                        <i class="fa fa-floppy-o" aria-hidden="true"></i>
                        Find
                    </md-button>
                    <md-button type="button" class="md-raised md-warn" data-ng-click="cancel()">
                        <i class="fa fa-times" aria-hidden="true"></i>
                        Cancel
                    </md-button>
                </div>
            </div>
        </form>
        <!--==================== Image Preview Model ===========================-->
        <div id="myimagePreview" class="modal fade" role="dialog">
            <div class="modal-dialog" style="width:55%;">
                <div class="modal-content">
                    <div class="modal-header">
                        <button type="button" class="close" data-dismiss="modal"><i class="fa fa-times text-white" aria-hidden="true"></i></button>
                        <h3> Check List Approval Images </h3>
                        
                    </div>
                    <div class="modal-body">
                        <div class="box">
                            <div class="box-body">
                                <img id="preview" class="img-responsive" />
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!--====================PDF view========-->
        <div id="showpdf" class="modal fade" role="dialog">
            <div class="modal-dialog modal-lg">
                <form id="qqqq">

                    <div class="modal-content">
                        <div class="modal-footer">
                            <button type="button" class="btn btn-default" data-dismiss="modal">Close</button>
                        </div>
                        <div id="pdfIdzz">
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <div class="box box-primary" ng-show="EmployeeDis">
        <div class="box-header with-border">
            <h3 class="box-title">Check list Approval Details</h3>
            <div class="box-tools pull-right">
                <button type="button" class="btn btn-box-tool" data-widget="collapse" data-placement="bottom" data-toggle="tooltip" title="collapsible"><i class="fa fa-minus"></i></button>
            </div>
        </div>
        <!-- /.box-header -->
        <div class="box-body">
            <div class="PFChallan" id="Baldwin">
                <div id="PFChallan">
                    <div class="margin-top-20 margin-bottom-10">
                    </div>
                    <div class="scrollTable">
                        <div id="Table" class="margin-top-20 margin-bottom-10">
                            <table class="table-bordered table margin-bottom-10">
                                <thead>
                                    <tr>
                                        <th rowspan="2">Sl.No</th>
                                        <th rowspan="2">Item</th>
                                        <th rowspan="2">Quantity</th>
                                        <th rowspan="2">Verify</th>
                                        <th rowspan="2">
                                            Verified Morning Quantity

                                            <label>
                                                <input name="Morning" value="all" type="checkbox" ng-true-value="true" ng-false-value="false" ng-model="morning" ng-click="Morning_chk()" ng-disabled="chkk" >
                                                <span class="lbl padding-8">
                                                    All
                                                </span>
                                            </label>
                                        </th>
                                        <th rowspan="2">Verified Evening Quantity
                                            <label>
                                                <input name="Evening" value="all" type="checkbox" ng-true-value="true" ng-false-value="false" ng-model="evening" ng-click="Evening_chk()" ng-disabled="chkkkk" >
                                                <span class="lbl padding-8">
                                                    All
                                                </span>
                                            </label>
                                        </th>
                                        <th rowspan="2">Remarks</th>
                                        <th rowspan="2">Choose File</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr ng-repeat="item in checklistmappedList">
                                        <td style="text-align:right">{{$index +1}}</td>
                                        <td class="text-left">{{item.ISMCL_Name}}</td>
                                        <td class="text-left">{{item.ISMCLD_Qty}}</td>
                                        <td>
                                            <label>
                                                <input type="checkbox" ng-model="item.selected" value="{{item.Id}}" ng-change="optionToggled(newuser,itemsPerPage *(currentPage-1)+$index)">
                                                <span class="lbl padding-8"></span>
                                            </label>
                                        </td>
                                        <td width="200px">
                                            <textarea class="form-control textareaclass" name="hrqty_{{$index}}" rows="1"
                                                      ng-model="item.ismclD_MorningQty" maxlength="5" allow-pattern="[0-9.]" id="qty{{$index}}" required></textarea>

                                        </td>
                                        <td width="200px">
                                            <textarea class="form-control textareaclass" name="hrqty_{{$index}}" rows="1"
                                                      ng-model="item.ismclD_EveningQty" maxlength="5" allow-pattern="[0-9.]" id="qty{{$index}}" required></textarea>

                                        </td>
                                        <td width="200px">
                                            <textarea class="form-control textareaclass" name="hrrem_{{$index}}" rows="1"
                                                      ng-model="item.ismclT_Remarks" id="comment{{$index}}" required></textarea>
                                        </td>
                                        <td width="150px">
                                            <label class="custom-file-input file-blue1" style="width:100%;margin:auto;">
                                                <input type="file" name="impfile" id="document" class="btn btn-success" value="Import" ng-model="item.ISMCLT_FilePath" onchange="angular.element(this).scope().selectFileforUploadzd(this, angular.element(this).scope().checklistmappedList)" style="padding-top: 1px;padding-bottom: 2px;" opts="checklistmappedList" />
                                            </label>                                            
                                            <span ng-show="ismclT_FilePath!=null && ismclT_FilePath!=''">
                                                <a ng-if="ismclT_FilePath  !=null && ismclT_FilePath !=''" style="color:red;display:inline; font-weight: bolder;" data-ng-click="previewimg_new(ismclT_FilePath)"> view</a>
                                            </span>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
            <div class="text-center">
                <md-button type="button" class="md-raised md-primary" data-ng-click="saveapproval()">
                    <i class="fa fa-floppy-o" aria-hidden="true"></i>
                    Save
                </md-button>
                <md-button type="button" class="md-raised md-warn" data-ng-click="cleardata()">
                    <i class="fa fa-times" aria-hidden="true"></i>
                    Cancel
                </md-button>
            </div>
        </div>
    </div>
</section>
