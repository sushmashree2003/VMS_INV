

<section class="content">
    <form class="form-horizontal ng-pristine ng-valid" name="myForm" role="form" ng-init="BindData()" novalidate>
        <div class="box box-primary">
            <div class="box-header with-border">
                <h3 class="box-title">Staff Gate Pass</h3>
                <div class="box-tools pull-right">
                    <button type="button" class="btn btn-box-tool" data-widget="collapse"><i class="fa fa-minus"></i></button>

                </div>
            </div>
            <div class="box-body">
                <div class="row" ng-show="institutionlist.length > 1">
                    <div class="col-sm-6 col-sm-offset-3">
                        <div class="form-group">
                            <label class="control-label col-sm-4">Company Name:<span style="color:Red">*</span></label>
                            <div class="col-sm-8">
                                <select class="form-control" ng-model="mI_Id" name="msint" required ng-change="BindData();" ng-disabled="institute_flag">
                                    <option ng-repeat="val in institutionlist" value="{{val.mI_Id}}" ng-selected="val.mI_Id==mI_Id">
                                        {{val.mI_Name}}
                                    </option>
                                </select>
                                <div class="error-messages" ng-if="interacted(myForm.msint)" ng-messages="myForm.msint.$error">
                                    <div ng-message="required">Select Institution</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-sm-6">
                        <div class="form-group">
                            <label class="control-label col-sm-4">Department Name:<span style="color:Red">*</span></label>
                            <div class="col-sm-8">
                                <select class="form-control" id="sel1" name="stafdep" ng-model="hrmD_Id" ng-change="get_department()" required>

                                    <option value="">--Select--</option>
                                    <option ng-repeat="user in filldepartment" value="{{user.hrmD_Id}}" ng-selected="{{user.hrmD_Id == hrmD_Id}}">
                                        {{user.hrmD_DepartmentName}}
                                    </option>
                                </select>
                                <div class="error-messages" ng-if="interacted(myForm.stafdep)" ng-messages="myForm.stafdep.$error">
                                    <div ng-message="required">Please Select Department</div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="col-sm-6">
                        <div class="form-group">
                            <label class="control-label col-sm-4">Designation Name:<span style="color:Red">*</span></label>
                            <div class="col-sm-8">
                                <select class="form-control" id="sel1" name="stafdep11" ng-model="hrmdeS_Id" ng-change="get_emp()" required>

                                    <option value="">--Select--</option>
                                    <option ng-repeat="user in filldesignation" value="{{user.hrmdeS_Id}}" ng-selected="{{user.hrmdeS_Id == hrmdeS_Id}}">
                                        {{user.hrmdeS_DesignationName}}
                                    </option>
                                </select>
                                <div class="error-messages" ng-if="interacted(myForm.stafdep11)" ng-messages="myForm.stafdep11.$error">
                                    <div ng-message="required">Please Select Designation</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-sm-6">
                        <div class="form-group">
                            <label class="control-label col-sm-4">Staff Name:<span style="color:red">*</span></label>
                            <div class="col-sm-8">
                                <select class="form-control" ng-model="hrmE_Id" name="empna" required>
                                    <option value="">--Select--</option>
                                    <option ng-repeat="emp in emplist" value="{{emp.hrmE_Id}}" ng-selected="emp.hrmE_Id==hrmE_Id">
                                        {{emp.empname}}
                                    </option>
                                </select>
                                <div class="error-messages" ng-if="interacted(myForm.empna)" ng-messages="myForm.empna.$error">
                                    <div ng-message="required">Please Select Staff Name</div>
                                </div>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="control-label col-sm-4">Date:<span style="color:red">*</span></label>
                            <div class="col-sm-8">
                                <md-datepicker name="sch_date" onkeydown="return false" ng-model="gphsT_DateTime" md-placeholder="Enter date..." required></md-datepicker>
                                <div class="error-messages" ng-if="interacted(myForm.sch_date)" ng-messages="myForm.sch_date.$error">
                                    <div ng-message="required" style="color:red">Please Select Date</div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-sm-6">
                        <div class="form-group">
                            <label class="control-label col-sm-4">Card No:</label>
                            <div class="col-sm-8">
                                <input type="text" class="form-control" name="cardno" ng-model="gphsT_IDCardNo" allow-pattern="(\s|[a-zA-Z-0-9])" placeholder="Enter Card No." ng-maxlength="100">
                                <div class="error-messages" ng-if="interacted(myForm.cardno)" ng-messages="myForm.cardno.$error">
                                    <div ng-message="required">Enter Card No</div>
                                </div>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="control-label col-sm-4">Remarks :</label>
                            <div class="col-sm-8">
                                <textarea type="text" name="rmrk" ng-model="gphsT_Remarks" class="form-control" maxlength="250" rows="3" placeholder="Please Enter Remarks" />
                                <div class="error-messages" ng-if="interacted(myForm.rmrk)" ng-messages="myForm.rmrk.$error">
                                    <div ng-message="required">Please fill Remarks</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="text-center">
                        <input type="hidden" ng-model="gphsT_Id" value="{{gphsT_Id}}" />
                        <md-button type="submit" class="md-raised md-primary" ng-disabled="form.$invalid" id="save-btn" ng-click="savedata()">
                            <i class="fa fa-floppy-o" aria-hidden="true"></i>
                            Save
                        </md-button>
                        <md-button type="button" class="md-raised md-warn" ng-click="cancel()">
                            <i class="fa fa-times" aria-hidden="true"></i>
                            Cancel
                        </md-button>
                        <md-button type="button" class="md-raised md-primary" id="print-btn" ng-disabled="staff_printoption" ng-click="Print()">
                            <i class="fa fa-print" aria-hidden="true"></i>
                            Print
                        </md-button>
                    </div>
                </div>
            </div>
        </div>
    </form>


    <div class="box box-primary" ng-show="alldata.length>0">
        <div class="box-header with-border">
            <h3 class="box-title">Staff Gate Pass List</h3>
            <div class="box-tools pull-right">
                <button type="button" class="btn btn-box-tool" data-widget="collapse" data-placement="bottom" data-toggle="tooltip" title="collapsible"><i class="fa fa-minus"></i></button>
            </div>
        </div>

        <div class="box-body">
            <div class="row">
                <div class="col-sm-4">
                    <div class="form-group">
                        <label class="control-label">
                            <b> Total Grid Records :</b>
                            <label class="badge">
                                {{alldata.length}}
                            </label>
                        </label>
                    </div>
                </div>
                <div class="col-sm-4">
                    <div class="form-group" ng-if="searchValue!=''">
                        <label class="control-label">
                            <b>Total Records Searched : </b>
                            <label class="badge">
                                {{filterValue1.length}}
                            </label>
                        </label>
                    </div>
                </div>
                <div class="col-sm-4 pull-right">
                    <div class="form-group">
                        <div class="input-group">
                            <span class="input-group-addon">
                                <i class="fa fa-search"></i>
                            </span>
                            <input class="form-control" type="text" ng-model="searchValue" placeholder="search here...">
                        </div>
                    </div>
                </div>
            </div>
            <table class="table table-bordered text-center">
                <thead>
                    <tr>
                        <th style="text-align:center">
                            SL. No.
                        </th>

                        <th style="text-align:center">
                            <a href="" ng-click="sort('empname')"> Staff Name</a>
                        </th>
                        <th style="text-align:center">
                            <a href="" ng-click="sort('hrmD_DepartmentName')">Department</a>
                        </th>
                        <th style="text-align:center">
                            <a href="" ng-click="sort('hrmdeS_DesignationName')"> Designation </a>
                        </th>
                        <th style="text-align:center">
                            <a href="" ng-click="sort('gphsT_GatePassNo')">Gate Pass No</a>
                        </th>
                        <th style="text-align:center">
                            <a href="" ng-click="sort('gphsT_IDCardNo')"> Card No</a>
                        </th>
                        <th style="text-align:center">
                            <a href="" ng-click="sort('gphsT_DateTime')">Date</a>
                        </th>
                        <th style="text-align:center">
                            <a href="" ng-click="sort('gphsT_Remarks')"> Remark</a>
                        </th>


                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr dir-paginate="newuser1 in filterValue1 = (alldata | filter : searchValue) | orderBy:sortKey:sortReverse  | itemsPerPage:itemsPerPage" current-page="currentPage">
                        <td>{{itemsPerPage *(currentPage-1)+$index+1}}</td>

                        <td>{{newuser1.empname}}</td>
                        <td>{{newuser1.hrmD_DepartmentName}}</td>
                        <td>{{newuser1.hrmdeS_DesignationName}}</td>
                        <td>{{newuser1.gphsT_GatePassNo}}</td>
                        <td>{{newuser1.gphsT_IDCardNo}}</td>
                        <td>{{newuser1.gphsT_DateTime | date:'dd-MM-yyyy'}}</td>
                        <td>{{newuser1.gphsT_Remarks}}</td>

                        <td>
                            <a href="javascript:void(0)" ng-click="EditRecord(newuser1)" data-toggle="tooltip" title="Edit"><i class="fa fa-pencil-square-o text-primary" aria-hidden="true"></i></a>
                            <span ng-if="!newuser1.gphsT_ActiveFlg">
                                <a href="" ng-click="deactivate(newuser1)" class="text-green" data-placement="bottom" data-toggle="tooltip" title="Activate">
                                    Activate
                                </a>
                            </span>
                            <span ng-if="newuser1.gphsT_ActiveFlg">
                                <a href="" ng-click="deactivate(newuser1)" class="text-danger" data-placement="bottom" data-toggle="tooltip" title="Deactivate">
                                    De-Activate
                                </a>
                            </span>
                        </td>
                    </tr>
                </tbody>
            </table>
            <dir-pagination-controls max-size="5"
                                     direction-links="true"
                                     boundary-links="true">
            </dir-pagination-controls>
        </div>
    </div>



    <div class="box box-primary" ng-show="staff_gate_pass">
        <div class="box-header with-border">
            <h3 class="box-title">Staff Gate Pass</h3>
            <div class="box-tools pull-right">
                <button type="button" class="btn btn-box-tool" data-widget="collapse" data-placement="bottom" data-toggle="tooltip" title="collapsible"><i class="fa fa-minus"></i></button>
            </div>
        </div>
        <div class="border" id="printSectionId">
            <br />
            <center>
                <table class="table" style="height: 300px;width: 500px;">
                    <thead style="background-color:white;">
                        <tr>
                            <th colspan="3"> <img style="text-align:center; height:100px !important;width:350px!important;margin-left: 10px" src="{{SchoolLogo}}"></th>
                        </tr>
                        <tr>
                            <th colspan="3" style="color:black;text-align: center;">Permission Slip</th>
                        </tr>
                    </thead>
                    <tbody ng-repeat="vss in currentstaffdata" style="padding-bottom: 100px;">
                        <tr>
                            <td align="left"><a href="">Sr. No.</a></td>
                            <td align="left" colspan="2">{{vss.gphsT_Id}}</td>
                        </tr>
                        <tr>
                            <td align="left"><a href="">Staff Name</a></td>
                            <td align="left" colspan="2">{{vss.empname}}</td>
                        </tr>
                        <tr>
                            <td align="left"><a href="">Department</a></td>
                            <td align="left" colspan="2">{{vss.hrmD_DepartmentName}}</td>
                        </tr>
                        <tr>
                            <td align="left"><a href="">Designation</a></td>
                            <td align="left" colspan="2">{{vss.hrmdeS_DesignationName}}</td>
                        </tr>
                        <!--<tr>
            <td align="left"><a href="">Mobile No</a></td>
            <td align="left" colspan="2">{{vss.hrmE_MobileNo}}</td>
        </tr>-->

                        <tr>
                            <td align="left"><a href="">Gate Pass No</a></td>
                            <td align="left" colspan="2">{{vss.gphsT_GatePassNo}}</td>
                        </tr>
                        <tr>
                            <td align="left"><a href="">Date & Time</a></td>
                            <td align="left" colspan="2">{{vss.gphsT_DateTime| date:"dd-MM-yyyy & HH:mm:ss"}}</td>
                        </tr>
                        <tr>
                            <td align="left"><a href="">Card No.</a></td>
                            <td align="left" colspan="2">{{vss.gphsT_IDCardNo}}</td>
                        </tr>
                        <tr>
                            <td align="left"><a href="">Remark.</a></td>
                            <td align="left" colspan="2">{{vss.gphsT_Remarks}}</td>
                        </tr>
                    </tbody>

                    <tfoot>
                        <tr>
                            <td align="left">Signature</td>
                            <td></td>
                            <td align="right">sign.Off Sup</td>
                        </tr>
                    </tfoot>
                </table>
            </center>
        </div>
    </div>



</section>
