<style>
    .box-content {
        list-style-type: none;
        position: relative;
        border: 1px solid #3e85a0;
        padding: 12px;
        /*min-height: 280px;*/
        border-radius: 5px;
    }
</style>
<section class="content">
    <div data-ng-init="onpageload()">
        <form class="form-horizontal" method="post" role="form" name="myForm" novalidate>
            <div class="box box-primary">
                <div class="box-header with-border">
                    <h3 class="box-title">TA-DA Adavance Apply</h3>
                    <div class="box-tools pull-right">
                        <button type="button" class="btn btn-box-tool" data-widget="collapse"><i class="fa fa-minus"></i></button>
                    </div>
                </div>
                <div class="box-body" ng-show="countBalance==true">
                    <div class="text-center"><b style="color:red"> Previous  TA-DA Adavance Is  Pending, Document Not Upload    </b></div>
                </div>
                <div class="box-body">
                    <div class="col-sm-12 box-content clearfix">
                        <div class="col-sm-6 form-horizontal">
                            <div class="form-group">
                                <label class="control-label col-sm-4">From Date:<span style="color:red;">*</span></label>
                                <div class="col-sm-8" style="padding-left: 0px !important;">
                                    <md-datepicker ng-model="startdate" name="startdate" id="date1" md-placeholder="Enter date" ng-change="FromDates()" md-min-date="plMaxdate" ng-disabled="txt_approxTotAmount > 0  || VTADAAA_Id > 0 " ng-paste="$event.preventDefault()" onkeydown="return false" required></md-datepicker>
                                    <div class="error-messages" ng-if="interacted(myForm.startdate)" ng-messages="myForm.startdate.$error">
                                        <div ng-message="required">Select From Date</div>
                                    </div>
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="control-label col-sm-4"> Departure Time:</label>
                                <div class="col-sm-8" allow-pattern="\d">

                                    <div uib-timepicker name="sch_time1" ng-model="vtadaaaA_DepartureTime" hour-step="hstep" minute-step="mstep" show-meridian="ismeridian" ng-disabled="txt_approxTotAmount > 0 || VTADAAA_Id > 0" required></div>
                                    <div class="error-messages" ng-if="interacted(myForm.sch_time1)"
                                         ng-messages="myForm.sch_time1.$error">
                                        <div ng-message="required">Select Time </div>
                                    </div>
                                </div>
                            </div>

                        </div>
                        <div class="col-sm-1 form-horizontal">
                            <!--<span>Travel Departure Time</span>
                            <hr />
                            <span>Travel Arrival Time</span>-->
                        </div>
                        <div class="col-sm-5 form-horizontal">
                            <div class="form-group">
                                <label class="control-label col-sm-4">To Date:<span style="color:red;">*</span></label>
                                <div class="col-sm-8">
                                    <md-datepicker ng-model="enddate" name="endatediff" ng-change="Getdatas()" ng-disabled="txt_approxTotAmount > 0 || VTADAAA_Id > 0 || !startdate" md-min-date="startdate" md-placeholder="Enter Date" ng-paste="$event.preventDefault()" onkeydown="return false" required></md-datepicker>
                                    <div class="error-messages" ng-if="interacted(myForm.endatediff)" ng-messages="myForm.endatediff.$error">
                                        <div ng-message="required">To Date</div>
                                    </div>
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="control-label col-sm-4"> Arrival Time:</label>
                                <div class="col-sm-8">
                                    <div uib-timepicker name="sch_time2" ng-model="vtadaaaA_ArrivalTime" min="min" hour-step="hstep" minute-step="mstep" show-meridian="ismeridian" ng-disabled="txt_approxTotAmount > 0 || VTADAAA_Id > 0" required></div>
                                    <div class="error-messages" ng-if="interacted(myForm.sch_time2)"
                                         ng-messages="myForm.sch_time2.$error">
                                        <div ng-message="required">Select Time </div>
                                    </div>
                                </div>
                            </div>

                        </div>
                    </div>
                    <div class="col-sm-12 box-content clearfix">
                        <div class="col-sm-6 form-horizontal">
                            <div class="form-group">
                                <label class="control-label col-sm-4">State:<span style="color:red;">*</span></label>
                                <div class="col-sm-8">
                                    <select class="form-control" id="sel1" name="Posdddd" ng-model="IVRMMS_Id" ng-change="Dropdown_State()" ng-disabled="VTADAAA_Id > 0 || !startdate || !enddate || !vtadaaaA_ArrivalTime || !vtadaaaA_DepartureTime" required>
                                        <option value="">--Select State--</option>
                                        <option ng-repeat="chk in getstate" value="{{chk.ivrmmS_Id}}" ng-selected="{{chk.Selected == true}}">
                                            {{chk.ivrmmS_Name}}
                                        </option>
                                    </select>
                                    <div class="error-messages" ng-if="interacted(myForm.Posdddd)"
                                         ng-messages="myForm.Posdddd.$error">
                                        <div ng-message="required">Select State </div>
                                    </div>
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="control-label col-sm-4">
                                    City:
                                    <span style="color:red;">*</span>
                                </label>
                                <div class="col-sm-8">
                                    <select class="form-control" id="sel1" name="PosId" ng-model="IVRMMCT_Id" ng-change="Dropdown_city()" ng-disabled="VTADAAA_Id > 0" required>
                                        <option value="">--Select City--</option>
                                        <option ng-repeat="chk in getCity" value="{{chk.ivrmmcT_Id}}" ng-selected="{{chk.ivrmmcT_Id == IVRMMCT_Id}}">
                                            {{chk.ivrmmcT_Name}}
                                        </option>
                                    </select>
                                    <div class="error-messages" ng-if="interacted(myForm.PosId)"
                                         ng-messages="myForm.PosId.$error">
                                        <div ng-message="required">Select City </div>
                                    </div>
                                </div>

                            </div>

                            <!--<div class="form-group">
                                <label class="control-label col-sm-4">
                                    Client
                                </label>
                                <div class="col-sm-8">
                                    <select class="form-control" id="sel1" name="clientname" ng-model="Client_Id" ng-change="clientaddress()">
                                        <option value="">--Select--</option>
                                        <option ng-repeat="option in getClient" value="{{option.ismmclT_Id}}" ng-selected="{{option.Selected == true}}">
                                            {{option.ismmclT_ClientName}}
                                        </option>
                                    </select>
                                </div>
                            </div>-->
                            <!--<div class="form-group">
                                <label class="control-label col-sm-4">Total Approximate Amount:</label>
                                <div class="col-sm-8 col-md-8">
                                    <input type="text" id="txtamt" ng-model="txt_amt" class="form-control" placeholder="Totalamount" ng-disabled="txt_approxTotAmount > 0" allow-pattern="[0-9.]" maxlength="10" autocomplete="off" ng-change="Approximate()" />
                                </div>
                            </div>-->
                        </div>
                        <div class="col-sm-6 form-horizontal">
                            <div class="form-group">
                                <label class="control-label col-sm-4">Address:</label>
                                <div class="col-sm-8">
                                    <textarea name="address" ng-model="txt_Address" class="form-control" resize: none; rows="3" placeholder="Address" />
                                    <div class="error-messages" ng-if="interacted(myForm.address)" ng-messages="myForm.address.$error">
                                        <div ng-message="required">Enter "></div>
                                    </div>
                                </div>
                            </div>

                            <!--<div class="form-group">
                                <label class="control-label col-sm-4">Remark: <span style="color:red;">*</span></label>
                                <div class="col-sm-8">
                                    <textarea maxlength="250" name="remarks" ng-model="txt_Remarks" class="form-control" resize: none; rows="3" placeholder="Remark" required />
                                    <div class="error-messages" ng-if="interacted(myForm.remarks)" ng-messages="myForm.remarks.$error">
                                        <div ng-message="required">Enter Remark</div>
                                    </div>
                                </div>
                            </div>-->
                            <!--<div class="form-group">
                                <label class="control-label col-sm-4">
                                    Client List: <a href="javascript:void(0)" ng-click="MultiClient()" data-placement="bottom" data-toggle="tooltip"
                                                    title="Upload file">
                                        <i class="fa fa-eye" style="color: black;" aria-hidden="true"></i>
                                    </a>
                                </label>
                                <div class="col-sm-8">
                                    <textarea ng-model="vtadaaA_ClientMultiple" class="form-control" resize: none; rows="3" placeholder="Client" ng-disabled="true" />

                                </div>
                            </div>-->
                        </div>
                    </div>
                    <div>
                        <table class="table table-responsive table-bordered clearfix" style="width:100%;">
                            <thead>
                                <tr>
                                    <th>Sl.No.</th>
                                    <th width="350">Client Name</th>
                                    <th>Remark's</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr ng-repeat="materal1 in clientnames_rem">
                                    <td class="text-center">
                                        {{$index+1}}
                                    </td>
                                    <td>
                                        <div>
                                            <select class="form-control" id="sel1" name="clientname" ng-model="materal1.Client_Id">
                                                <option value="">--Select--</option>
                                                <option ng-repeat="option in getClient" value="{{option.ismmclT_Id}}" ng-selected="{{option.ismmclT_Id == materal1.Client_Id}}">
                                                    {{option.ismmclT_ClientName}}
                                                </option>
                                            </select>
                                        </div>
                                    </td>
                                    <td>
                                        <div>
                                            <textarea maxlength="250" name="muliclient_remarks" ng-model="materal1.VTADDAMCF_Remarks" class="form-control" resize: none; rows="3" placeholder="Remark" required />
                                            <div class="error-messages" ng-if="interacted(myForm.muliclient_remarks)" ng-messages="myForm.muliclient_remarks.$error">
                                                <div ng-message="required">Enter Remark's</div>
                                            </div>
                                        </div>
                                    </td>
                                    <td>
                                        <span>
                                            <a href="" ng-show="$last" ng-click="addgrnrowsclient()">
                                                <i class="fa fa-plus"></i>
                                            </a>
                                        </span>
                                        <span class="" id="remove" ng-hide="clientnames_rem.length ==1">
                                            <a href="" ng-click="removeclient($index,objg1)">
                                                <i class="fa fa-minus" aria-hidden="true"></i>
                                            </a>
                                        </span>
                                    </td>

                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="col-sm-12 box-content clearfix" ng-show="get_allowence.length > 0 && IVRMMCT_Id > 0">
                        <table class="table table-bordered table-responsive">
                            <thead>
                                <tr>
                                    <td>Select</td>
                                    <td>
                                        Particular
                                    </td>
                                    <td>Amount</td>
                                    <td>Days</td>
                                    <td>Total Slots</td>

                                    <td>Slots</td>
                                    <td>Total Amount</td>
                                    <td>
                                        Remark
                                    </td>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td class="text-center">
                                        <input name="lvemp" ng-model="chk_FoodAmt" type="checkbox" ng-click="Foodamt_Chk()" ng-disabled="txt_amt > 0" />
                                        <span class="lbl padding-8">

                                        </span>
                                    </td>
                                    <td class="text-left">
                                        Food Amount
                                    </td>
                                    <td class="text-center">
                                        {{vtadacM_FoodAmt}}
                                    </td>
                                    <td>
                                        {{daydiffrence}}
                                    </td>
                                    <td>
                                        {{foodtotlslots}}
                                    </td>
                                    <td>
                                        <input type="text" class="form-control" ng-model="txtslot" ng-blur="amtchange()" placeholder="Enter Slot" ng-disabled="foodtotlslots < 0" />
                                    </td>
                                    <td>
                                        {{tOtaL_foodamt}}
                                    </td>
                                    <td>

                                        <textarea maxlength="250" name="remark" ng-model="Food_Remarks" class="form-control" resize: none; rows="2" placeholder="Remark" />
                                    </td>
                                </tr>
                                <tr>
                                    <td class="text-center">
                                        <input name="lvemp" ng-model="chk_AccAmt" type="checkbox" ng-click="accMandtionamt_Chk()" ng-disabled="txt_amt > 0" />
                                        <span class="lbl padding-8">

                                        </span>
                                    </td>
                                    <td class="text-left">
                                        Accommodation Amount
                                    </td>
                                    <td class="text-center">
                                        {{vtadacM_AccommodationAmt}}
                                    </td>
                                    <td>
                                        {{daydiffrence_two}}
                                    </td>
                                    <td>
                                        {{Acctotolslots}}
                                    </td>
                                    <td>
                                        <input type="text" class="form-control" ng-model="txtslotAcc" ng-blur="amtchangeACC()" placeholder="Enter Days" ng-disabled="Acctotolslots < 0" />
                                    </td>
                                    <td>
                                        {{totaL_AccmamtTwo}}
                                    </td>
                                    <td>
                                        <textarea maxlength="250" name="accremark" ng-model="Acc_Remarks" class="form-control" resize: none; rows="2" placeholder="Remark" />

                                    </td>
                                </tr>
                                <tr>
                                    <td class="text-center">
                                        <input name="lvemp" ng-model="chk_TransAmt" type="checkbox" ng-click="TransAmt_chk()" ng-disabled="txt_amt > 0" />
                                        <span class="lbl padding-8">

                                        </span>
                                    </td>
                                    <td class="text-left">
                                        Travel Amount
                                    </td>
                                    <td class="text-center">
                                        {{vtadacM_TransportAmt}}
                                    </td>
                                    <td>
                                        {{daydiffrence_three}}

                                    </td>
                                    <td></td>
                                    <td></td>
                                    <td>
                                        {{totaL_transTwo}}
                                    </td>
                                    <td> <textarea maxlength="250" name="remark" ng-model="transport_Remarks" class="form-control" resize: none; rows="2" placeholder="Remark" /></td>
                                </tr>
                                <tr>
                                    <td class="text-center">
                                        <input name="lvemp" ng-model="chk_OthersAmt" type="checkbox" ng-click="OtheraAmt_chk()" ng-disabled="txt_amt > 0 || !OtherTotal_amt" />
                                        <span class="lbl padding-8">

                                        </span>
                                    </td>
                                    <td class="text-left">
                                        Other Amount
                                    </td>
                                    <td class="text-center">
                                        <input type="text" class="form-control" allow-pattern="[0-9.]" ng-required="OthersAmt" placeholder="Other Amount" ng-model="OtherTotal_amt" ng-disabled="chk_OthersAmt==true" />
                                    </td>
                                    <td>
                                        {{daydiffrence_Four}}

                                    </td>
                                    <td></td>
                                    <td></td>
                                    <td>
                                        {{totaL_otherTwo}}
                                    </td>
                                    <td>
                                        <textarea maxlength="250" name="remark" ng-model="other_Remarks" class="form-control" resize: none; rows="2" placeholder="Remark" />
                                    </td>

                                </tr>

                            </tbody>
                        </table>

                        <div class="form-group">
                            <div class="col-md-6">

                            </div>
                            <div class="col-md-6">
                                <label class="col-sm-3 control-label">Total Approximate Amount</label>
                                <div class="col-sm-8">
                                    <input type="text" ng-disabled="Isdisabletxtss" class="form-control" ng-model="txt_approxTotAmount" />
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!--------Inserting Items-------->
                <div class="text-center">
                    <input type="text" value="{{vtadaaA_Id}}" class="hidden" ng-model="VTADAAA_Id" />
                    <input type="text" class="hidden" ng-model="VTADACM_TravelHour" />
                    <md-button type="submit" class="md-raised md-primary" data-ng-click="savedata()" ng-if="countBalance==false">
                        <i class="fa fa-save" aria-hidden="true"></i> SAVE
                    </md-button>
                    <md-button type="button" class="md-raised md-warn" ng-click="Clearid()">
                        <i class="fa fa-times" aria-hidden="true"></i> Cancel
                    </md-button>
                </div>
            </div>
        </form>
    </div>
    <div class="box box-primary">
        <div class="box-header with-border">
            <h3 class="box-title">TA-DA ADAVANCE DETAILS</h3>
            <div class="box-tools pull-right">
                <button type="button" class="btn btn-box-tool" data-widget="collapse" data-placement="bottom" data-toggle="tooltip" title="collapsible"><i class="fa fa-minus"></i></button>
            </div>
        </div>
        <!-- /.box-header -->
        <!---->
        <div class="box-body" ng-show="get_Report.length>0">
            <div class="row">
                <div class="col-sm-4">
                    <div class="form-group">
                        <label class="control-label">
                            <b> Total Grid Records :</b>
                            <label class="badge">
                                {{presentCountgrid}}
                            </label>
                        </label>
                    </div>
                </div>
                <div class="col-sm-4">
                    <div class="form-group" ng-if="searchValue!=''">
                        <label class="control-label">
                            <b>Total Records Searched : </b>
                            <label class="badge">
                                {{filterValue1.length}}
                            </label>
                        </label>
                    </div>
                </div>
                <div class="col-sm-4 pull-right">
                    <div class="form-group">
                        <div class="input-group">
                            <span class="input-group-addon">
                                <i class="fa fa-search"></i>
                            </span>
                            <input class="form-control" ng-model="searchValue" type="text" placeholder="search here...">
                        </div>
                    </div>
                </div>
            </div>
            <table class="table table-hover table-responsive table-bordered text-center">
                <thead>
                    <tr>
                        <th>
                            SL.No
                        </th>
                        <th>
                            City
                        </th>
                        <th>FromDate</th>
                        <th>Departure Time</th>
                        <th>To Date</th>
                        <th>Arrival Time</th>
                        <th>Total Applied Amount</th>


                        <th>
                            Action
                        </th>
                    </tr>
                </thead>
                <tbody>
                    <tr dir-paginate="user in filterValue1 = (get_Report | filter : searchValue)  | orderBy:propertyName:reverse |itemsPerPage:itemsPerPage" current-page="currentPage" ng-class-odd="'odd'" pagination-id="xyz">
                        <td class="hidden">
                            {{user.vtadaaA_Id}}
                        </td>
                        <td>{{itemsPerPage *(currentPage-1)+$index+1}}</td>
                        <td>
                            {{user.ivrmmcT_Name}}
                        </td>
                        <td class="text-left">{{user.vtadaaA_FromDate|date:'dd/MM/yyyy'}}</td>
                        <td>
                            {{user.vtadaaA_DepartureTime | date : 'shortTime'}}
                        </td>

                        <td class="text-left">{{user.vtadaaA_ToDate|date:'dd/MM/yyyy'}}</td>
                        <td>
                            {{user.vtadaaA_ArrivalTime | date : 'shortTime'}}
                        </td>
                        <td>
                            {{user.vtadaaA_TotalAppliedAmount}}
                        </td>


                        <td class="text-center">
                            <span ng-if="user.vtadaaA_StatusFlg=='Pending' && user.vtadaaA_ActiveFlg==true">

                                <a class="text-aqua" href="" ng-click="edit(user)" data-placement="bottom" data-toggle="tooltip" title="Edit">
                                    <i class="fa fa-pencil-square-o" aria-hidden="true"></i>
                                </a>
                                <a href="" ng-click="Deletedata(user)"
                                   class="text-danger" data-placement="bottom" data-toggle="tooltip" title="Deactivate">
                                    <i> Deactivate</i>
                                </a>
                            </span>
                            <span ng-if="user.vtadaaA_StatusFlg=='Pending' && user.vtadaaA_ActiveFlg==false">
                                <a href="" ng-click="Deletedata(user)"
                                   class="text-green" data-placement="bottom" data-toggle="tooltip" title="Deactivate">
                                    <i> Activate</i>
                                </a>
                            </span>
                            <span ng-if="user.vtadaaA_StatusFlg=='Rejected '">
                                Rejected
                            </span>

                            <span ng-if="user.vtadaaA_StatusFlg=='InProgress '">
                                InProgress
                            </span>
                            <span ng-if="user.vtadaaA_StatusFlg=='Approved'">
                                Approved
                            </span>
                        </td>

                    </tr>
                </tbody>
            </table>
            <dir-pagination-controls max-size="5"
                                     direction-links="true"
                                     boundary-links="true" pagination-id="xyz">
            </dir-pagination-controls>
        </div>
    </div>

    <div id="showclient" class="modal fade" role="dialog">
        <div class="modal-dialog modal-lg">
            <form id="qqqq">
                <div class="modal-content">
                    <div class="modal-footer">
                        <button type="button" class="btn btn-default" data-dismiss="modal">Close</button>
                    </div>
                    <div class="box-body">
                        <div class="col-sm-12">
                            <div class="form-group">
                                <label class="control-label col-sm-3">Multiple Client  :<strong style="color:red;">*</strong></label>
                                <div class="multiselect col-sm-6">
                                    <input class="form-control" ng-model="searchValuetwo" type="text" placeholder="search Multiple Client..." onkeydown="return false">
                                    <label>
                                        <input name="alitem" value="1" ng-model="allmiddff" type="checkbox" ng-click="allmidd(allmiddff)">
                                        <span class="lbl padding-8">
                                            All
                                        </span>
                                    </label>
                                    <label ng-repeat="mi in getClientwo | filter : searchValuetwo">
                                        <input name="mid" ng-model="mi.miiddd" type="checkbox">
                                        <span class="lbl padding-8">
                                            {{mi.ismmclT_ClientName}}
                                        </span>
                                    </label>
                                </div>
                            </div>
                            <div class="form-group">
                                <md-button class="md-raised md-primary" data-ng-click="AddClient()">
                                    <i class="fa fa-bar-chart" aria-hidden="true"></i> Add
                                </md-button>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>
</section>
