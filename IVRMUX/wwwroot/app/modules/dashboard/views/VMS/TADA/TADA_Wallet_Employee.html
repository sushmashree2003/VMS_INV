<style>
    .box-content {
        list-style-type: none;
        position: relative;
        border: 1px solid #3e85a0;
        padding: 12px;
        /*min-height: 280px;*/
        border-radius: 5px;
    }
</style>
<section class="content">
    <div data-ng-init="onpageload()">
        <form class="form-horizontal" method="post" role="form" name="myForm" novalidate>
            <div class="box box-primary">
                <div class="box-header with-border">
                    <h3 class="box-title">TOUR  WALLET   EMPLOYEE </h3>
                    <hr />
                    <div class="box-tools pull-right">
                        <button type="button" class="btn btn-box-tool" data-widget="collapse"><i class="fa fa-minus"></i></button>
                    </div>
                </div>
                <div class="box-body">
                    <div class="col-sm-12">
                        <h4>View Transactions</h4>
                        <hr />
                        <div class="col-sm-4">
                            <h5 style="font-size:medium">Opening  Balance :&nbsp;&nbsp; &nbsp;&nbsp;<span style="color:green !important">{{Opening}} </span>  </h5>
                        </div>
                        <div class="col-sm-4">
                            <h5 style="font-size:medium">Remaining  Balance : &nbsp;&nbsp;&nbsp;&nbsp;<span style="color:red !important">{{Remaining}} </span> </h5>
                        </div>
                        <div class="col-sm-4">
                            <div class="form-group">
                                <label class="control-label col-sm-4">Transactions:</label>
                                <div class="col-sm-8">
                                    <select class="form-control" id="sel1" name="Posdddd" ng-model="IER_ID" ng-change="OnTransction()">
                                        <option value="">--Select Transactions--</option>
                                        <option value="100000012">AllTransactions</option>
                                        <option ng-repeat="chk in getPlanerdata" value="{{chk.ieR_ID}}" ng-selected="{{chk.ieR_ID == IER_ID}}">
                                            {{chk.ieR_PlanName}}
                                        </option>
                                    </select>
                                    <div class="error-messages" ng-if="interacted(myForm.Posdddd)"
                                         ng-messages="myForm.Posdddd.$error">
                                        <div ng-message="required">Select Category </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                    </div>
                    <div class="col-sm-12">
                        <div class="col-sm-4 box-content clearfix" ng-repeat="user in TourPlanDetails">
                            <label><strong>Tour Name :</strong>    &nbsp;&nbsp; &nbsp; {{user.IER_PlanName}} </label><br /><br />
                            <label><strong>Date  Time  :</strong>  &nbsp;&nbsp; &nbsp; {{user.ILRT_CreatedDate}} </label><br /><br />
                            <label><strong> Cost :</strong> &nbsp;&nbsp; &nbsp;</label>{{user.ILRT_Cost}}<br /><br />
                            <label><strong>Client Name :</strong> &nbsp;&nbsp; &nbsp;</label>{{user.ISMSLE_LeadName}}<br /><br />
                            <label><strong>Product Name :</strong> &nbsp;&nbsp; &nbsp;</label>{{user.ISMSMPR_ProductName}}<br /><br />
                            <label><strong>Description :</strong> &nbsp;&nbsp; &nbsp;{{user.ILRT_Remarks}}</label><br /><br />

                        </div>
                    </div>
                </div>



            </div>

        </form>
    </div>
</section>

                <div class="col-sm-8 text-left">
                    <h4 class="text-white"> TADA Route Document Apply </h4>
                </div>
                <div class="cols-sm-4 text-right">
                    <button type="button" class="btn btn-primary" data-dismiss="modal">Close<i class="fa fa-times text-white" aria-hidden="true"></i></button>
                </div>
            </div>
            <div class="modal-body">
                <div class="box">

                        <img id="tadapreviewX" class="img-responsive" />

                </div>
            </div>

    </div>
</div>
