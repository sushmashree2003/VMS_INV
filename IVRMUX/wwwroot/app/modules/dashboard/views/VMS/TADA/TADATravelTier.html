<style>
    /*.multiselect {
        width: 21.7em !important;
        height: 10em !important;
        border: solid 1px #5cb7ff !important;
        overflow: auto !important;
        margin-left: 2.7% !important;
        margin-bottom: 1% !important;
        padding: 2% !important;
    }*/
</style>
<section class="content">
    <div data-ng-init="onLoadGetData()">
        <form class="form-horizontal ng-pristine ng-valid" method="post" role="form" name="myForm" novalidate>
            <div class="box box-primary">
                <div class="box-header with-border">
                    <h3 class="box-title">TADA Travel Tier</h3>
                    <div class="box-tools pull-right">
                        <button type="button" class="btn btn-box-tool" data-widget="collapse"><i class="fa fa-minus"></i></button>
                    </div>
                </div>
                <div class="box-body">
                    <div class="row">
                        <div class="col-md-12 col-sm-12">
                            <div class="col-md-6 col-sm-6">
                                <div class="form-group">
                                    <label class="control-label col-sm-4"> State :<span style="color:Red">*</span></label>
                                    <div class="col-sm-8">
                                        <select class="form-control" ng-model="ivrmmS_Id" name="From" ng-change="Tocities(ivrmmS_Id)" required>
                                            <option value="">--Select State -- </option>
                                            <option ng-repeat="cm in Statedatalist" value="{{cm.ivrmmS_Id}}" ng-selected="{{cm.ivrmmS_Id==ivrmmS_Id}}">
                                                {{cm.ivrmmS_Name}}
                                            </option>
                                        </select>
                                    </div>
                                    <div class="col-sm-4 col-sm-offset-4 error-messages" ng-if="interacted(myForm.From)" ng-messages="myForm.From.$error">
                                        <div ng-message="required">Select  State</div>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label for="sel2" class="control-label col-sm-4">Travel City : <span style="color:red;">*</span></label>
                                    <div class="multiselect col-sm-8">
                                        <input class="form-control" data-ng-model="searchchkbx1" type="text" placeholder="search here..." />
                                        <label>
                                            <input name="clsoption" value="all" data-ng-model="usercheckC" type="checkbox" ng-click="all_checkC()">
                                            <span class="lbl padding-8">
                                                All
                                            </span>
                                        </label>
                                        <label ng-repeat="mod in CityList | filter:searchchkbx1" value="{{mod.IVRMMCT_Id}}" required>
                                            <input type="checkbox" data-ng-model="mod.selected" ng-click="togchkbxC()"  ng-required="isOptionsRequiredtwo()" name="CityList" />
                                            <span class="lbl padding-8">{{mod.IVRMMCT_Name}}</span>
                                        </label>
                                    </div>
                                    <div class=" col-sm-4 col-sm-offset-4 error-messages" ng-if="interacted(myForm.CityList)" ng-messages="myForm.CityList.$error">
                                        <div ng-message="required">Please Select Any One City</div>
                                    </div>
                                </div>

                            </div>
                            <div class="col-md-6 col-sm-6">
                                <div class="form-group">
                                    <label class="control-label col-sm-4"> Travel Tier :<span style="color:Red">*</span></label>
                                    <div class="col-sm-8">
                                        <select class="form-control" ng-model="vrmmdT_Id" name="Tier" required>
                                            <option value="">--Select Travel Tier -- </option>
                                            <option ng-repeat="cm in Travel_Tier" value="{{cm.vrmmdT_Id}}" ng-selected="{{cm.vrmmdT_Id==vrmmdT_Id}}">
                                                {{cm.vrmmdT_Name}}
                                            </option>
                                        </select>
                                    </div>
                                    <div class="col-sm-4 col-sm-offset-4 error-messages" ng-if="interacted(myForm.Tier)" ng-messages="myForm.Tier.$error">
                                        <div ng-message="required">Select Travel Tier</div>
                                    </div>
                                </div>



                            </div>
                        </div>

                        <br />
                    </div>
                </div>
                <!--------Inserting Items-------->
                <div class="text-center">
                  
                    <md-button type="submit" class="md-raised md-primary" data-ng-click="SaveTierdata()">
                        <i class="fa fa-bar-chart" aria-hidden="true"></i> SAVE
                    </md-button>
                    <md-button type="button" class="md-raised md-warn" ng-click="Clearid()">
                        <i class="fa fa-times" aria-hidden="true"></i> Cancel
                    </md-button>
                </div>
            </div>
        </form>
    </div>
    <div class="box box-primary"ng-if="TADA_Traveltier.length>0">
        <div class="box-header with-border">
            <h3 class="box-title">TADA CITY TRAVEL TIER</h3>
            <div class="box-tools pull-right">
                <button type="button" class="btn btn-box-tool" data-widget="collapse" data-placement="bottom" data-toggle="tooltip" title="collapsible"><i class="fa fa-minus"></i></button>
            </div>
        </div>
        <div class="box-body">
            <div class="row">


                <div class="col-sm-4">
                    <div class="form-group">
                        <label class="control-label">
                            <b> Total Grid Records :</b>
                            <label class="badge">
                                {{TADA_Traveltier.length}}
                            </label>
                        </label>
                    </div>
                </div>
                <div class="col-sm-4">
                    <div class="form-group" ng-if="search!=''">
                        <label class="control-label">
                            <b>Total Records Searched : </b>
                            <label class="badge">
                                {{filterValue.length}}
                            </label>
                        </label>
                    </div>
                </div>

                <div class="col-sm-4 pull-right">
                    <div class="form-group">
                        <div class="input-group">
                            <span class="input-group-addon">
                                <i class="fa fa-search"></i>
                            </span>
                            <input class="form-control" type="text" ng-model="search" placeholder="search here...">
                        </div>
                    </div>
                </div>
            </div>
            <table class="table table-hover table-responsive table-bordered">
                <thead>
                    <tr>
                        <th style="width:5%">SL.No.</th>
                        <th style="width:20%"><a href="" ng-click="sort('IVRMMS_Name')">State Name</a></th>
                        <th style="width:20%"><a href="" ng-click="sort('IVRMMCT_Name')">City Name </a></th>
                        <th style="width:10%"><a href="" ng-click="sort('VRMMDT_Name')">Tier Name</a></th>

                    </tr>
                </thead>
                <tbody>
                    <tr dir-paginate="user in filterValue=(TADA_Traveltier | filter : search) | orderBy:sortKey:reverse |itemsPerPage:itemsPerPage" current-page="currentPage">
                        <td class="text-center">{{itemsPerPage *(currentPage-1)+$index+1}}</td>
                        <td class="text-center">{{user.IVRMMS_Name}}</td>
                        <td class="text-center">{{user.IVRMMCT_Name}}</td>
                        <td class="text-center">{{user.VRMMDT_Name}}</td>

                    </tr>
                </tbody>
            </table>
            <dir-pagination-controls max-size="5"
                                     direction-links="true"
                                     boundary-links="true">
            </dir-pagination-controls>
        </div>
    </div>
</section>
