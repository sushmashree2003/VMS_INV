<section class="content" ng-init="loaddata()">
    <form class="form-horizontal ng-pristine ng-valid" role="form" name="myForm" novalidate>
        <div class="box box-primary">
            <div class="box-header with-border">
                <h3 class="box-title">vehicle Key </h3>
                <div class="box-tools pull-right">
                    <button type="button" class="btn btn-box-tool" data-widget="collapse"><i class="fa fa-minus"></i></button>
                </div>
            </div>
            <div class="box-body">
                <div class="row">

                    <div class="col-sm-12">
                        <div class="col-sm-6">
                            <div class="form-group">
                                <label class="control-label col-sm-4">Vehicle Name :<strong style="color:red;">*</strong></label>
                                <div class="col-sm-8">
                                    <select class="form-control" id="sel1ww" name="yrnamwwe" ng-model="TRMV_Id" ng-change="Onreport()" required>
                                        <option value="">--Select Vehicle--</option>
                                        <option ng-repeat="option in vehicalArray" value="{{option.trmV_Id}}"
                                                ng-selected="{{option.trmV_Id == TRMV_Id}}">
                                            {{option.trmV_VehicleName}} /{{option.trmV_VehicleNo}}
                                        </option>
                                    </select>
                                    <div class="error-messages" ng-if="interacted(myForm.yrnamwwe)" ng-messages="myForm.yrnamwwe.$error">
                                        <div ng-message="required">Select Vehical</div>
                                    </div>
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="control-label col-sm-4">Driver Name :<strong style="color:red;">*</strong></label>
                                <div class="col-sm-8">
                                    <select class="form-control" id="sel1ww" name="yrnamw" ng-model="HRME_Id" required>
                                        <option value="">--Select Driver--</option>
                                        <option ng-repeat="option in emplist" value="{{option.HRME_Id}}"
                                                ng-selected="{{option.HRME_Id == HRME_Id}}">
                                            {{option.EMPNAME}}
                                        </option>
                                    </select>
                                    <div class="error-messages" ng-if="interacted(myForm.yrnamw)" ng-messages="myForm.yrnamw.$error">
                                        <div ng-message="required">Select Driver</div>
                                    </div>
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="control-label col-sm-4">Remark:</label>
                                <div class="col-sm-8">
                                    <textarea maxlength="250" name="remarks" ng-model="VMSVKEYS_Remarks" class="form-control" resize: none; rows="3" placeholder="Remark" />

                                </div>
                            </div>
                        </div>
                        <div class="col-sm-6">

                            <div class="form-group">
                                <label class="control-label col-sm-4"> Issued:<strong style="color:red;">*</strong></label>
                                <div class="col-sm-8">
                                    <select class="form-control" id="sel1ww" name="yrnae" ng-model="VMSVKEYS_KeyReceivedHandedOverFlg"  required>
                                        <option value="">--Select --</option>
                                        <!--<option value="Hand Over">Hand Over </option>-->
                                        <option value="Issued">Issued </option>

                                    </select>
                                    <div class="error-messages" ng-if="interacted(myForm.yrnae)" ng-messages="myForm.yrnae.$error">
                                        <div ng-message="required">Select Issued</div>
                                    </div>
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="control-label col-sm-4">Issued Date<strong style="color:red;">*</strong></label>
                                <div class="col-sm-8">
                                    <md-datepicker name="payment_date" onkeypress="return false" data-ng-model="VMSVKEYS_RecivedDate" md-placeholder="Enter Date" ng-paste="$event.preventDefault()" required></md-datepicker>
                                    <div class="error-messages" ng-if="interacted(myForm.payment_date)" ng-messages="myForm.payment_date.$error">
                                        <div ng-message="required">Issued  Date</div>
                                    </div>
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="control-label col-sm-4">Issued  Time:<span style="color:red;">*</span></label>
                                <div class="col-sm-8" allow-pattern="\d">

                                    <div uib-timepicker name="sch_time1" ng-model="VMSVKEYS_RecivedTime" min="min" hour-step="hstep" minute-step="mstep" show-meridian="ismeridian" required></div>
                                    <div class="error-messages" ng-if="interacted(myForm.sch_time1)"
                                         ng-messages="myForm.sch_time1.$error">
                                        <div ng-message="required"> Time </div>
                                    </div>
                                </div>
                            </div>


                        </div>
                        <div class="col-sm-12 text-center">
                            <input type="hidden" ng-model="VMSVKEYS_Id" />
                            <md-button type="submit" class="md-raised md-primary" ng-disabled="form.$invalid" ng-click="savedata()" id="save-btn">
                                <i class="fa fa-floppy-o" aria-hidden="true"></i>
                                Save
                            </md-button>
                            <md-button type="button" class="md-raised md-warn" ng-click="Clearid()">
                                <i class="fa fa-times" aria-hidden="true"></i>
                                Cancel
                            </md-button>
                        </div>
                    </div>
                    <hr />

                </div>
            </div>
        </div>
    </form>
    <div class="box box-primary" ng-show="vehicalList.length>0">
        <div class="box-header with-border">
            <h3 class="box-title">vehicle KEY</h3>
            <div class="box-tools pull-right">
                <button type="button" class="btn btn-box-tool" data-widget="collapse" data-placement="bottom" data-toggle="tooltip" title="collapsible"><i class="fa fa-minus"></i></button>
            </div>
        </div>
        <div class="box-body">
            <div class="col-sm-4">
                <div class="form-group">
                    <label class="control-label">
                        <b> Total Grid Records :</b>
                        <label class="badge">
                            {{vehicalList.length}}
                        </label>
                    </label>
                </div>
            </div>
            <div class="col-sm-4">

            </div>
            <div class="col-sm-4 pull-right">
                <div class="form-group">
                    <div class="input-group">
                        <span class="input-group-addon">
                            <i class="fa fa-search"></i>
                        </span>
                        <input class="form-control" ng-model="search" type="text" placeholder="search here..." />
                    </div>
                </div>
            </div>
            <div class="col-sm-12" style="overflow:auto ">


                <table class="table table-hover table-responsive table-bordered">
                    <thead>
                        <tr>
                            <th>SL.No.</th>
                            <th>Vehicle Name</th>
                            <th>Driver Name</th>
                            <th>Issued Entered By</th>
                            <th> Key Issued </th>

                            <th>Issued Date</th>
                            <th>Issued Time</th>
                            <th>Key   Recived</th>
                            <th>Received Date</th>
                            <th>Received Time</th>
                            <th>Km Reading</th>
                            <th>Remark</th>
                            <th>Action</th>
                            <th>Received Action </th>

                        </tr>
                    </thead>
                    <tbody>
                        <tr dir-paginate="user in filterValue1=(vehicalList |filter:search) |orderBy:sortKey:sortReverse  |itemsPerPage:itemsPerPage"
                            current-page="currentPage" pagination-id="page1">
                            <td style="width:1%;">{{itemsPerPage *(currentPage-1)+$index+1}}</td>

                            <td style="text-align:left">
                                {{user.TRMV_VehicleName}} /{{user.TRMV_VehicleNo}}
                            </td>
                            <td>
                                {{user.EMPNAME}}
                            </td>
                            <td>
                                {{user.Applicationuser}}
                            </td>

                            <td>

                                <span ng-if="user.VMSVKEYS_KeyReceivedHandedOverFlg=='Issued'">
                                    <i class="fa fa-check  text-green"></i>
                                </span>
                                <span ng-if="user.VMSVKEYS_KeyReceivedHandedOverFlg !='Issued'">
                                    <i class="fa fa-times  text-red"></i>
                                </span>

                            </td>

                            <td>
                                {{user.VMSVKEYS_RecivedDate |date:'dd/MM/yyyy'}}
                            </td>
                            <td>
                                {{user.VMSVKEYS_RecivedTime | date  : 'shortTime'}}

                            </td>

                            <td>
                                <span ng-if="user.VMSVKEYS_KeyHandedOverFlg=='Received'">
                                    <i class="fa fa-check  text-green"></i>
                                </span>
                                <span ng-if="user.VMSVKEYS_KeyHandedOverFlg !='Received'">
                                    <i class="fa fa-times  text-red"></i>
                                </span>
                            </td>
                            <td>
                                <span ng-if="user.VMSVKEYS_KeyHandedOverFlg != null  &&  user.VMSVKEYS_KeyHandedOverFlg!=''">
                                    {{user.VMSVKEYS_DateTime  |date:'dd/MM/yyyy'}}
                                </span>

                            </td>
                            <td>
                                <span ng-if="user.VMSVKEYS_KeyHandedOverFlg != null  &&  user.VMSVKEYS_KeyHandedOverFlg!=''">
                                    {{user.VMSVKEYS_Time  | date  : 'shortTime'}}
                                </span>
                            </td>
                            <td>
                                {{user.VMSVKEYS_OdometerReading}}
                            </td>
                            <td>
                                {{user.VMSVKEYS_Remarks}}
                            </td>
                            <td>
                                <span ng-if="user.VMSVKEYS_KeyHandedOverFlg==null  ||  user.VMSVKEYS_KeyHandedOverFlg==''">
                                    <span ng-if="user.VMSVKEYS_ActiveFlag == true">
                                        <a class="text-aqua" href="" ng-click="edit(user)" data-placement="bottom" data-toggle="tooltip" title="Edit">
                                            <i class="fa fa-pencil-square-o" aria-hidden="true"></i>
                                        </a>
                                        <a href="" ng-click="Deletedata(user)"
                                           class="text-danger" data-placement="bottom" data-toggle="tooltip" title="Deactivate">
                                            <i> Deactivate</i>
                                        </a>
                                    </span>
                                    <span ng-if="user.VMSVKEYS_ActiveFlag == false">
                                        <a href="" ng-click="Deletedata(user)"
                                           class="text-green" data-placement="bottom" data-toggle="tooltip" title="Activate">
                                            <i> Activate </i>
                                        </a>
                                    </span>

                                </span>
                                <span ng-if="user.VMSVKEYS_KeyHandedOverFlg != null  &&  user.VMSVKEYS_KeyHandedOverFlg!=''">
                                    ----
                                </span>

                            </td>
                            <td>
                                <span ng-if="user.VMSVKEYS_KeyHandedOverFlg==null  ||  user.VMSVKEYS_KeyHandedOverFlg==''">
                                    <a class="text-aqua" href="" ng-click="View(user)">
                                        <i class="fa fa-eye" style="color: black;" aria-hidden="true"></i>
                                    </a>
                                </span>

                                <span ng-if="user.VMSVKEYS_KeyHandedOverFlg != null  &&  user.VMSVKEYS_KeyHandedOverFlg!=''">
                                    ----
                                </span>
                            </td>

                        </tr>
                    </tbody>
                </table>
                <dir-pagination-controls max-size="10" pagination-id="page1"
                                         direction-links="true"
                                         boundary-links="true">
                </dir-pagination-controls>
            </div>
        </div>
    </div>
</section>
<div id="popup123" class="modal fade modal-medium" role="dialog" data-backdrop="static">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">

                    RTO HAND OVER
                </h4>

            </div>

                                    <h4 class="text-center"> RTO VEHICALE KEY DETAILS</h4>
                                </div>

                                <div class="col-sm-12 form-horizontal">
                                    <hr />
                                    <div class="col-sm-6">
                                        <div class="form-group">
                                            <label class="control-label col-sm-4">Vehicle Name :</label>
                                            <div class="col-sm-8">
                                                <select class="form-control" id="sel1ww" name="yrnamwwe" ng-model="TRMVV_Id" ng-disabled="true">
                                                    <option value="">--Select Vehicle--</option>

                                            </div>
                                        </div>


                                        <div class="form-group">
                                            <label class="control-label col-sm-4"> Issued:</label>
                                            <div class="col-sm-8">
                                                <select class="form-control" id="sel1ww" name="yrnae" ng-model="VMSVKEYSV_KeyReceivedHandedOverFlg" ng-disabled="true">
                                                    <option value="">--Select --</option>

                                                    <option value="Issued">Issued </option>

                                                </select>

                                            </div>
                                        </div>

                                        <div class="form-group">
                                            <label class="control-label col-sm-4">Issued  Time:</label>
                                            <div class="col-sm-8" allow-pattern="\d">

                                                <div uib-timepicker name="sch_time1" ng-model="VMSVKEYSV_RecivedTime" min="min" hour-step="hstep" minute-step="mstep" show-meridian="ismeridian" ng-disabled="true"></div>

                                            </div>
                                        </div>
                                        <div class="form-group">
                                            <label class="control-label col-sm-4">Issued Date</label>

                                                    <div ng-message="required">Received  Date</div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-sm-6">
                                        <div class="form-group">
                                            <label class="control-label col-sm-4">Driver Name :</label>
                                            <div class="col-sm-8">
                                                <select class="form-control" id="sel1ww" name="yrnamw" ng-model="HRMEV_Id" ng-disabled="true">
                                                    <option value="">--Select Driver--</option>
                                                    <option ng-repeat="option in emplist" value="{{option.HRME_Id}}"

                                                        {{option.EMPNAME}}
                                                    </option>
                                                </select>
                                                <div class="error-messages" ng-if="interacted(myForm.yrnamw)" ng-messages="myForm.yrnamw.$error">
                                                    <div ng-message="required">Select Driver</div>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="form-group">
                                            <label class="control-label col-sm-4"> Received: <strong style="color:red;">*</strong></label>
                                            <div class="col-sm-8">
                                                <select class="form-control" id="sel1ww" name="yrnaepp" ng-model="VMSVKEYSVTWO_KeyReceivedHandedOverFlg" ng-disabled="true">
                                                    <option value="">--Select --</option>

                                                    <option value="Received">Received</option>

                                                </select>
                                                <div class="error-messages" ng-if="interacted(dataform1.yrnaepp)" ng-messages="dataform1.yrnaepp.$error">
                                                    <div ng-message="required">Select Received</div>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="form-group">
                                            <label class="control-label col-sm-4">Received  Date <strong style="color:red;">*</strong></label>
                                            <div class="col-sm-8">
                                                <md-datepicker name="payment_datehh" md-min-date="VMSVKEYSV_RecivedDate" onkeypress="return false" data-ng-model="VMSVKEYS_DateTime" md-placeholder="Enter Date" ng-paste="$event.preventDefault()"></md-datepicker>
                                                <div class="error-messages" ng-if="interacted(myForm.payment_datehh)" ng-messages="myForm.payment_datehh.$error">
                                                    <div ng-message="required">Received  Date</div>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="form-group">
                                            <label class="control-label col-sm-4">Received  Time: <strong style="color:red;">*</strong></label>
                                            <div class="col-sm-8" allow-pattern="\d">

                                                <div uib-timepicker name="sch_time1" ng-model="VMSVKEYS_Time" min="min" hour-step="hstep" minute-step="mstep" show-meridian="ismeridian"></div>
                                                <div class="error-messages" ng-if="interacted(myForm.sch_time1)"
                                                     ng-messages="myForm.sch_time1.$error">
                                                    <div ng-message="required"> Received Time </div>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="form-group">
                                            <label class="control-label col-sm-4">KM Reading:<span style="color:red">*</span></label>
                                            <div class="col-sm-8">
                                                <input type="text" class="form-control active" name="ddamtt" placeholder="KM Reading" ng-model="VMSVKEYS_OdometerReading" allow-pattern="[0-9]" autocomplete="off" ng-paste="$event.preventDefault()"   />
                                                <div class="error-messages" ng-if="interacted(myForm.ddamtt)" ng-messages="myForm.ddamtt.$error">
                                                    <div ng-message="required">Enter Amount</div>
                                                </div>
                                            </div>
                                        </div>

                                        <!--//VMSVKEYS_OdometerReading-->
                                        <div class="form-group">
                                            <label class="control-label col-sm-4">Remark:</label>
                                            <div class="col-sm-8">
                                                <textarea maxlength="250" name="remarks" ng-model="VMSVKEYS_RemarksTwo" class="form-control" resize: none; rows="3" placeholder="Remark" />

                                            </div>
                                        </div>

                                    </div>
                                </div>
                                <div class="col-sm-12">
                                    <hr />
                                    <div class="text-center">
                                        <input type="text" ng-hide="true" ng-model="VMSVKEYS_Idtwo" />
                                        <md-button class="md-raised md-primary" ng-click="UPDATE()" id="save-btn">
                                            <i class="fa fa-floppy-o" aria-hidden="true"></i>
                                            UPDATE
                                        </md-button>
                                    </div>
                                </div>

                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-default" data-dismiss="modal" ng-click="close()">Close</button>
                </div>
            </div>
        </div>
    </div>
</div>
