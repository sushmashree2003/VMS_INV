<section class="content" ng-init="loaddata()">
    <form class="form-horizontal ng-pristine ng-valid" role="form" name="myForm" novalidate>
        <div class="box box-primary">
            <div class="box-header with-border">
                <h3 class="box-title">FO Vehicle Observation </h3>
                <div class="box-tools pull-right">
                    <button type="button" class="btn btn-box-tool" data-widget="collapse"><i class="fa fa-minus"></i></button>
                </div>
            </div>
            <div class="box-body">
                <div class="row">

                    <div class="col-sm-12">
                        <div class="col-sm-6">
                            <div class="form-group">
                                <label class="control-label col-sm-4">Vehicle Name :<strong style="color:red;">*</strong></label>
                                <div class="col-sm-8">
                                    <select class="form-control" id="sel1ww" name="yrnamwwe" ng-model="TRMV_Id" required>
                                        <option value="">--Select Vehicle--</option>
                                        <option ng-repeat="option in vehicalArray" value="{{option.trmV_Id}}"
                                                ng-selected="{{option.trmV_Id == TRMV_Id}}">
                                            {{option.trmV_VehicleName}} /{{option.trmV_VehicleNo}}
                                        </option>
                                    </select>
                                    <div class="error-messages" ng-if="interacted(myForm.yrnamwwe)" ng-messages="myForm.yrnamwwe.$error">
                                        <div ng-message="required">Select Vehicle</div>
                                    </div>
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="control-label col-sm-4">Driver Name :<strong style="color:red;">*</strong></label>
                                <div class="col-sm-8">
                                    <select class="form-control" id="sel1ww" name="yrnamw" ng-model="HRME_Id" required>
                                        <option value="">--Select Driver--</option>
                                        <option ng-repeat="option in emplist" value="{{option.HRME_Id}}"
                                                ng-selected="{{option.HRME_Id == HRME_Id}}">
                                            {{option.EMPNAME}}
                                        </option>
                                    </select>
                                    <div class="error-messages" ng-if="interacted(myForm.yrnamw)" ng-messages="myForm.yrnamw.$error">
                                        <div ng-message="required">Select Driver</div>
                                    </div>
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="col-sm-4"></label>
                                <div class="col-sm-8">
                                    <input type="checkbox" ng-model="VMSFOVOB_AnyDamageFlg" />

                                    <span class="lbl padding-8">Any Damage?</span>
                                </div>

                            </div>
                        </div>
                        <div class="col-sm-6">
                            <div class="form-group">
                                <label class="control-label col-sm-4"> Date<strong style="color:red;">*</strong></label>
                                <div class="col-sm-8">
                                    <md-datepicker name="payment_date" onkeypress="return false" data-ng-model="VMSFOVOB_DateTime" md-placeholder="Enter Date" ng-paste="$event.preventDefault()" required></md-datepicker>
                                    <div class="error-messages" ng-if="interacted(myForm.payment_date)" ng-messages="myForm.payment_date.$error">
                                        <div ng-message="required">Select  Date</div>
                                    </div>
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="control-label col-sm-4">Description: <strong style="color:red;" ng-if="VMSFOVOB_AnyDamageFlg==true">*</strong></label>
                                <div class="col-sm-8">
                                    <textarea class="form-control textareaclass"
                                              ng-model="VMSFOVOB_DamageDescription" name="ppp" rows="3" placeholder="Description" ng-required="VMSFOVOB_AnyDamageFlg==true"></textarea>
                                    <div class="error-messages" ng-if="interacted(myForm.ppp)" ng-messages="myForm.ppp.$error">
                                        <div ng-message="required">Select  Description</div>
                                    </div>
                                </div>
                            </div>
                        </div>

                    </div>
                    <div class="col-sm-12">
                        <div class="box box-primary">
                            <div class="box-header with-border">
                                <h3 class="box-title"> Documents Upload </h3>
                                <div class="box-tools pull-right">
                                    <button type="button" class="btn btn-box-tool" data-widget="collapse"><i class="fa fa-minus"></i></button>
                                </div>
                            </div>
                            <div class="box-body margin-top-10">
                                <p style="color:red;font-size:14px !important">
                                    *  File   Must Be Upload jpeg,Png,pdf, Document
                                    <br />
                                    * File size should be less than 2 MB
                                </p>
                                <table class="table table-responsive table-bordered clearfix" style="width:100%;">
                                    <thead>
                                        <tr>
                                            <th>Sl.No.</th>
                                            <th>Upload</th>
                                            <th>View</th>
                                            <th>Description</th>
                                            <th>Action</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr ng-repeat="materal in materaldocuupload">
                                            <td class="text-center">
                                                {{$index+1}}
                                            </td>
                                            <td>
                                                <label class="custom-file-input file-blue1" style="width:100%;margin:auto;">
                                                    <input type="file" name="impfile" id="document" class="btn btn-success" value="Import" ng-model="vbabrsF_FilePath" onchange="angular.element(this).scope().selectFileforUploadzd(this, angular.element(this).scope().materal)" style="padding-top: 1px;padding-bottom: 2px;" />

                                                </label>

                                            </td>
                                            <td>
                                                <span ng-show="materal.vbabrsF_FilePath!=null && materal.vbabrsF_FilePath!=''">
                                                    <a id="viewid{{$index}}" name="viewname{{$index}}" ng-if="materal.vbabrsF_FilePath  !=null && materal.vbabrsF_FilePath !=''" style="color:red;display:inline; font-weight: bolder;" data-ng-click="previewimg_new(materal.vbabrsF_FilePath)">
                                                        view
                                                    </a>
                                                </span>
                                            </td>
                                            <td>
                                                <textarea maxlength="250" name="remark" ng-model="materal.vbabrsF_Filedesc" class="form-control" resize: none; rows="2" placeholder="Description" />
                                            </td>
                                            <td>
                                                <span>
                                                    <a href="" ng-show="$last" ng-click="addgrnrows()">
                                                        <i class="fa fa-plus"></i>
                                                    </a>
                                                </span>
                                                <span class="" id="remove" ng-hide="materaldocuupload.length ==1">
                                                    <a href="" ng-click="removegrnrows($index,objg)">
                                                        <i class="fa fa-minus" aria-hidden="true"></i>
                                                    </a>
                                                </span>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>

                    </div>
                    <div class="col-sm-12 text-center">
                        <input type="hidden" ng-model="VMSFOVOB_Id" />
                        <md-button type="submit" class="md-raised md-primary" ng-disabled="form.$invalid" ng-click="savedata()" id="save-btn">
                            <i class="fa fa-floppy-o" aria-hidden="true"></i>
                            Save
                        </md-button>
                        <md-button type="button" class="md-raised md-warn" ng-click="Clearid
                                  ()">
                            <i class="fa fa-times" aria-hidden="true"></i>
                            Cancel
                        </md-button>
                    </div>
                    <hr />

                </div>
            </div>
        </div>
    </form>
    <div class="box box-primary" ng-show="obserVationList.length>0">
        <div class="box-header with-border">
            <h3 class="box-title">FO Vehicle Observation</h3>
            <div class="box-tools pull-right">
                <button type="button" class="btn btn-box-tool" data-widget="collapse" data-placement="bottom" data-toggle="tooltip" title="collapsible"><i class="fa fa-minus"></i></button>
            </div>
        </div>
        <div class="box-body">
            <div class="col-sm-4">
                <div class="form-group">
                    <label class="control-label">
                        <b> Total Grid Records :</b>
                        <label class="badge">
                            {{obserVationList.length}}
                        </label>
                    </label>
                </div>
            </div>
            <div class="col-sm-4">

            </div>
            <div class="col-sm-4 pull-right">
                <div class="form-group">
                    <div class="input-group">
                        <span class="input-group-addon">
                            <i class="fa fa-search"></i>
                        </span>
                        <input class="form-control" ng-model="search" type="text" placeholder="search here..." />
                    </div>
                </div>
            </div>
            <table class="table table-hover table-responsive table-bordered">
                <thead>
                    <tr>
                        <th>SL.No.</th>
                        <th>Vehicle Name</th>
                        <th>Driver Name</th>
                        <th>Entered By</th>
                        <th>Date</th>
                        <th>Any Damage</th>
                        <th>Description</th>
                        <th>Action</th>
                        <th>View</th>
                    </tr>
                </thead>
                <tbody>
                    <tr dir-paginate="user in filterValue1=(obserVationList |filter:search) |orderBy:sortKey:sortReverse  |itemsPerPage:itemsPerPage"
                        current-page="currentPage" pagination-id="page1">
                        <td style="width:1%;">{{itemsPerPage *(currentPage-1)+$index+1}}</td>

                        <td style="text-align:left">
                            {{user.TRMV_VehicleName}} /{{user.TRMV_VehicleNo}}
                        </td>
                        <td>
                            {{user.EMPNAME}}
                        </td>
                        <td>
                            {{user.Applicationuser}}
                        </td>
                        <td>
                            {{user.VMSFOVOB_DateTime |date:'dd/MM/yyyy'}}
                        </td>
                        <td>
                            <span ng-if="user.VMSFOVOB_AnyDamageFlg==true">
                                <i class="fa fa-check  text-green"></i>
                            </span>
                            <span ng-if="user.VMSFOVOB_AnyDamageFlg==false">
                                <i class="fa fa-times  text-red"></i>
                            </span>
                        </td>
                        <td>
                            {{user.VMSFOVOB_DamageDescription}}
                        </td>
                        <td>
                            <span ng-if="user.VMSFOVOB_ActiveFlag == true">
                                <a class="text-aqua" href="" ng-click="edit(user)" data-placement="bottom" data-toggle="tooltip" title="Edit">
                                    <i class="fa fa-pencil-square-o" aria-hidden="true"></i>
                                </a>
                                <a href="" ng-click="Deletedata(user)"
                                   class="text-danger" data-placement="bottom" data-toggle="tooltip" title="Deactivate">
                                    <i> Deactivate</i>
                                </a>
                            </span>
                            <span ng-if="user.VMSFOVOB_ActiveFlag == false">
                                <a href="" ng-click="Deletedata(user)"
                                   class="text-green" data-placement="bottom" data-toggle="tooltip" title="Activate">
                                    <i> Activate </i>
                                </a>
                            </span>
                        </td>
                        <td>
                            <a ng-if="user.filecount>0" class="text-aqua" href="" ng-click="View(user)">
                                <i class="fa fa-eye" style="color: black;" aria-hidden="true"></i>
                            </a>
                            <a ng-if="user.filecount==0" class="text-aqua" href="">
                                ---
                            </a>
                        </td>

                    </tr>
                </tbody>
            </table>
            <dir-pagination-controls max-size="10" pagination-id="page1"
                                     direction-links="true"
                                     boundary-links="true">
            </dir-pagination-controls>
        </div>
    </div>
</section>

<div id="ViewDetails" class="modal fade modal-medium" role="dialog" data-backdrop="static">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">


                <button type="button" class="close" data-dismiss="modal" ng-click="closed()"><i class="fa fa-times text-white" aria-hidden="true"></i></button>
            </div>
            <div class="modal-body">
                <div class="box box-primary">

                    <div class="box-body" id="tablegrp">
                        <div class="col-sm-12">
                            <h4 class="text-center">FO_Vehicle_Observation</h4>
                        </div>
                        <div class="col-sm-12 box-content clearfix" ng-if="GetFile.length >  0">
                            <table class="table table-bordered table-condensed">
                                <thead>
                                    <tr>
                                        <th>Sl No</th>
                                        <th>File Name</th>
                                        <th>Remark</th>
                                        <th>Files</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr ng-repeat="file in GetFile">
                                        <td class="text-center">
                                            {{$index + 1}}
                                        </td>
                                        <td class="text-center">
                                            {{file.vmsfovobfL_FileName}}
                                        </td>
                                        <td class="text-center">
                                            {{file.vmsfovobfL_Filedesc}}
                                        </td>
                                        <td class="text-center">
                                            <span ng-show="file.vmsfovobfL_FilePath!=null && vmsfovobfL_FilePath!=''">
                                                <a id="viewid{{$index}}" name="viewname{{$index}}" ng-if="file.vmsfovobfL_FilePath  !=null && file.vmsfovobfL_FilePath !=''" style="color:red;display:inline; font-weight: bolder;" data-ng-click="previewimg_new(file.vmsfovobfL_FilePath)">
                                                    view
                                                </a>
                                            </span>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>



                    </div>
                </div>
            </div>


           

            <div class="modal-footer">
                <button type="button" class="btn btn-default" data-dismiss="modal" ng-click="closed()">Close</button>
            </div>
        </div>
    </div>
</div>
