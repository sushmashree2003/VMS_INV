<style>
    .file-blue:before {
        content: 'Upload MoM';
        background: #2757a6;
        border-color: #2757a6;
        color: #FFF;
        text-shadow: 1px 1px rgba(000,000,000,0.5);
    }

    .box-content {
        list-style-type: none;
        position: relative;
        border: 1px solid #3e85a0;
        padding: 12px;
        border-radius: 5px;
    }

    .oldd {
        background-color: coral;
    }

    .neww {
        background-color: white;
    }
</style>
<section class="content" ng-init="loadgrid1()">
    <form class="form-horizontal ng-pristine ng-valid" role="form" name="myForm" novalidate>
      
        <div class="box box-primary">
            <div class="box-header with-border">
                <h3 class="box-title">Legal History STATUS</h3>
                <div class="box-tools pull-right">
                    <button type="button" class="btn btn-box-tool" data-widget="collapse"><i class="fa fa-minus"></i></button>
                </div>
            </div>
            <div class="box-body">
                <div class="col-sm-12 box-content clearfix">                    
                    <div>
                        <div class="col-sm-6">
                            <h5>Notice Start Time : <b>{{MOM_StartTime |date :"h:mma"}}</b>  </h5>
                        </div>
                        <div class="col-sm-6">
                            <h5>Notice End Time : <b>{{MOM_EndTime |date :"h:mma"}} </b> </h5>
                        </div>
                    </div>
                    <!--<div class="row">
                        <div class="col-sm-12 text-center" ng-if="excel1==false">
                            <a href="javascript:void(0)" data-toggle="modal" data-target="#participantsdetails" ng-model="participants" data-backdrop="static">
                                <h4 ng-click="excelhide()" title="click to view">PARTICIPANTS DETAILS <i class="fa fa-eye text-blue"></i></h4>
                            </a>
                        </div>
                    </div>-->
                    <div class="box box-primary" ng-if="excel==false">
                        <div class="box-header with-border">
                            <h3 class="box-title">Imported Data From Excel</h3>
                            <div class="box-tools pull-right">
                                <button type="button" class="btn btn-box-tool" data-widget="collapse" data-placement="bottom" data-toggle="tooltip" title="collapsible"><i class="fa fa-minus"></i></button>
                            </div>
                            <div class="col-sm-6 text-center">
                                <md-button type="button" ng-click="exptoex();" target="_blank" class="md-raised md-primary">
                                    <i class="fa fa-file-excel-o" aria-hidden="true"></i>
                                    Sample Excel Formate
                                </md-button>
                            </div>
                        </div>
                        <!-- /.box-header -->
                        <div class="box-body" style="overflow:scroll;">
                            <div class="">
                                <div class="col-sm-2 pull-left padding-left-none">
                                    <label class="custom-file-input file-blue1" style="width:100%;margin:auto;" ng-click="excelhide1()">
                                        <input type="file" name="impfile" class="btn btn-success" value="Import" ng-model="imp.file" accept=".xlsx" onchange="angular.element(this).scope().selectFileforUploadzd(this, angular.element(this).scope().vm.gridOptions)" style="padding-top: 1px;padding-bottom: 2px;" fileread="" opts="vm.gridOptions" />
                                    </label>
                                </div>
                                <div class="col-sm-4 pull-right">
                                    <div class="form-group">
                                        <div class="input-group">
                                            <input class="form-control" ng-model="search" type="text" placeholder="search here...">
                                            <span class="input-group-addon">
                                                <i class="fa fa-search"></i>
                                            </span>
                                        </div>
                                    </div>
                                </div>

                                <table class="table table-hover table-responsive table-bordered text-center">
                                    <thead>
                                        <tr ng-repeat="item in vm.gridOptions.data  | limitTo:1">
                                            <th>
                                                <a href="" ng-click="order('sno')">SLNO</a>
                                            </th>

                                            <th ng-repeat="key in item | keys">
                                                <a href="" ng-click="order(key)">{{key}}</a>

                                            </th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr ng-repeat="item in vm.gridOptions.data |orderBy:sortKey:reverse| filter:search ">
                                            <td>{{ $index + 1}}</td>
                                            <td ng-repeat="key in item | keys " ng-init="value = item[key]">{{value}}</td>
                                        </tr>
                                    </tbody>
                                </table>

                                <pagination total-items="totalItems" ng-model="currentPage"
                                            max-size="5" boundary-links="true"
                                            items-per-page="numPerPage" class="pagination-sm">
                                </pagination>
                            </div>
                            <hr />

                        </div>

                        <div class="text-center">
                            <input type="hidden" ng-model="LH_Id" value="{{LH_Id}}" />                          
                            <md-button type="submit" class="md-raised md-primary" ng-disabled="form.$invalid" ng-click="saveDataHistory(vm.gridOptions.data)" id="save-btn">
                                <i class="fa fa-floppy-o" aria-hidden="true"></i>
                                Save
                            </md-button>
                            <md-button type="button" class="md-raised md-warn" ng-click="cancel()">
                                <i class="fa fa-times" aria-hidden="true"></i>
                                Cancel
                            </md-button>
                        </div>

                    </div>
                </div>

            </div>
        </div>
    </form>
</section>
