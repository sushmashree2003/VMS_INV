<div data-ng-init="Onloadcourtdata()">
    <section class="content">
        <form class="form-horizontal ng-pristine ng-valid" name="myForm" role="form" data-ng-submit="savelegalmastercourt()" novalidate>
            <div class="box box-primary">
                <div class="box-header with-border">
                    <h3 class="box-title">Legal Master Court</h3>
                    <div class="box-tools pull-right">
                        <button type="button" class="btn btn-box-tool" data-widget="collapse"><i class="fa fa-minus"></i></button>
                    </div>
                </div>
                <div class="box-body">
                    <div class="row">
                        <div class="col-sm-6 col-sm-offset-3">
                            <div class="well text-center">
                                <label class="checkbox-inline" ng-repeat="cat in CourtType">
                                    <input type="radio" value="{{cat.mcT_Id}}" ng-model="obj.MCT_Id" name="employee" ng-click="showw()">
                                    <label class="lbl padding-8">{{cat.mcT_Type}}</label>
                                </label>
                            </div>
                        </div>
                    </div>
                    <div class="col-sm-6">
                    </div>
                </div>

                <!--ng-if="obj.catg1=='1'"-->
                <div class="box-body">
                    <div class="row">
                        <div class="col-sm-6 col-sm-offset-3">
                            <div class="form-group" ng-if="obj.MCT_Id=='1'">
                                <label class="control-label col-sm-4">Court Complex:<span style="color:red;">*</span></label>
                                <div class="col-sm-8">
                                    <input class="form-control" placeholder="Enter" name="employee" id="usr" type="text" ng-paste="$event.preventDefault()" data-ng-model="obj1.mC_Name" required>
                                    <div class="error-messages" ng-if="interacted(myForm.employee)" value="{{option.hrmE_Id}}" ng-messages="myForm.employee.$error">
                                        <div ng-message="required">Enter</div>
                                    </div>
                                </div>
                            </div>

                            <!--ng-if="obj.catg1 == '2'"-->
                            <div class="form-group" ng-if="obj.MCT_Id=='2'">
                                <label class="control-label col-sm-4">Court Establishment:<span style="color:red;">*</span></label>
                                <div class="col-sm-8">
                                    <input class="form-control" placeholder="Enter" name="employee1" id="usr1" type="text" ng-paste="$event.preventDefault()" data-ng-model="obj1.mC_Name" required>
                                    <div class="error-messages" ng-if="interacted(myForm.employee1)" value="{{option.hrmE_Id}}" ng-messages="myForm.employee1.$error">
                                        <div ng-message="required">Enter</div>
                                    </div>
                                </div>
                            </div>

                            <div class="form-group">
                                <div class="col-sm-8">
                                    <div class="row">
                                        <div class="col-sm-6">
                                            <input type="checkbox" data-ng-model="mC_ActiveFlag"/>
                                            <span class="lbl padding-3">Active Status : </span>
                                        </div>
                                    </div>
                                </div>
                            </div>



                        </div>
                    </div>
                    <hr />
                </div>

                


                <div class="text-center">
                    <input type="hidden" ng-model="obj1.MC_Id" value="{{obj1.mC_Id}}" />
                    <md-button type="submit" class="md-raised md-primary" ng-disabled="form.$invalid" ng-click="legalcourtsave(obj1)" id="save-btn">
                        <i class="fa fa-floppy-o" aria-hidden="true"></i>
                        Add
                    </md-button>
                    <md-button type="button" class="md-raised md-warn" data-ng-click="Clearid()">
                        <i class="fa fa-times" aria-hidden="true"></i>
                        Cancel
                    </md-button>
                </div>

            </div>

        </form>

        <!--ng-show="griddata.length>0"-->
        <div class="box box-primary">
            <div class="box-header with-border">
                <h3 class="box-title">LEGAL MASTER COURT DETAILS</h3>
                <div class="box-tools pull-right">
                    <button type="button" class="btn btn-box-tool" data-widget="collapse" data-placement="bottom" data-toggle="tooltip" title="collapsible"><i class="fa fa-minus"></i></button>
                </div>
            </div>

            <div class="box-body" style="overflow:scroll">
                <div class="col-sm-6">
                    <div class="form-group">
                        <label class="control-label">
                            <b> Total Grid Records :</b>
                            <label class="badge">
                                {{gridcourt.length}}
                            </label>
                        </label>
                    </div>
                </div>
                <div class="col-sm-4 pull-right">
                    <div class="form-group">
                        <div class="input-group">
                            <span class="input-group-addon">
                                <i class="fa fa-search"></i>
                            </span>
                            <input class="form-control" type="text" ng-model="search" placeholder="search here...">
                        </div>
                    </div>
                </div>
                <table class="table table-hover table-responsive table-bordered text-center">
                    <thead>
                        <tr>
                            <th>
                                SL.No.
                            </th>
                            <th>
                                <a href="" ng-click="sort('mC_Name')">Court Complex/Court Establishment</a>

                            </th>
                            <th>
                                <a href="" ng-click="sort('mC_ActiveFlag')">Status</a>

                            </th>
                            <th>
                                <a href="" ng-click="sort('lnR_Status')">Action</a>

                            </th>
                        </tr>
                    </thead>
                    <tbody>
                        
                        <!--<tr ng-repeat="obj1 in  gridcourt">-->
                        <tr dir-paginate="obj1 in filterValue=(gridcourt | filter : search) | orderBy:sortKey:reverse |itemsPerPage:itemsPerPage" current-page="currentPage">
                            <td class="text-center">{{itemsPerPage *(currentPage-1)+$index+1}}</td>
                            <td>{{obj1.mC_Name }}</td>
                            <!--<td>{{obj1.mcT_ActiveFlag }}</td>-->
                            <td>
                                <span ng-if="obj1.mC_ActiveFlag=='1'">Activate</span>                             
                                <span ng-if="obj1.mC_ActiveFlag=='0'">Deactivate</span>
                            </td>
                            <td class="text-center">
                                <a href="javascript:void(0)" ng-click="editdata(obj1)" class="text-primary" data-placement="bottom" data-toggle="tooltip" title="Edit">
                                    <i class="fa fa-pencil-square-o" aria-hidden="true"></i>
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
                <dir-pagination-controls max-size="5"
                                         direction-links="true"
                                         boundary-links="true">
                </dir-pagination-controls>
            </div>
        </div>

    </section>
</div>
