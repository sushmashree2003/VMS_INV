
<section class="content">
    <form class="form-horizontal ng-pristine ng-valid" role="form" name="myForm" method="post"  novalidate>
        <div class="box box-primary">
            <div class="box-header with-border">
                <h3 class="box-title">General Email</h3>
                <div class="box-tools pull-right">
                    <button type="button" class="btn btn-box-tool" data-widget="collapse"><i class="fa fa-minus"></i></button>
                </div>
            </div>
            <div class="box-body">


                <div class="col-sm-6">

                    <div class="row" >
                        <div class="col-sm-12">
                            <div class="box-header with-border">
                                <h3 class="box-title">Email Details</h3>

                            </div>
                            <div class="form-group" style="margin-top:3px">
                                <label class="control-label col-sm-3">Email Subject:<span style="color:red;">*</span></label>
                                <div class="col-sm-9">
                                    <input class="form-control" ng-model="esubject" ng-required="bookornonbook=='NONTPL'&& snd_email==true" name="www" />

                                    <div class="error-messages" ng-if="interacted(myForm1.www)" ng-messages="myForm1.www.$error">
                                        <div ng-message="required"> Enter Email Subject</div>
                                    </div>
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="control-label col-sm-3">Message:<span style="color:red;">*</span></label>
                                <div class="col-sm-9">
                                    <textarea class="form-control" ng-model="MSG" rows="6" name="gggg" ng-required="bookornonbook=='NONTPL'&& snd_email==true"></textarea>
                                    <div class="error-messages" ng-if="interacted(myForm1.gggg)" ng-messages="myForm1.gggg.$error">
                                        <div ng-message="required"> Enter Message</div>
                                    </div>

                                </div>
                            </div>
                            <div class="form-group">
                                <label class="control-label col-sm-3">Footer:</label>
                                <div class="col-sm-9">
                                    <select class="form-control" name="grp" ng-model="FHEAD">
                                        <option value="">--Select--</option>
                                        <option value="THANKS">THANKS</option>
                                        <option value="THANK YOU">THANK YOU</option>
                                        <option value="THANKS AND REGARDS">THANKS AND REGARDS</option>
                                        <option value="REGARDS">REGARDS</option>

                                    </select>

                                </div>
                            </div>
                            <div class="form-group">
                                <label class="control-label col-sm-3">Footer Details:</label>
                                <div class="col-sm-9">
                                    <textarea class="form-control" ng-model="Footer" rows="2" name="gggg2"></textarea>
                                    <div class="error-messages" ng-if="interacted(myForm1.gggg2)" ng-messages="myForm1.gggg2.$error">
                                        <div ng-message="required"> Enter Message</div>
                                    </div>

                                </div>
                            </div>

                            <div class="form-group">
                                <label class="control-label col-sm-3">Attach File</label>
                                <div class="col-sm-3">
                                    <label class="custom-file-input file-blue1" style="width:100%;margin:auto;">
                                        <input type="file" name="impfile" class="btn btn-success" value="Attach Excel" ng-model="imp.file" accept=".xlsx" onchange="angular.element(this).scope().selectFileforUploadzd(this, angular.element(this).scope().vm.gridOptions)" style="padding-top: 1px;padding-bottom: 2px;" fileread="" opts="vm.gridOptions" />
                                    </label>
                                </div>
                                <div class="col-sm-6">
                                    <a href="https://dcampusstrg.blob.core.windows.net/files/17/advancedPlanner.xls" target="_blank"><b style="color:red">DOWNLOAD SAMPLE EXCEL FORMAT</b></a>
                                </div>

                            </div>

                            <!--<div class="form-group">
                                <label class="control-label col-sm-3">Email Ids:</label>
                                <div class="col-sm-9">
                                    <textarea class="form-control" ng-model="obj.emails" rows="2" name="gggg3">

</textarea>
                                    <div class="error-messages" ng-if="interacted(myForm1.gggg3)" ng-messages="myForm1.gggg3.$error">
                                        <div ng-message="required"> Enter Message</div>
                                    </div>

                                </div>
                            </div>-->
                            <div class="text-center">
                                <div class="checkbox text-center well">
                                    <label>
                                        <input type="checkbox" data-ng-model="athflag" checked="checked">
                                        <span class="lbl padding-8">ADD ATTACHMENT</span>
                                    </label>

                                </div>


                            </div>
                            <div class="col-sm-12" ng-show="athflag==true">
                                <div class="box box-primary">
                                    <div class="box-header with-border">
                                        <h3 class="box-title"> ADD ATTACHMENT </h3>
                                        <div class="box-tools pull-right">
                                            <button type="button" class="btn btn-box-tool" data-widget="collapse"><i class="fa fa-minus"></i></button>
                                        </div>
                                    </div>
                                    <div class="box-body margin-top-10">
                                        <table class="table table-responsive table-bordered clearfix" style="width:100%;">
                                            <thead>
                                                <tr>
                                                    <th>SL.NO.</th>
                                                    <th style="width:21%">FILE</th>
                                                    <th>VIEW</th>
                                                    <th>ACTION</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                <tr ng-repeat="materal in materaldocuupload" ng-class-odd="'odd'">
                                                    <td class="text-center">{{ $index + 1 }}</td>
                                                    <td class="text-center lessonplanner">
                                                        <input class="custom-file-input file-blue text-center" id="{{materal.cfilepath}}"
                                                               data-ng-model="materal.cfilepath" type="file"
                                                               accept="image/*, application/pdf,application/msword,video/mp4,application/vnd.ms-powerpoint,
                                                               application/vnd.openxmlformats-officedocument.presentationml.presentation
                                                               application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,
                                                               application/vnd.openxmlformats-officedocument.wordprocessingml.document,
                                                               application/vnd.ms-excel"
                                                               name="filetypematerial{{$index}}"
                                                               onchange="angular.element(this).scope().uploadmateraldocuments(this, angular.element(this).scope().materal)">
                                                        <div class="error-messages" ng-if="interacted(myForm['filetypematerial'+$index])"
                                                             ng-messages="myForm['filetypematerial'+$index].$error">
                                                            <div ng-message="required">Upload File</div>
                                                        </div>
                                                    </td>
                                                    <!--<td>
                            <textarea class="form-control" data-ng-model="materal.cfiledesc">

                            </textarea>
                                                                        </td>-->
                                                    <td>
                                                        <span ng-if="materal.cfilepath !=null && materal.cfilepath !=''">
                                                            <a ng-if="materal.filetype=='jpg' || materal.filetype=='png' ||
                                                               materal.filetype=='svg'|| materal.filetype=='jpeg'
                                                               || materal.filetype=='gif'"
                                                               style="color:red;display:inline; font-weight: bolder;"
                                                               data-ng-click="showmothersign(materal.cfilepath,materal.cfilename)">
                                                                Image
                                                            </a>
                                                            <a ng-if="materal.filetype=='mp4' || materal.filetype=='mp4'"
                                                               style="color:red;display:inline; font-weight: bolder;" data-toggle="modal" data-target="#popup15"
                                                               ng-click="showGuardianPhotonew(materal)">
                                                                Video
                                                            </a>
                                                            <a ng-if="materal.filetype=='pdf'" style="color:blue;display:inline;" ng-click="onview(materal.cfilepath,materal.cfilename)">
                                                                <!--ng-click="downloadview(materal.cfilepath,materal.cfilename)">-->

                                                                <b style="color:orangered;display:inline; ">Pdf</b>
                                                            </a>
                                                            <a ng-if="materal.filetype=='doc'|| materal.filetype=='docx'"
                                                               style="color:blue;display:inline;"
                                                               href="{{materal.document_Pathnew}}" target="_blank">
                                                                <b style="color:orangered;display:inline;">Document</b>
                                                            </a>
                                                            <a ng-if="materal.filetype=='ppt'|| materal.filetype=='pptx'"
                                                               style="color:blue;display:inline;"
                                                               href="{{materal.document_Pathnew}}" target="_blank">
                                                                <b style="color:orangered;display:inline;">PPT</b>
                                                            </a>
                                                            <a ng-if="materal.filetype=='xls'|| materal.filetype=='xlsx'"
                                                               style="color:blue;display:inline;"
                                                               href="{{materal.document_Pathnew}}" target="_blank">
                                                                <b style="color:orangered;display:inline;">Excel</b>
                                                            </a>
                                                        </span>
                                                    </td>
                                                    <td class="text-center">
                                                        <span class="" ng-hide="materaldocuupload.length > 9">
                                                            <a href="" ng-show="$last" ng-click="addmateral()">
                                                                <i class="fa fa-plus"></i>
                                                            </a>
                                                        </span>
                                                        <span class="" id="remove" ng-hide="materaldocuupload.length ==1">
                                                            <a href="" ng-click="removemateral($index)">
                                                                <i class="fa fa-minus" aria-hidden="true"></i>
                                                            </a>
                                                        </span>
                                                    </td>
                                                </tr>
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                           
                            
                          


                            <md-button type="button" ng-click="sendsmsemail(vm.gridOptions.data)" class="md-raised md-primary" id="submit">
                                SEND
                            </md-button>
                            <button type="button" class="btn btn-warning" ng-click="clearid()" ng-disabled="form.$invalid">
                                Cancel
                            </button>
                        </div>
                    </div>

                </div>
                <div class="col-sm-6" style="overflow-y:auto;height:500px;">


                    <table class="table table-hover table-responsive table-bordered text-center" >
                        <thead>
                            <tr ng-repeat="item in vm.gridOptions.data  | limitTo:1">
                                <th>
                                    <a href="" ng-click="order('sno')">SLNO</a>
                                </th>

                                <th ng-repeat="key in item | keys">
                                    <a href="" ng-click="order(key)">{{key}}</a>

                                </th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr ng-repeat="item in vm.gridOptions.data |orderBy:sortKey:reverse">
                                <td>{{ $index + 1}}</td>
                                <td ng-repeat="key in item | keys " ng-init="value = item[key]">{{value}}</td>
                            </tr>
                        </tbody>
                    </table>

                    <pagination total-items="totalItems" ng-model="currentPage"
                                max-size="5" boundary-links="true"
                                items-per-page="numPerPage" class="pagination-sm">
                    </pagination>
                </div>
            </div>

            <div id="myModalimg" class="modal fade" role="dialog">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-body">
                            <img id="preview" class="img-responsive" />
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-default" data-dismiss="modal">Close</button>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </form>


</section>
