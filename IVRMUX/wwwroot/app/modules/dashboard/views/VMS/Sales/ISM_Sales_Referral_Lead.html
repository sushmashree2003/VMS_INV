                <div class="col-sm-12" style="overflow:auto !important">
                    <table class="table table-responsive table-bordered clearfix" style="width:100%;">
                        <thead>
                            <tr>
                                <th>
                                    Sl No.
                                </th>
                                <th style="width:1500px">
                                    Client Name
                                </th>
                                <!--<th>
                    Raw Lead Contact No
                </th>-->

                                    Call Status
                                </th>

    <!-- Raw Data Entry Form Section -->

    <div class="box box-primary" ng-show="Griddata.length > 0">
        <div class="box-header with-border">
            <h3 class="box-title">Referral Lead Details</h3>
            <div class="box-tools pull-right">
                <button type="button" class="btn btn-box-tool" data-widget="collapse"><i class="fa fa-minus"></i></button>
            </div>
        </div>
        <div class="box-body">
            <div class="col-sm-12 well">
                <div class="">
                    <div class="col-sm-4 pull-right">
                        <div class="form-group">
                            <div class="input-group">
                                <div class="input-group-addon">
                                    <i class="fa fa-search"></i>
                                </div>
                                <input class="form-control" ng-model="search" type="text" placeholder="search here..">
                            </div>
                        </div>
                    </div>
                </div>
                <div class="">
                    <div class="col-sm-12">
                        <table class="table table-responsive table-bordered text-left">
                            <thead>
                                <tr>
                                    <th>SL. No</th>



                                    <th><a href="" ng-click="sortTableData('ISMMCLT_ClientName')">Client Name</a></th>
                                    <th><a href="" ng-click="sortTableData('ISMRLM_callstatus')"> Call Status</a></th>

                                    <th><a href="" ng-click="sortTableData('ISMRLM_referredpersonname')">Reffred PersonName</a></th>
                                    <th><a href="" ng-click="sortTableData('ISMRLM_referredcontactnumber')">Reffred ContactNumber</a></th>
                                    <th><a href="" ng-click="sortTableData('ISMRLM_referredemail')">Reffred Email</a></th>

                                    <th><a href="" ng-click="sortTableData('ISMRLM_relation_with_client')">Relation With Client</a></th>
                                    <th><a href="" ng-click="sortTableData('ISMRLM_remarks')">Remark</a></th>

                                    <th><a href="" ng-click="sortTableData('ISMRLM_referral_personname')">Referral Person Name</a></th>
                                    <th><a href="" ng-click="sortTableData('ISMRLM_referral_contactnumber')">Referral ContactNumber</a></th>
                                    <th><a href="" ng-click="sortTableData('ISMRLM_referral_email')">Referral Email</a></th>

                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr dir-paginate="user in Griddata  |orderBy:sortKey:reverse |filter:search |itemsPerPage:itemsPerPage" current-page="currentPage">
                                    <td class="text-center">{{itemsPerPage *(currentPage-1)+$index+1}}</td>
                                    <td class="text-left">{{user.ISMMCLT_ClientName}}</td>
                                    <td class="text-left">{{user.ISMRLM_callstatus}}</td>

                                    <td class="text-left">{{user.ISMRLM_referredpersonname}}</td>
                                    <td class="text-left">{{user.ISMRLM_referredcontactnumber}}</td>
                                    <td class="text-left">{{user.ISMRLM_referredemail}}</td>

                                    <td class="text-left">{{user.ISMRLM_relation_with_client}}</td>
                                    <td class="text-left">{{user.ISMRLM_remarks}}</td>

                                    <td class="text-left">{{user.ISMRLM_referral_personname}}</td>
                                    <td class="text-left">{{user.ISMRLM_referral_contactnumber}}</td>
                                    <td class="text-left">{{user.ISMRLM_referral_email}}</td>
                                  
                                    <td>
                                        <span >
                                            <a class="text-aqua" href="" ng-click="edit(user)" data-placement="bottom" data-toggle="tooltip" title="Edit">
                                                <i class="fa fa-pencil-square-o" aria-hidden="true"></i>
                                            </a>
                                            |
                                            &nbsp;
                                            <span ng-if="!user.ISMRLM_Activeflag">
                                                <a href="" ng-click="deactiveY(temp)" class="text-green" data-placement="bottom" data-toggle="tooltip" title="Activate">
                                                    Activate
                                                </a>
                                            </span>
                                            <span ng-if="user.ISMRLM_Activeflag">
                                                <a href="" ng-click="deactiveY(temp)" class="text-danger" data-placement="bottom" data-toggle="tooltip" title="Deactivate">
                                                    De-Activate
                                                </a>
                                            </span>
                                        </span>
                                        <span ng-if="temp.ISMSLET_QuotationSent">
                                            <a class="text-aqua" href="" ng-click="edit(temp)" data-placement="bottom" data-toggle="tooltip" title="Edit">
                                                <i class="fa fa-pencil-square-o" aria-hidden="true"></i>
                                            </a>
                                        </span>
                                    </td>


                                </tr>
                            </tbody>
                        </table>
                        <dir-pagination-controls max-size="5"
                                                 direction-links="true"
                                                 boundary-links="true">
                        </dir-pagination-controls>
                    </div>

                </div>


            </div>
            <div>


            </div>
        </div>

    </div>


    <div class="box box-primary" ng-show="hide">
        <div class="box-header with-border">

                                    <th>ContactNo</th>
                                    <th>Email</th>
                                    <th>LeadCode</th>

                                    <th>Lead_Created_By</th>

                                    <th>Health</th>
                                    <th>State</th>
                                    <th>Remarks</th>

                            </thead>

                                    <td class="text-left">{{user.contactNo}}</td>
                                    <td class="text-left">{{user.email}}</td>
                                    <td class="text-left">{{user.leadCode}}</td>

                                    <td class="text-left">{{user.source}}</td>
                                    <td class="text-left">{{user.category}}</td>
                                    <td class="text-left">{{user.contact_Person}}</td>
                                    <td class="text-left">{{user.designation}}</td>
                                    <td class="text-left">{{user.health}}</td>
                                    <td class="text-left">{{user.state}}</td>
                                    <td class="text-left">{{user.remarks}}</td>
                                    <td class="text-left">{{user.country}}</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

                            <tbody>
                                <tr ng-repeat="user in InvalidData">
                                    <td class="text-center">{{itemsPerPage *(currentPage-1)+$index+1}}</td>

                                    <td class="text-left">{{user.contactNo}}</td>
                                    <td class="text-left">{{user.email}}</td>
                                    <td class="text-left">{{user.leadCode}}</td>
                                    <td class="text-left">{{user.address1}}</td>
                                    <td class="text-left">{{user.lead_Created_By}}</td>
                                    <td class="text-left">{{user.source}}</td>
                                    <td class="text-left">{{user.category}}</td>
                                    <td class="text-left">{{user.contact_Person}}</td>
                                    <td class="text-left">{{user.designation}}</td>
                                    <td class="text-left">{{user.health}}</td>
                                    <td class="text-left">{{user.state}}</td>
                                    <td class="text-left">{{user.remarks}}</td>
                                    <td class="text-left">{{user.country}}</td>

</section>
