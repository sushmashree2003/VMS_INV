
<section class="content" data-ng-init="getAllDetail()">
    <form class="form-horizontal ng-pristine ng-valid" role="form" data-ng-submit="savetmpldata()" name="myForm" method="post" novalidate>

        <div class="box box-primary">
            <div class="box-header with-border">
                <h3 class="box-title">Master Sales Source</h3>
                <div class="box-tools pull-right">
                    <button type="button" class="btn btn-box-tool" data-widget="collapse"><i class="fa fa-minus"></i></button>
                </div>
            </div>
            <div class="box-body">
                <div class="row">
                    <div class="col-sm-6 col-sm-offset-3">
                        <div class="form-group">
                            <label class="control-label col-sm-4">Organization :<span style="color:red;">*</span></label>
                            <div class="col-sm-8">
                                <select ng-model="MI_Id" name="inst" class="form-control" required ng-change="OnChangeCategoryInstitution()"
                                        ng-disabled="editflag==true">
                                    <option value="">--Select Organization</option>
                                    <option ng-repeat="ins in institution" value="{{ins.mI_Id}}" ng-selected="ins.mI_Id==MI_Id">{{ins.mI_Name}}</option>
                                </select>
                                <div class="error-messages" ng-if="interacted(myForm.inst)" ng-messages="myForm.inst.$error">
                                    <div ng-message="required">Select Organization</div>
                                </div>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="control-label col-sm-4">Source Name:<span style="color:red;">*</span></label>
                            <div class="col-sm-8">
                                <!--<input class="form-control" name="n" id="usr" type="text" ng-paste="$event.preventDefault()" data-ng-model="source" required>-->
                                <input class="form-control" name="n" id="usr" type="text" data-ng-model="source"
                                        allow-pattern="^[a-zA-Z0-9\s]*$" required>

                                <!--<input class="form-control" name="n" id="usr" type="text" data-ng-model="source" required>-->
                                <div class="error-messages" ng-if="interacted(myForm.n)" ng-messages="myForm.n.$error">
                                    <div ng-message="required">Enter Source Name</div>
                                    <div ng-message="pattern">The field contains only alphabets</div>
                                </div>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="control-label col-sm-4">Remark:<span style="color:Red">*</span></label>
                            <div class="col-sm-8">
                                <!--<textarea class="form-control" rows="4" name="Remark" ng-paste="$event.preventDefault()" id="comment" ng-model="Remark" required></textarea>-->
                                <textarea class="form-control" rows="4" name="Remark" id="comment" ng-model="Remark" 
                                          allow-pattern="^[a-zA-Z0-9\s]*$" required></textarea>
                                <div class="error-messages" ng-if="interacted(myForm.Remark)" ng-messages="myForm.Remark.$error">
                                    <div ng-message="required">Enter Remark</div>
                                </div>
                            </div>
                        </div>



                    </div>
                </div>
                <hr />
                <div class="text-center">
                    <input type="hidden" ng-model="Id" value="{{ISMSMSO_Id}}" />
                    <md-button type="submit" class="md-raised md-primary" ng-disabled="form.$invalid" id="save-btn">
                        <i class="fa fa-floppy-o" aria-hidden="true"></i>
                        Save
                    </md-button>
                    <md-button type="button" class="md-raised md-warn" data-ng-click="Clearid()">
                        <i class="fa fa-times" aria-hidden="true"></i>
                        Cancel
                    </md-button>
                </div>
            </div>
        </div>

    </form>



    <div class="box box-primary">
        <div class="box-header with-border">
            <h3 class="box-title">Master Sales Source List</h3>
            <div class="box-tools pull-right">
                <button type="button" class="btn btn-box-tool" data-widget="collapse" data-placement="bottom" data-toggle="tooltip" title="collapsible"><i class="fa fa-minus"></i></button>
            </div>
        </div>
        <!-- /.box-header -->
        <div class="box-body">
            <div class="row">
                <div class="col-sm-4">
                    <div class="form-group">
                        <label class="control-label">
                            <b> Total Grid Records :</b>
                            <label class="badge">
                                {{presentCountgrid}}
                            </label>
                        </label>
                    </div>
                </div>
                <div class="col-sm-4">
                    <div class="form-group">
                        <label class="control-label" ng-if="searchValue!=''">
                            <b>Total Records Searched : </b>
                            <label class="badge">
                                {{filterValue1.length}}
                            </label>
                        </label>
                    </div>
                </div>
                <div class="col-sm-4 pull-right">
                    <div class="form-group">
                        <div class="input-group">
                            <input class="form-control" ng-model="searchValue" type="text" placeholder="search here...">
                            <span class="input-group-addon">
                                <i class="fa fa-search"></i>
                            </span>
                        </div>
                    </div>
                </div>
            </div>
            <table class="table table-hover table-responsive table-bordered">
                <thead>
                    <tr>
                        <th>SL NO</th>
                        <th><a href="" ng-click="sort('')"> Source Name</a></th>
                        <th><a href="" ng-click="sort('')"> Remark</a></th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr dir-paginate="cl in filterValue1 = (source_list | filter : searchValue)  |orderBy:sortKey:sortReverse |itemsPerPage:itemsPerPage" current-page="currentPage" ng-class-odd="'odd'">
                        <td class="text-center">{{itemsPerPage *(currentPage-1)+$index+1}}</td>
                        <td class="text-left">{{cl.ismsmsO_SourceName}}</td>
                        <td class="text-left">{{cl.ismsmsO_Remarks}}</td>
                        <td class="text-center">
                            <span ng-if="cl.ismsmsO_ActiveFlag === true">
                                <a href="" ng-click="deactive(cl)"
                                   class="text-danger" data-placement="bottom" data-toggle="tooltip" title="Deactivate">
                                    Deactivate
                                </a>
                            </span>
                            <span ng-if="cl.ismsmsO_ActiveFlag === false">
                                <a href="" ng-click="deactive(cl)"
                                   class="text-green" data-placement="bottom" data-toggle="tooltip" title="Activate">
                                    Activate
                                </a>
                            </span>
                        </td>
                        <td class="text-center">
                            <a class="text-aqua" href="" ng-click="edit(cl)" data-placement="bottom" data-toggle="tooltip" title="Edit">
                                <i class="fa fa-pencil-square-o" aria-hidden="true"></i>
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
            <dir-pagination-controls max-size="5"
                                     direction-links="true"
                                     boundary-links="true">
            </dir-pagination-controls>
        </div>
    </div>
</section>
