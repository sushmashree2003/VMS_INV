<script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.4.8/angular.min.js"></script>
<script type="text/javascript" src="http://maps.googleapis.com/maps/api/js?sensor=false"></script>

<section class="content" ng-init="OnLoad()">
    <form class="form-horizontal ng-pristine ng-valid" role="form" name="myForm" method="post" novalidate>

        <div class="box box-primary">
            <div class="box-header with-border">
                <h3 class="box-title"> Sales Client Information </h3>
                <div class="box-tools pull-right">
                    <button type="button" class="btn btn-box-tool" data-widget="collapse"><i class="fa fa-minus"></i></button>
                </div>
            </div>
            <div class="box-body">
                <div class="box-content">
                    <div class="row">
                        <div class="col-sm-6">
                            <div class="form-group">
                                <label class="control-label col-sm-3">Client Name :<span style="color:Red">*</span></label>
                                <div class="col-sm-8">
                                    <input type="text" class="form-control" rows="4" placeholder="Enter Client Name" name="name" ng-model="ClientName" required />
                                </div>
                                <div class="col-sm-8 col-sm-offset-3 error-messages" ng-if="interacted(myForm.name)" ng-messages="myForm.name.$error">
                                    <div ng-message="required">Enter Client Name</div>
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="control-label col-sm-3">Contact No:<span style="color:Red">*</span></label>
                                <div class="col-sm-8">
                                    <input class="form-control" rows="4" placeholder="Enter Contact No" name="contact" ng-model="ContactNo" maxlength="10" ng-disabled="ISMSLERaw_Id.ISMSLERaw_Id > 0" ng-pattern="/^[6-9]{1,1}[0-9]{9,9}?$/" allow-pattern="\d" required />
                                </div>
                                <div class="col-sm-8 col-sm-offset-3 error-messages" ng-if="interacted(myForm.contact)" ng-messages="myForm.contact.$error">
                                    <div ng-message="required">Enter Contact No</div>
                                    <div ng-message="pattern">Enter Valid Mobile No.</div>
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="control-label col-sm-3">Email:<span style="color:Red">*</span></label>
                                <div class="col-sm-8">
                                    <input type="text"
                                           name="email"
                                           placeholder="Enter Email"
                                           class="form-control"
                                           ng-pattern="/^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.(com|edu\.in|org|org\.com|net|in|co\.in|info|gov|mil|biz|edu)$/"
                                           ng-model="EmailId"
                                           required />
                                </div>
                                <div class="col-sm-8 col-sm-offset-3 error-messages" ng-if="interacted(myForm.email)" ng-messages="myForm.email.$error">
                                    <div ng-message="required">Enter Email</div>
                                    <div ng-message="pattern">Enter a valid email</div>
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="control-label col-sm-3">Institution Name:<span style="color:Red">*</span></label>
                                <div class="col-sm-8">
                                    <input type="text" class="form-control" rows="4" placeholder="Enter Institution Name" name="Institution" ng-model="Institution" required />
                                </div>
                                <div class="col-sm-8 col-sm-offset-3 error-messages" ng-if="interacted(myForm.Institution)" ng-messages="myForm.Institution.$error">
                                    <div ng-message="required">Enter Institution Name</div>
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="control-label col-sm-3">Institution Address:<span style="color:Red">*</span></label>
                                <div class="col-sm-8">
                                    <input type="text" class="form-control" rows="4" placeholder="Enter Address" name="Address" ng-model="Address" required />
                                </div>
                                <div class="col-sm-8 col-sm-offset-3 error-messages" ng-if="interacted(myForm.Address)" ng-messages="myForm.Address.$error">
                                    <div ng-message="required">Enter Institution Address</div>
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="control-label col-sm-3">Pincode:<span style="color:red">*</span></label>
                                <div class="col-sm-8">
                                    <input class="form-control" rows="4" placeholder="Enter Pincode" name="pin" id="comment" maxlength="6" ng-model="Pincode" allow-pattern="\d" required />
                                </div>
                                <div class="col-sm-8 col-sm-offset-3 error-messages" ng-if="interacted(myForm.pin)" ng-messages="myForm.pin.$error">
                                    <div ng-message="required">Enter Pincode </div>
                                </div>
                            </div>

                        </div>
                        <div class="form-group">
                            <div class="col-sm-6">
                                <div class="form-group col-sm-12" ng-style="{'border-color': interacted(myForm.mon) && myForm.mon.$error.required ? 'red' : ''}">
                                    <div class="row">
                                        <label class="control-label col-sm-4 col-form-label">Product Names :<strong style="color:red;">*</strong></label>
                                        <div class="col-sm-8">
                                            <div class="multiselect">
                                                <input class="form-control" ng-model="searchchkbx5" type="text" placeholder="search here..." />
                                                <label>
                                                    <input name="all" value="1" ng-model="checkallm" type="checkbox" ng-click="all_checkm(checkallm)">
                                                    <span class="lbl padding-8">
                                                        All
                                                    </span>
                                                </label>
                                                <label ng-repeat="pr in productsonload | filter:searchchkbx5">
                                                    <input name="mon" ng-model="pr.selected" type="checkbox" ng-click="togchkbxm()" title="Select Employee" ng-required="isOptionsRequired()">
                                                    <span class="lbl padding-8">
                                                        {{pr.ISMSMPR_ProductName}}
                                                    </span>
                                                </label>
                                            </div>
                                            <div class="error-messages" ng-if="interacted(myForm.mon) && isOptionsRequired()" ng-messages="myForm.mon.$error">
                                                <div class="col-sm-8" ng-message="required">Please select at least one Product</div>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="form-group">
                                    <label class="control-label col-sm-4">Purchase status :<strong style="color:red;">*</strong></label>
                                    <div class="col-sm-8">
                                        <select class="form-control" ng-model="purchaseStatus" name="status" required>
                                            <option value="">--Select Status--</option>
                                            <option value="In Negotiation">In Negotiation</option>
                                            <option value="Pending approval">Pending approval</option>
                                            <option value="Purchased">Purchased</option>
                                            <option value="Not interested">Not interested</option>
                                        </select>
                                    </div>
                                    <div class="col-sm-8 col-sm-offset-3 error-messages" ng-if="interacted(myForm.status)" ng-messages="myForm.status.$error">
                                        <div ng-message="required">Enter status</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            <div class="box-footer">
                <div class="text-center">
                    <!--ng-disabled="myForm.$invalid"-->
                    <md-button type="submit" class="md-raised md-primary" id="save-btn" ng-click="SaveData(user)">
                        <i class="fa fa-floppy-o" aria-hidden="true"></i>
                        Save
                    </md-button>
                    <md-button type="button" class="md-raised md-warn" data-ng-click="cancel()">
                        <i class="fa fa-times" aria-hidden="true"></i>
                        Cancel
                    </md-button>
                </div>
            </div>
        </div>
        </div>
    </form>
