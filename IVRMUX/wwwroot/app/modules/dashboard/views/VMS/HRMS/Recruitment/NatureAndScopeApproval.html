<section class="content" data-ng-init="getAllDetail()">
    <form class="form-horizontal ng-pristine ng-valid" role="form" name="myForm" method="post" novalidate>
        <div class="box box-primary">
            <div class="box-header with-border">
                <h3 class="box-title"> Approval LIST</h3>
                <div class="box-tools pull-right">
                    <button type="button" class="btn btn-box-tool" data-widget="collapse"><i class="fa fa-minus"></i></button>
                </div>
            </div>
            <div class="box-body">
                <div class="row" ng-show="get_scopenature.length>0">
                    <div class="col-sm-12">
                        <div class="col-sm-4 pull-right">
                            <div class="form-group">
                                <div class="input-group">
                                    <span class="input-group-addon">
                                        <i class="fa fa-search"></i>
                                    </span>
                                    <input class="form-control" ng-model="searchValue" type="text" placeholder="search here...">
                                </div>
                            </div>
                        </div>
                        <table class="table table-hover table-responsive table-bordered text-center">
                            <thead>
                                <tr>
                                    <th width="40">
                                        <a href="">SL.NO</a>
                                    </th>
                                    <th class="hdTH" width="40">
                                        <label>
                                            <input type="checkbox" value="" ng-model="all2" ng-click="toggleAll()">
                                            <span class="lbl padding-8"></span>
                                        </label>
                                    </th>
                                    <th>
                                        Department
                                    </th>

                                    <th>
                                        Designation
                                    </th>
                                    <th>
                                        Nature Of Work
                                    </th>
                                    <th>
                                        Scope Of Service
                                    </th>
                                    <th width="110">
                                        Status
                                    </th>
                                    <!--<th>Remark</th>-->
                                </tr>
                            </thead>
                            <tbody>
                                <tr dir-paginate="temp in filterValue =(get_scopenature | filter : searchValue) | orderBy :sortKey:reverse |itemsPerPage:itemsPerPage" current-page="currentPage">
                                    <td>{{itemsPerPage *(currentPage-1)+$index+1}}</td>
                                    <td class="text-center  hdTD">
                                        <label>
                                            <input type="checkbox" ng-model="temp.selected" value="{{temp.Id}}" ng-change="optionToggled(temp,itemsPerPage1 *(currentPage1-1)+$index)">
                                            <span class="lbl padding-8"></span>
                                        </label>
                                    </td>
                                    <td hidden>{{temp.HRMNS_Id}}</td>
                                    <td>{{temp.HRMD_DepartmentName}}</td>
                                    <td>{{temp.HRMDES_DesignationName}}</td>
                                    <td>{{temp.HRMNS_NatureWork}}</td>
                                    <td>{{temp.HRMNS_ScopeService}}</td>
                                    <td>
                                        <select class="form-control" id="sel233" ng-model="temp.HRMNS_ApprovedStatus" name="status" ng-disabled="!temp.selected">
                                            <option value="Pending">Pending</option>
                                            <option value="Approved">Approved</option>
                                            <option value="Rejected">Rejected</option>
                                        </select>
                                    </td>
                                    <!--<td>
        <textarea type="text" name="Remark" class="form-control active" ng-model="temp.HRMNS_Remark" placeholder="Remark"></textarea>
    </td>-->
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
                <div class="text-center" ng-show="get_scopenature.length > 0">

                    <md-button type="button" class="md-raised md-accent" ng-click="savedetails()">
                        Save
                    </md-button>
                    <md-button type="submit" class="md-raised md-warn" ng-click="cancel()">
                        <i class="fa fa-times" aria-hidden="true"></i>
                        Cancel
                    </md-button>
                </div>
                <div class="box-body" ng-show="get_scopenature.length==0">
                    <div class="text-center"><b style="color:red">NOT AVAILABLE FOR APPROVAL </b></div>
                </div>
            </div>
        </div>
    </form>
</section>
