<script src='https://meet.vapssmartecampus.com/external_api.js'></script>
<script>
    //function loadvalues(hostid, id) {
    function loadvalues(hostid) {
        debugger;


        var json_data = hostid.getAttribute("data-filterListId");

        var obj = JSON.parse(json_data);


        debugger;
        var hostname = obj.name;


        var roomName = obj.lmslmeeT_MeetingId;


        if (hostname != '' && roomName != '') {
            const domain = 'meet.vapssmartecampus.com';
            const options = {
                roomName: roomName,
                parentNode: document.querySelector('#meet'),

                interfaceConfigOverwrite: {

                    TOOLBAR_BUTTONS: [
                        'microphone', 'camera', 'closedcaptions', 'desktop', 'fullscreen',
                        'fodeviceselection', 'profile', 'chat',
                        , 'etherpad', 'sharedvideo', 'settings', 'raisehand',
                        'videoquality', 'filmstrip', 'feedback', 'stats', 'shortcuts',
                        'tileview', 'download', 'help', 'mute-everyone', 'security'
                    ],

                }
            };
            const api = new JitsiMeetExternalAPI(domain, options);

        }






    }
</script>

<section class="content" id="idForJS" data-ng-controller="VMS_CandiateMeeting_JoinController">
    <form class="form-horizontal ng-pristine ng-valid" role="form" name="myForm" data-ng-init="onLoadGetData()" novalidate>


        <div class="box box-primary" ng-show="ttt">
            <div class="box-header with-border">
                <div class="box-header with-border">
                    <div class="col-sm-5 pull-left">
                        <label class="control-label col-sm-5" style="font-size: large;font-weight: 500;">Scheduled Date :</label>
                        <md-datepicker ng-model="LMSLMEET_PlannedDate" onkeydown="return false" name="From_Date" md-max-date="maxDatemf" id="date1" md-placeholder="Enter  date" ng-change="ondatechange()" required></md-datepicker>
                    </div>
                    <div class="col-sm-1" style="margin-left:10%">
                        <button type="button" style="background-color:#2669bc;border-radius:20px;" ng-click="clearallsettings()" class="btn btn-info" title="Reset Settings"><i class="fa fa-refresh" aria-hidden="true">&nbsp;&nbsp;Refresh</i></button>
                    </div>
                    <div class="col-sm-4 pull-right" style="margin-top: 10px;">
                        <a href="javascript:void(0)" class="text-primary ng-pristine ng-valid ng-touched" data-placement="bottom" data-toggle="modal" title="Recordings" data-ng-model="planner" data-target="#myModalView" aria-invalid="false" style="font-weight: bold;">
                            <i class="fa fa-eye fa-1x" aria-hidden="true" style="font-weight: bold;font-size:large;">  Previous Class Recording</i>
                        </a>
                    </div>
                </div>
            </div>

            <!-- /.box-header -->
            <div class="box-body">
                <div class="col-sm-6" ng-show="meetinglist.length>0" style="padding-right:20px">
                    <!--<div class="row">
                        <h4 class="box-title"> Meeting Scheduled By- {{employeename}}</h4>
                    </div>-->
                    <!--<div class="row">
                        <div class="col-sm-6 pull-left">
                            <div class="form-group">
                                <div class="input-group">
                                    <span class="input-group-addon">
                                        <i class="fa fa-search"></i>
                                    </span>
                                    <input class="form-control" ng-model="searchValue" type="text" placeholder="search here...">
                                </div>
                            </div>
                        </div>
                    </div>-->
                    <div class="row">
                        <!--<div id="htmldiv"></div>-->
                        <div class="well" style="border-radius:10px;border-top:3px solid #666cb9 !important;font-family:serif" dir-paginate="mm in filterValue1 = (meetinglist | filter : searchValue)  |itemsPerPage:itemsPerPage" current-page="currentPage" ng-class-odd="'odd'" pagination-id="paginate1">
                            <div class="row">
                                <label class="control-label col-sm-12"> Interview ID :<span style="color:red;font-size:15px"> {{ mm.VMSLMEET_MeetingId}}</span></label>

                                <label class="control-label col-sm-12"> <b> TOPIC :</b><span style="color:forestgreen;font-size:16px;font-weight:bold">&nbsp;{{ mm.VMSLMEET_MeetingTopic}}</span></label>
                                <label class="control-label col-sm-12">
                                    DATE/TIME:
                                    <span style="font-size:16px;font-weight:bold">
                                        {{ mm.VMSLMEET_PlannedDate |date:'dd-MM-yyyy'}} -- ( {{mm.VMSLMEET_PlannedStartTime}} To {{mm.VMSLMEET_PlannedEndTime}})
                                    </span>
                                </label>
                               
                                <div class="col-sm-12" ng-show="mm.VMSLMEETSTFOTH_LoginTime ==null && mm.VMSLMEETSTFOTH_LogoutTime ==null" >
                                    <button type="button" class="btn btn-info" style="float:right;padding: 5px 30px !important;font-weight:bold" ng-click="onstartmeeting(mm)"
                                            data-filterListId="{{mm}}">
                                        <!--onclick="loadvalues(this)"-->
                                        JOIN
                                    </button>
                                </div>
                                <div class="col-sm-12" ng-show="mm.VMSLMEETSTFOTH_LoginTime !=null && mm.VMSLMEETSTFOTH_LogoutTime==null" >

                                            data-filterListId="{{mm}}">
                                        RE-JOIN
                                    </button>
                                </div>

                            </div>

                        </div>
                        <dir-pagination-controls max-size="5" pagination-id="paginate1"
                                                 direction-links="true"
                                                 boundary-links="true">
                        </dir-pagination-controls>
                    </div>
                </div>

            </div>

        </div>

        <div class="row" ng-show="meetingstart.length>0">
            <!--<div id="htmldiv"></div>-->
            <div dir-paginate="mt in filterValue1 = (meetingstart | filter : searchValue)  |itemsPerPage:itemsPerPage3" current-page="currentPage3" ng-class-odd="'odd'" pagination-id="paginate3">
                <div class="col-sm-12" style="padding:5px">

                    <label class="control-label col-sm-12"> <b>MEETING ID :</b><span style="color:red">{{mt.VMSLMEET_MeetingId}}</span></label>
                    <label class="col-sm-8">
                        <b>MEETING TOPIC:</b>  <span style="color:red;font-size:20px;font-weight:bold">{{mt.VMSLMEET_MeetingTopic}}</span>
                    </label>

                    <button type="button" ng-click="clearallsettings()" class="btn btn-info" title="Reset Settings"><i class="fa fa-refresh" aria-hidden="true">&nbsp;&nbsp;Refresh</i></button>
                    <button type="button" class="btn btn-warning" style="float:right" ng-click="stopstreeming(mt);" value="{{mt.VMSLMEET_MeetingId}}">
                        END MEETING
                    </button>
                </div>
                <dir-pagination-controls max-size="5" pagination-id="paginate3"
                                         direction-links="true"
                                         boundary-links="true">
                </dir-pagination-controls>
            </div>

        </div>





        <input hidden type="text" name="hostname" value={{hostname}} ng-model="hostname" id="hostname" />
        <input hidden type="text" name="roomName" value={{roomName}} ng-model="roomName" id="roomName" />
        <!--<button onclick="loadvalues()"></button>-->

        <div id="meet" style="height:500px;width:100%;">
        </div>
        <br />





    </form>

    <div id="myModal" class="modal fade" role="dialog">
        <div class="modal-dialog" style="width:50%;">
            <div class="modal-content">
                <div class="modal-body">
                    <div class="box">
                        <div class="box-body">
                            <img id="preview" class="img-responsive" />
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <div class="text-center">
                        <button class="btn" ng-click="zoomin()"><i class="fa fa-plus text-black"></i></button>
                        <button class="btn" ng-click="zoomout()"><i class="fa fa-minus text-black"></i></button>

                    </div>
                    <md-button type="button" class="md-raised md-warn" data-dismiss="modal">
                        <i class="fa fa-times" aria-hidden="true"></i>
                        Close
                    </md-button>
                </div>
            </div>
        </div>
    </div>
</section>
