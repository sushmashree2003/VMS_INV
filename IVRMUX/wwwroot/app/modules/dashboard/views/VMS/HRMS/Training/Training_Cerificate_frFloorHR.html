<style>


    .oldd {
        background-color: coral;
    }

    .neww {
        background-color: white;
    }
</style>

<section class="content">
    <form class="form-horizontal ng-pristine ng-valid" role="form" name="myForm" data-ng-init="Loaddata()" novalidate>
        <div class="box box-primary">
            <div class="box-header with-border">
                <h3 class="box-title">Employee's Trenning Verify Details</h3>
                <div class="box-tools pull-right">
                    <button type="button" class="btn btn-box-tool" data-widget="collapse"><i class="fa fa-minus"></i></button>
                </div>
            </div>
            <div class="box-body">
                <div class="col-sm-12" ng-if="AllDataTraningHR1.length > 0">
                    <div class="col-sm-12">

                        <table class="table table-bordered table-condensed ">
                            <thead>
                                <tr>
                                    <th>
                                        Sl No
                                    </th>
                                    <th>

                                        <input type="checkbox" value="" ng-model="obj.all" ng-click="toggleAll()">
                                        <span class="lbl padding-8"></span>

                                    </th>
                                        


                                    <th style="width: 50px;">
                                        Approve
                                    </th>
                                    <th style="width: 50px;">
                                        Reject
                                    </th>
                                    <th>Employee's Name</th>

                                    <th>Department's Name</th>
                                    <th>
                                        File Details
                                    </th>

                                    <th>
                                        Remark
                                    </th>
                                </tr>
                            </thead>

                            <tbody>

                                <tr ng-repeat="planner in AllDataTraningHR1" class="{{planner.classname}}" ng-init="planner.flag='A'">
                                    <td>
                                        {{$index+1}}
                                    </td>
                                    <td>
                                        <input type="checkbox" ng-model="planner.checked" />
                                        <span class="lbl padding-8"></span>
                                    </td>

                                    <td>
                                        <label class="radio-inline">
                                            <input type="radio" value="A" name="StockPlus{{$index+1}}" ng-change="radiochange(planner);" ng-model="planner.AL_Flg">
                                            <span class="lbl padding-3"><a></a> </span>
                                        </label>

                                    </td>
                                    <td>
                                        <label class="radio-inline">
                                            <input type="radio" value="R" name="StockPlus{{$index+1}}" ng-change="radiochange(planner);" ng-model="planner.AL_Flg">
                                            <span class="lbl padding-3"><a></a> </span>
                                        </label>

                                    </td>
                                    <td>
                                        {{planner.name}}

                                    </td>
                                    <td>
                                        {{planner.HRMD_DepartmentName}}
                                    </td>


                                    <td>

                                        <a ng-if="planner.HRETF_FileName!=''" href="javascript:void(0)"
                                           ng-click="downloaddirectimage(planner.HRETF_FilePath,planner.HRETF_FileName,'Mode',planner.filetype)"
                                           data-toggle="tooltip" title="Download"><i class="fa fa-download text-primary" aria-hidden="true"></i></a>

                                    </td>

                                    <td class="text-center">
                                        <textarea maxlength="250" name="remark" ng-model="planner.AL_Remarks" class="form-control" resize: none; rows="2" placeholder="Remark" />
                                        <div class="error-messages" ng-if="interacted(myForm.remark)" ng-messages="myForm.remark.$error">
                                            <div ng-message="required">Enter Remark</div>
                                        </div>

                                    </td>

                                </tr>

                        </table>
                        <div class="col-sm-12">
                            <div class="text-center">
                                <md-button class="md-raised md-primary" id="save-btn" ng-click="saveAppointmentsMD()" aria-disabled="false">
                                    <i class="fa fa-pencil-square-o" aria-hidden="true"></i>
                                    Save
                                </md-button>
                                <md-button type="button" class="md-raised md-warn" data-ng-click="cleardata()">
                                    <i class="fa fa-times" aria-hidden="true"></i>
                                    Cancel
                                </md-button>
                            </div>

                        </div>
                    </div>


                </div>


            </div>

    </form>
    <div class="box box-primary">
        <div class="box-header with-border">
            <h3 class="box-title">Training and certification process List</h3>
            <div class="box-tools pull-right">
                <button type="button" class="btn btn-box-tool" data-widget="collapse" data-placement="bottom" data-toggle="tooltip" title="collapsible"><i class="fa fa-minus"></i></button>
            </div>
        </div>
        <!-- /.box-header -->
        <div class="box-body">
            <div class="row">
                <div class="col-sm-4">
                    <div class="form-group">
                        <label class="control-label">
                            <b> Total Grid Records :</b>
                            <label class="badge">
                                {{presentCountgrid}}
                            </label>
                        </label>
                    </div>
                </div>
                <div class="col-sm-4">
                    <div class="form-group">
                        <label class="control-label" ng-if="searchValue!=''">
                            <b>Total Records Searched : </b>
                            <label class="badge">
                                {{filterValue1.length}}
                            </label>
                        </label>
                    </div>
                </div>
                <div class="col-sm-4 pull-right">
                    <div class="form-group">
                        <div class="input-group">
                            <input class="form-control" ng-model="searchValue" type="text" placeholder="search here...">
                            <span class="input-group-addon">
                                <i class="fa fa-search"></i>
                            </span>
                        </div>
                    </div>
                </div>
            </div>
            <table class="table table-hover table-responsive table-bordered">
                <thead>
                    <tr>
                        <th>SL NO</th>
                        <th>Employee's Name</th>
                        <th>Department Name</th>
                        <th>File Name</th>
                        <th>View File</th>
                        <th>Status</th>
                        <!--<th>Action</th>-->

                    </tr>
                </thead>
                <tbody>


                    <tr dir-paginate="bm in filterValue1 = (AllDataTraningHO1 | filter : searchValue)  |orderBy:sortKey:sortReverse |itemsPerPage:itemsPerPage" current-page="currentPage" ng-class-odd="'odd'">
                        <td class="text-center">{{itemsPerPage *(currentPage-1)+$index+1}}
                        <td class="text-center">{{bm.name}}</td>
                        <td>{{bm.HRMD_DepartmentName}}</td>
                        <td class="text-center">{{bm.HRETF_FileName}}</td>
                        <td class="text-center">
                            <!--<a href="javascript:void(0)" data-toggle="modal" data-target="#popup11" data-backdrop="static" ng-click="viewdocument(bm);"> <i class="fa fa-eye text-blue"></i></a>-->
                            <a ng-if="bm.HRETF_FileName!=''" href="javascript:void(0)"
                               ng-click="downloaddirectimage(bm.HRETF_FilePath,bm.HRETF_FileName,'Mode',bm.filetype)"
                               data-toggle="tooltip" title="Download"><i class="fa fa-download text-primary" aria-hidden="true"></i></a>
                        </td>

                        <td class="text-center">

                            <!-- Check if HRETF_Status is "R" (Rejected) -->
                            <span ng-if="bm.HRETFA_Status  === 'R'">
                                Rejected
                            </span>

                            <!-- Check if HRETF_Status is "A" (Approved) -->
                            <span ng-if="bm.HRETFA_Status === 'A'">
                                Approved
                            </span>

                            <!-- If neither "R" nor "A", show Pending -->
                            <span ng-if="bm.HRETFA_Status !== 'R' && bm.HRETFA_Status !== 'A'">
                                Pending
                            </span>

                        </td>
                        <!--<td class="text-center">
                            <a class="text-aqua" href="" ng-click="edit(bm)" data-placement="bottom" data-toggle="tooltip" title="Edit">
                                <i class="fa fa-pencil-square-o" aria-hidden="true"></i>
                            </a>
                        </td>-->
                    </tr>
                </tbody>
            </table>
            <dir-pagination-controls max-size="5"
                                     direction-links="true"
                                     boundary-links="true">
            </dir-pagination-controls>
        </div>
    </div>

</section>



<div id="myimagePreview" class="modal fade" role="dialog">
    <div class="modal-dialog" style="width:55%;">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal"><i class="fa fa-times text-white" aria-hidden="true"></i></button>
                <h4 style="color:white"> TADA Apply </h4>

            </div>
            <div class="modal-body">
                <div class="box">
                    <div class="box-body">
                        <img id="preview" class="img-responsive" />
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<!--====================PDF view========-->
<div id="showpdf" class="modal fade" role="dialog">
    <div class="modal-dialog modal-lg">
        <form id="qqqq">
            <div class="modal-content">
                <div class="modal-footer">
                    <button type="button" class="btn btn-default" data-dismiss="modal">Close</button>
                </div>
                <div id="pdfIdzz">
                </div>
            </div>
        </form>
    </div>
</div>
