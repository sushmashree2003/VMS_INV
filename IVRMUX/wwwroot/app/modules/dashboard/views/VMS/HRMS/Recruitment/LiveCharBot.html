<style>

    .chat-container {
        bottom: 0;
        left: 0;
        right: 0;
        max-width: 1200px;
        width: 100%;
        margin: 20px auto;
        border: 1px solid #ccc;
        border-radius: 5px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        background-color: #fff;
    }

    .chat-header {
        background-color: #007bff;
        color: white;
        padding: 15px;
        text-align: center;
        border-top-left-radius: 5px;
        border-top-right-radius: 5px;
    }

    .chat-body {
        padding: 15px;
        background-color: #f9f9f9;
        height: 300px;
        overflow-y: auto;
        
    }

    .message {
        margin: 5px 0;
        padding: 10px;
        border-radius: 4px;
        max-width: 80%;
        word-wrap: break-word;
    }

    .client {
        background-color: #d1e7dd;
        margin-left: auto;
        color: #000;
    }

    .bot {
        background-color: #cfe2ff;
        margin-right: auto;
        color: #000;
    }

    .client strong {
        color: #007bff;
    }

    .bot strong {
        color: #28a745;
    }

    .chat-footer {
        display: flex;
        padding: 10px;
        background-color: #fff;
        border-top: 1px solid #ccc;
    }

        .chat-footer input {
            flex-grow: 1;
            margin-right: 10px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .chat-footer button {
            padding: 10px 15px;
        }
</style>

<div ng-app="app" ng-controller="LiveChatBotController" class="chat-container">
    <div class="chat-header">
        <h4>Live Chat Bot</h4>
    </div>
    <div class="chat-body" style="max-height: 600px; overflow-y: auto;">
        <div ng-repeat="message in messages" class="message" ng-class="{'client': message.sender === 'client', 'bot': message.sender === 'bot'}">
            <strong ng-if="message.sender === 'client'">You:</strong>
            <strong ng-if="message.sender === 'bot'">Vapsi:</strong>
            <span ng-bind-html="message.text"></span>
        </div>
    </div>

    <div ng-if="keywordSuggestions.length > 0" class="suggestions">
        <ul>
            <li ng-repeat="keyword in keywordSuggestions" ng-click="selectKeyword(keyword)">
                {{ keyword }}
            </li>
        </ul>
    </div>

    <div class="chat-footer">
        <input type="text" ng-model="userMessage" placeholder="Type a message..." class="form-control" ng-keypress="checkKeyPress($event)" />
        <button ng-click="sendMessage()" class="btn btn-primary">Send</button>
    </div>
</div>
