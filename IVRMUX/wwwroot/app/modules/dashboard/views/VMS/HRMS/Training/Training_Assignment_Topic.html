<style>
    .box-content {
        list-style-type: none;
        position: relative;
        border: 1px solid #3e85a0;
        padding: 12px;
        min-height: 150px;
        border-radius: 5px;
    }

    .UploadEmpDoc .file-blue:before {
        content: 'Upload Document';
        font-size: 12px;
    }
</style>

<section class="content" ng-init="loaddata()">
    <form class="form-horizontal ng-pristine ng-valid" role="form" name="myForm" novalidate>
        <div class="box box-primary">
            <div class="box-header with-border">
                <h3 class="box-title">Training Assignment Topic</h3>
                <div class="box-tools pull-right">
                    <button type="button" class="btn btn-box-tool" data-widget="collapse"><i class="fa fa-minus"></i></button>
                </div>
            </div>
            <div class="box-body">
                <div class="row">
                    <div class="col-sm-6 ">
                        <div class="form-group">
                            <label class="control-label col-sm-4">Topic:<strong style="color:Red">*</strong></label>
                            <div class="col-sm-8">
                                <select class="form-control" id="sel12" name="trainingtopic" rows="5" ng-model="hrmtT_Id" required>
                                    <option value="">--Select Topic--</option>
                                    <option ng-repeat="meet in training" value="{{meet.hrmtT_Id}}" ng-selected="{{meet.Selected===true}}">
                                        {{meet.hrmtT_Topic}}
                                    </option>
                                </select>
                                <div class="error-messages" ng-if="interacted(myForm.trainingtopic)" ng-messages="myForm.trainingtopic.$error">
                                    <div ng-message="required">Enter Topic Name</div>
                                </div>
                            </div>
                        </div>
                      
               
                    </div>
                </div>
                <div class="text-center">
                    <input type="hidden" ng-model="RTRAST_Id" value="{{RTRAST_Id}}" />
                    <md-button type="submit" class="md-raised md-primary" ng-disabled="form.$invalid" ng-click="saveData()" id="save-btn">
                        <i class="fa fa-floppy-o" aria-hidden="true"></i>
                        Save
                    </md-button>
                    <md-button type="button" class="md-raised md-warn" ng-click="cancel()">
                        <i class="fa fa-times" aria-hidden="true"></i>
                        Cancel
                    </md-button>
                </div>
            </div>
        </div>
        <div class="box box-primary" ng-show="getmasterdata.length>0">
            <div class="box-header with-border">
                <h3 class="box-title"> Training Assignment Topic List</h3>
                <div class="box-tools pull-right">
                    <button type="button" class="btn btn-box-tool" data-widget="collapse" data-placement="bottom" data-toggle="tooltip" title="collapsible"><i class="fa fa-minus"></i></button>
                </div>
            </div>
            <!-- /.box-header -->
            <div class="box-body" style="overflow:scroll">
                <div class="col-sm-4">
                    <div class="form-group">
                        <label class="control-label">
                            <b> Total Grid Records :</b>
                            <label class="badge">
                                {{getmasterdata.length}}
                            </label>
                        </label>
                    </div>
                </div>
                <div class="col-sm-4 pull-right">
                    <div class="form-group">
                        <div class="input-group">
                            <span class="input-group-addon">
                                <i class="fa fa-search"></i>
                            </span>
                            <input class="form-control" type="text" ng-model="search" placeholder="search here...">
                        </div>
                    </div>
                </div>
                <table class="table table-hover table-responsive table-bordered text-center">
                    <thead>
                        <tr>
                            <th>
                                SL.No.
                            </th>
                            <th>
                                <a href="" ng-click="sort('MOM_Name')">Topic Name</a>

                            </th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr dir-paginate="user in filterValue=(getmasterdata | filter : search) | orderBy:sortKey:reverse |itemsPerPage:itemsPerPage" current-page="currentPage">
                            <td>{{itemsPerPage *(currentPage-1)+$index+1}}</td>
                            <td>{{user.hrmtT_Topic}}</td>
                        </tr>
                    </tbody>
                </table>
                <dir-pagination-controls max-size="5"
                                         direction-links="true"
                                         boundary-links="true">
                </dir-pagination-controls>
            </div>
        </div>
    </form>
</section>
