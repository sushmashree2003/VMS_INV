<style>


    .oldd {
        background-color: coral;
    }

    .neww {
        background-color: white;
    }
</style>

<section class="content">
    <form class="form-horizontal ng-pristine ng-valid" role="form" name="myForm" data-ng-init="Loaddata()" novalidate>
        <div class="box box-primary">
            <div class="box-header with-border">
                <h3 class="box-title">Candidate's Verify Details</h3>
                <div class="box-tools pull-right">
                    <button type="button" class="btn btn-box-tool" data-widget="collapse"><i class="fa fa-minus"></i></button>
                </div>
            </div>
            <div class="box-body">
                <div class="col-sm-12" ng-if="lead_list2.length > 0">
                    <table class="table table-bordered table-condensed ">
                        <thead>
                            <tr>
                                <th>
                                    Sl No
                                </th>
                                <th>

                                    <input type="checkbox" value="" ng-model="obj.all" ng-click="toggleAll()">
                                    <span class="lbl padding-8"></span>

                                </th>



                                <th style="width: 50px;">
                                    Approve
                                </th>
                                <th style="width: 50px;">
                                    Reject
                                </th>
                                <th>Candiate Name</th>

                                <th>Mobile No</th>
                                <th>
                                    Email Id
                                </th>

                                <th>
                                    Remark
                                </th>
                            </tr>
                        </thead>

                        <tbody>

                            <tr ng-repeat="planner in lead_list2" class="{{planner.classname}}" ng-init="planner.flag='A'">
                                <td>
                                    {{$index+1}}
                                </td>
                                <td>
                                    <input type="checkbox" ng-model="planner.checked" />
                                    <span class="lbl padding-8"></span>
                                </td>

                                <td>
                                    <label class="radio-inline">
                                        <input type="radio" value="A" name="StockPlus{{$index+1}}" ng-change="radiochange(planner);" ng-model="planner.flag">
                                        <span class="lbl padding-3"><a></a> </span>
                                    </label>

                                </td>
                                <td>
                                    <label class="radio-inline">
                                        <input type="radio" value="R" name="StockPlus{{$index+1}}" ng-change="radiochange(planner);" ng-model="planner.flag">
                                        <span class="lbl padding-3"><a></a> </span>
                                    </label>

                                </td>
                                <td>
                                    {{planner.CandidateName}}
                                </td>


                                <td>
                                    {{planner.HRME_MobileNo}}
                                </td>
                                <td>
                                    {{planner.HRME_EmailId}}
                                </td>
                                <td class="text-center">
                                    <textarea maxlength="250" name="remark" ng-model="planner.HRCDDV_Remarks" class="form-control" resize: none; rows="2" placeholder="Remark" />
                                    <div class="error-messages" ng-if="interacted(myForm.remark)" ng-messages="myForm.remark.$error">
                                        <div ng-message="required">Enter Remark</div>
                                    </div>

                                </td>

                            </tr>

                    </table>
                    <div class="col-sm-12">
                        <div class="text-center">
                            <md-button class="md-raised md-primary" id="save-btn" ng-click="saveData()" aria-disabled="false">
                                <i class="fa fa-pencil-square-o" aria-hidden="true"></i>
                                Save
                            </md-button>
                            <md-button type="button" class="md-raised md-warn" data-ng-click="cleardata()">
                                <i class="fa fa-times" aria-hidden="true"></i>
                                Cancel
                            </md-button>
                        </div>

                    </div>
                </div>
               
               
            </div>


        </div>

    </form>

</section>



<div id="myimagePreview" class="modal fade" role="dialog">
    <div class="modal-dialog" style="width:55%;">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal"><i class="fa fa-times text-white" aria-hidden="true"></i></button>
                <h4 style="color:white"> TADA Apply </h4>

            </div>
            <div class="modal-body">
                <div class="box">
                    <div class="box-body">
                        <img id="preview" class="img-responsive" />
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<!--====================PDF view========-->
<div id="showpdf" class="modal fade" role="dialog">
    <div class="modal-dialog modal-lg">
        <form id="qqqq">
            <div class="modal-content">
                <div class="modal-footer">
                    <button type="button" class="btn btn-default" data-dismiss="modal">Close</button>
                </div>
                <div id="pdfIdzz">
                </div>
            </div>
        </form>
    </div>
</div>
