
<section class="content">
    <div data-ng-init="">
        <div class="box box-primary">
            <div class="box-header with-border">
                <h3 class="box-title">Reference Number Configuration</h3>
                <div class="box-tools pull-right">
                    <button type="button" class="btn btn-box-tool" data-widget="collapse"><i class="fa fa-minus"></i></button>
                </div>
            </div>

            <div class="box-body">
                <form class="form-horizontal ng-pristine ng-valid" role="form" name="myForm" data-ng-init="loadreferenceconfg()" novalidate>
                    <div class="box-body">
                        <div class="row">
                            <div class="col-sm-6 ">
                                <div class="form-group">
                                    <div class="col-sm-4">
                                        <label class="control-label">Criteria Name :<span style="color:red;">*</span></label>
                                    </div>
                                    <div class="col-sm-8">
                                        <select class="form-control" name="Criteria" ng-model="fmsrncoN_Criterias" required>
                                            <option value="">--Select--</option>
                                            <option value="Company">Company Name</option>
                                            <option value="Client">Client Name</option>
                                            <option value="Financial Year">Financial Year</option>
                                            <option value="Category">Category</option>
                                            <option value="Subject">Subject</option>
                                        </select>
                                        <div class="error-messages" ng-if="interacted(myForm.Criteria)" ng-messages="myForm.Criteria.$error">
                                            <div ng-message="required">Please Select Criteria Name</div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="col-sm-6">
                                <div class="form-group">
                                    <label class="control-label col-sm-4">Criteria Order : <span style="color:Red">*</span></label>
                                    <div class="col-sm-8">
                                        <input class="form-control" type="text" data-ng-model="fmsrncoN_CriteriaOrder" maxlength="3" name="order"  allow-pattern="([0-9])" required>
                                        <div class="error-messages" ng-if="interacted(myForm.order)" ng-messages="myForm.order.$error">
                                            <div ng-message="required">Please Enter Criteria Order</div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="col-sm-12" style="margin-top:10px;">
                            <div class="form-group">
                                <div class="text-center">
                                    <input type="hidden" ng-model="FMSRNCON_Id" value="{{FMSRNCON_Id}}" />
                                    <md-button type="button" class="md-raised md-primary" ng-click="saveCriteria();">
                                        <i class="fa fa-save" aria-hidden="true"></i> Save
                                    </md-button>
                                    <md-button type="button" class="md-raised md-warn" ng-click="cancel()">
                                        <i class="fa fa-times" aria-hidden="true"></i> Cancel
                                    </md-button>
                                </div>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <div class="box box-primary">
            <div class="box-header with-border">
                <h3 class="box-title">Reference Number Configuration</h3>
                <div class="box-tools pull-right">
                    <button type="button" class="btn btn-box-tool" ng-click="ShowHide2()" data-widget="collapse"><i class="fa fa-minus"></i></button>
                </div>
            </div>

            <div class="box-body">
                <div ui-grid="gridReferenceNoConfiguration" ui-grid-pagination class="grid text-center" style="height: 300px;"></div>
            </div>
        </div>
    </div>
</section>
