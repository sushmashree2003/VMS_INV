<section class="content" ng-init="Loaddata()">

    <form class="form-horizontal ng-pristine ng-valid" role="form" method="post" name="myForm" novalidate>
        <div class="box box-primary">
            <div class="box-header with-border">
                <h3 class="box-title">FMS Approval Request</h3>
                <div class="box-tools pull-right">
                    <button type="button" class="btn btn-box-tool" data-widget="collapse"><i class="fa fa-minus"></i></button>
                </div>
            </div>

            <div class="box-body">
                <div class="row">
                    <div class="col-sm-1"></div>
                    <div class="col-sm-10">
                        <div class="form-group col-sm-6">
                            <label class="col-sm-6">File Name :<strong style="color:red;">*</strong></label>

                            <div class=" col-sm-6">
                                <select class="form-control" ng-model="Filename" name="Filename" required>
                                    <option value="">Select</option>
                                    <option ng-repeat="x in filename" value="{{x.fmsmpfN_Id}}">{{x.fmsmpfN_PhysicalFileName}}</option>
                                </select>
                                <div class="error-messages" ng-if="interacted(myForm.Filename)" ng-messages="myForm.Filename.$error">
                                    <div ng-message="required" class="col-sm-8">Select File Name</div>
                                </div>
                            </div>
                        </div>

                        <div class="col-sm-6">
                            <div class="form-group">
                                <label class="control-label col-sm-4">From Date:</label>
                                <div class="col-sm-8">
                                    <md-datepicker ng-model="fromdate" onkeypress="return false" name="Fromdate"
                                                   md-placeholder="Enter Date">
                                    </md-datepicker>
                                </div>
                            </div>
                        </div>
                        

                        <div class="col-sm-1"></div>
                    </div>

                </div>

                    <div class="row">
                        <div class="col-sm-1"></div>
                        <div class="col-sm-10">
                            <div class="form-group col-sm-6">
                                <label class="control-label col-sm-6">
                                    Require Days:<span style="color:red;">*</span>
                                </label>
                                <div class="col-sm-6">
                                    <input type="text" name="request" ng-model="request" allow-pattern="[0-9]" maxlength="2"  class="form-control" required>
                                    <div class="error-messages" ng-if="interacted(myForm.request)" ng-messages="myForm.request.$error">
                                        <div ng-message="required">Enter Require Days</div>
                                    </div>
                                </div>

                            </div>
                            <div class="col-sm-6">
                                <div class="form-group">
                                    <label class="control-label col-sm-4">To Date:</label>
                                    <div class="col-sm-8">
                                        <md-datepicker ng-model="todate" onkeypress="return false" name="Todate"
                                                       md-placeholder="Enter Date">
                                        </md-datepicker>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="col-sm-1"></div>
                    </div>

                    <input type="hidden" ng-model="fmsflreQ_Id" value="{{fmsflreQ_Id}}" />
                </div>
            <div class="row text-center">

                <md-button type="submit" ng-model="submitted" class="md-raised md-primary" ng-disabled="form.$invalid" ng-click="savedata()" id="save-btn">
                    <i class="fa fa-file" aria-hidden="true"></i>
                    Request
                </md-button>
                <md-button type="button" class="md-raised md-primary" ng-disabled="consolidateData.length==0" ng-show="consolidateData.length>0" ng-click="Print()" id="save-btn">
                    <i class="fa fa-print" aria-hidden="true"></i>
                    Print
                </md-button>
                <md-button type="button" class="md-raised md-primary" ng-disabled="consolidateData.length==0" ng-show="consolidateData.length>0" ng-click="exportToExceldetails()" id="save-btn">
                    <i class="fa fa-file-excel-o" aria-hidden="true"></i>
                    Excel
                </md-button>
                <md-button type="button" class="md-raised md-warn" ng-click="Clearid()">
                    <i class="fa fa-times" aria-hidden="true"></i>
                    Cancel
                </md-button>
            </div>
        </div>
    </form>


    <div class="box box-primary">
        <div class="box-header with-border">
            <h3 class="box-title">FMS Approval Request DETAILS</h3>
            <div class="box-tools pull-right">
                <button type="button" class="btn btn-box-tool" data-widget="collapse" data-placement="bottom"><i class="fa fa-minus"></i></button>
            </div>
        </div>

        <div class="box-body">
            <div class="row">
                <div class="col-sm-4">
                    <div class="form-group">
                        <label class="control-label">
                            <b> Total Grid Records :</b>
                            <label class="badge">
                                {{registration}}
                            </label>
                        </label>
                    </div>
                </div>

                <div class="col-sm-6 pull-right">
                    <div class="form-group">
                        <div class="input-group">
                            <span class="input-group-addon">
                                <i class="fa fa-search"></i>
                            </span>
                            <input class="form-control" type="text" ng-model=" SearchHere" placeholder="search here...">
                        </div>
                    </div>
                </div>
            </div>

            <div style="overflow-x:scroll;">
                <table class="table table-hover table-responsive table-bordered">
                    <thead>
                        <tr>
                            <th>SL.No</th>
                            <th>File Name</th>
                            <th>Required Days</th>
                            <th>Action</th>
                            <th>Return</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr ng-repeat="x in get_tax | filter : SearchHere ">
                            <td class="text-center">{{$index+1}}</td>
                            <td class="text-left">{{x.filenames}}</td>
                            <td class="text-left">{{x.requireddays}}</td>
                            <td class="text-left">
                                <a class="text-aqua" href="" ng-click="edit(x)" data-placement="bottom" data-toggle="tooltip" title="Edit">
                                    <i class="fa fa-pencil-square-o" aria-hidden="true"></i>
                                </a>
                                <span ng-if="x.fmsflreQ_ActiveFlg === false">
                                    <a href="" ng-click="deactive(x)" class="text-green" data-placement="bottom" data-toggle="tooltip" title="Activate">
                                        <i> Activate </i>
                                    </a>
                                </span>
                                <span ng-if="x.fmsflreQ_ActiveFlg === true">
                                    <a href="" ng-click="deactive(x)" class="text-danger" data-placement="bottom" data-toggle="tooltip" title="Deactivate">
                                        <i> Deactivate</i>
                                    </a>
                                </span>
                            </td>
                            <td class="text-center">
                                <span ng-show="obj.RCNT!=0">
                                    <a href="javascript:void(0)" data-toggle="modal" data-target="#popup11" data-backdrop="static" ng-model="iddata" value="{{x.fmsflreQ_Id}}"  ng-click="viewdocument(x.fmsflreQ_Id);"> <i class="fa fa-eye text-blue"></i></a>
                                </span>
                            </td>

                        </tr>
                    </tbody>
                </table>

            </div>

        </div>
    </div>



    <div id="popup11" class="modal fade modal-medium" role="dialog" data-backdrop="static" init="modelloaddata()">
        <div class="modal-dialog modal-md">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal" ng-click="BindData()"><i class="fa fa-times text-white" aria-hidden="true"></i></button>
                    <h4 class="modal-title text-white">FMS Approval Request</h4>
                </div>
                <div class="modal-body">
                    <div class="box-body margin-top-10">

                        <div class="row">

                            <div class="form-group col-sm-6">
                                <label class="col-sm-4">Hand Over By :<strong style="color:red;">*</strong></label>

                                <div class=" col-sm-8">
                                    <select class="form-control" ng-model="HRMEID" name="HRMEID" required>
                                        <option value="">Select</option>
                                        <option ng-repeat="x in hrmetable" ng-model="HRMEID" value="{{x.hrmE_Id}}">{{x.hrmE_EmployeeFirstName}}</option>
                                    </select>
                                    <div class="error-messages" ng-if="interacted(myForm.HRMEID)" ng-messages="myForm.HRMEID.$error">
                                        <div ng-message="required" class="col-sm-8">Select Employee</div>
                                    </div>
                                </div>

                            </div>

                            <div class="form-group col-sm-6">
                                <label class="control-label col-sm-4">
                                    Remarks:<span style="color:red;">*</span>
                                </label>
                                <div class="col-sm-8">
                                    <input type="text" name="request" ng-model="remarks" class="form-control" required>
                                    <div class="error-messages" ng-if="interacted(myForm.remarks)" ng-messages="myForm.remarks.$error">
                                        <div ng-message="required">Enter Remarks</div>
                                    </div>
                                </div>

                            </div>


                        </div>
                        <input type="hidden" ng-model="iddetails" value="{{iddetails}}" />
                        <div class="row text-center">
                            <md-button type="submit" ng-model="Update" class="md-raised md-primary" ng-disabled="form.$invalid" ng-if="flag==true" ng-click="Updatedata()" id="save-btn">
                                <i class="fa fa-file" aria-hidden="true"></i>
                                Return File
                            </md-button>
                            <md-button type="button" class="md-raised md-warn" ng-click="Clear()">
                                <i class="fa fa-times" aria-hidden="true"></i>
                                Clear
                            </md-button>
                        </div>
                        </div>
                    </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-default" data-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>





</section>
