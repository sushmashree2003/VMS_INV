
<section class="content">
    <div data-ng-init="ViewTenantProfile()">

        <div class="well">
          
            <form class="form-horizontal" role="form" name="myForm" novalidate>
                <div class="box box-primary">
                    <div class="box-header with-border">
                        <h3 class="box-title">Tenant Details Updation</h3>
                        <div class="box-tools pull-right">
                            <button type="button" class="btn btn-box-tool" data-widget="collapse"> <i class="fa fa-minus"></i></button>
                        </div>
                    </div>
                    <div class="box-body">

                        <div class="row">
                            <div class="col-sm-5">
                                <div class="form-group">
                                    <label class="control-label col-sm-4">Tenant Name:<span style="color:red;">*</span></label>
                                    <div class="col-sm-8">
                                        <input class="form-control" placeholder="Enter Tenant" name="name" id="usr" type="text" ng-paste="$event.preventDefault()" disabled data-ng-model="TENANTAGR_TenantName" required>
                                        <div class="error-messages" ng-if="interacted(myForm.name)" ng-messages="myForm.name.$error">
                                            <div ng-message="required">Enter Tenant Name</div>

                                        </div>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="control-label col-sm-4">Address:<span style="color:red;">*</span></label>
                                    <div class="col-sm-8">
                                        <textarea class="form-control" name="address" type="text" placeholder="Remark.... " ng-model="TENANTAGR_Address" rows="3" required></textarea>
                                        <!--<input class="form-control" placeholder="Enter Address" name="address" id="usr" type="text" ng-paste="$event.preventDefault()" data-ng-model="TENANTAGR_Address" required>-->
                                        <div class="error-messages" ng-if="interacted(myForm.address)" ng-messages="myForm.address.$error">
                                            <div ng-message="required">Enter Address</div>

                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="col-sm-5">
                                <div class="form-group">
                                    <label class="control-label col-sm-4">No Of Occupants:<span style="color:red;">*</span></label>
                                    <div class="col-sm-8">
                                        <input class="form-control" placeholder="No Of Occupants" name="NoOfOccupants" id="usr" type="text" ng-paste="$event.preventDefault()" data-ng-model="TENANTAGR_NoOfOccupants" allow-pattern="(\s|[0-9])" required>
                                        <div class="error-messages" ng-if="interacted(myForm.NoOfOccupants)" ng-messages="myForm.NoOfOccupants.$error">
                                            <div ng-message="required">Enter No Of Occupants</div>

                                        </div>
                                    </div>
                                </div>

                                <div class="form-group">
                                    <label class="control-label col-sm-4">Contact No :<span style="color:red;">*</span></label>
                                    <div class="col-sm-8">
                                        <input class="form-control" placeholder="Enter Contact" name="Contact" id="usr" type="text" ng-paste="$event.preventDefault()" allow-pattern="(\s|[0-9])" maxlength="10" data-ng-model="TENANTAGR_ContactNo" required>
                                        <div class="error-messages" ng-if="interacted(myForm.Contact)" ng-messages="myForm.Contact.$error">
                                            <div ng-message="required">Enter Contact No </div>

                                        </div>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="control-label col-sm-4">Email Id :<span style="color:red;">*</span></label>
                                    <div class="col-sm-8">
                                        <input class="form-control" placeholder="Enter Email" name="email" id="usr" type="text" ng-paste="$event.preventDefault()" data-ng-model="TENANTAGR_EmailId" required>
                                        <div class="error-messages" ng-if="interacted(myForm.email)" ng-messages="myForm.email.$error">
                                            <div ng-message="required">Enter Email Id</div>

                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                       <br />
                        
                       
                        <div class="col-sm-8 col-sm-offset-1">
                            <div class="text-center">
                                <input type="hidden" ng-model="TENANTAGR_Id" value="{{TENANTAGR_Id}}" />
                                <md-button type="button" class="md-raised md-primary" ng-click="Saveupdate()"
                                           ng-disabled="btn">
                                    <i class="fa fa-save" aria-hidden="true"></i> Save
                                </md-button>
                                <md-button type="button" class="md-raised md-warn" ng-click="cleartabl1()" ng-disabled="form.$invalid">
                                    <i class="fa fa-times" aria-hidden="true"></i> Cancel
                                </md-button>
                            </div>
                        </div>
                    </div>

                </div>

            </form>  

                                    </div>
                                </div>

</section>
