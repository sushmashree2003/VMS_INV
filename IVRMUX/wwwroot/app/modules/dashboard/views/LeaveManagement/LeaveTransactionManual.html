

<section class="content">
    <div data-ng-init="loadData()">

            <div class="box-header with-border">

                </div>
            </div>
            <!-- /.box-header -->
            <div class="box-body">
                <form class="form-horizontal ng-pristine ng-valid" role="form" name="myForm" novalidate ng-submit="savedata(options)">

                        <div class="col-sm-4">
                            <div class="form-group">
                                <div class="col-sm-8">
                                    <label class="checkbox-inline">
                                        Type :<span style="color:red;">*</span>
                                        <input type="checkbox" name="checktype" ng-model="emtype" data-ng-click="all_check_type(emtype)">
                                        <span class="lbl padding-8"> All</span>
                                    </label>
                                    <div class="multiselect col-sm-8">
                                        <label class="control-label" style="padding-left: 10px;/* width: 25.0em; */width: 93%;">
                                            <span>
                                                <input class="form-control" ng-model="obj.searchValuetype" type="text" placeholder="Search Type here...">
                                            </span>
                                        </label>
                                        <label data-ng-model="PASR_Id" ng-repeat="emptype in staff_types | filter:filterValue6" value="{{emptype.hrmgT_Id}}">
                                            <input name="etype" value="{{emptype.hrmgT_Id}}" ng-model="emptype.typ" type="checkbox" ng-required="isOptionsRequired()" ng-click="addColumn1(emptype)">
                                            <span class="lbl padding-8">
                                                {{emptype.hrmgT_EmployeeGroupType}}
                                            </span>
                                        </label>
                                    </div>
                                    <div class="error-messages" ng-if="interacted(myForm.etype)" ng-messages="myForm.etype.$error">
                                        <div ng-message="required" style="padding-left: 30px;">Please Select Type</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="col-sm-4">
                            <div class="form-group">
                                <div class="col-sm-8">
                                    <label class="checkbox-inline">
                                        Department :<span style="color:red;">*</span>
                                        <input type="checkbox" name="checkdept" ng-model="dept" data-ng-click="all_check_dept(dept)">
                                        <span class="lbl padding-8"> All</span>
                                    </label>
                                    
                                    <div class="multiselect col-sm-8">
                                        <label class="control-label" style="padding-left: 8px;width: 103%;">
                                            <span>
                                                <input class="form-control" ng-model="obj.searchValueDeptd" type="text" placeholder="Search Department here...">
                                            </span>
                                        </label>
                                        <label data-ng-model="PASR_Id" ng-repeat="dept in Department_types | filter:filterValue4" value="{{dept.hrmD_Id}}">
                                            <input name="dept" value="1" ng-model="dept.dep" type="checkbox" ng-click="addColumn2()" ng-required="isOptionsRequired1()">
                                            <span class="lbl padding-8">
                                                {{dept.hrmD_DepartmentName}}
                                            </span>
                                        </label>
                                    </div>
                                    <div class="error-messages" ng-if="interacted(myForm.dept)" ng-messages="myForm.dept.$error">
                                        <div ng-message="required" style="padding-left: 30px;">Please Select Department</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="col-sm-4 padding-left-none">
                            <div class="form-group">
                                <div class="col-sm-8">
                                    <label class="checkbox-inline">
                                        Designation :<span style="color:red;">*</span>
                                        <input type="checkbox" name="checkdesig" ng-model="desig" data-ng-click="all_check_desig(desig)">
                                        <span class="lbl padding-8"> All</span>
                                    </label>
                                    <div class="multiselect col-sm-8">
                                        <label class="control-label" style="padding-left: 10px;/* width: 25.0em; */width: 93%;">
                                            <span>
                                                <input class="form-control" ng-model="obj.searchValueDesgd" type="text" placeholder="Search Designation here...">
                                            </span>
                                        </label>
                                        <label data-ng-model="PASR_Id" ng-repeat="desig in Designation_types | filter:filterValue5" value="{{desig.hrmdeS_Id}}">
                                            <input name="desig" value="1" ng-model="desig.desg" type="checkbox" ng-click="addColumn3()" ng-required="isOptionsRequired2()">
                                            <span class="lbl padding-8">
                                                {{desig.hrmdeS_DesignationName}}
                                            </span>
                                        </label>
                                    </div>
                                    <div class="error-messages" ng-if="interacted(myForm.desig)" ng-messages="myForm.desig.$error">
                                        <div ng-message="required" style="padding-left: 30px;">Please Select Designation</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-sm-6">
                            <div class="form-group">
                                <label class="control-label col-sm-4">
                                    Leave Year :<span style="color:red;">*</span>
                                </label>
                                <div class="col-sm-6">
                                    <select class="form-control" name="yer" data-ng-model="hrmlY_Id" ng-change="yearchg(hrmlY_Id)" required>
                                        <option value="">--Select--</option>
                                        <option ng-repeat="option in get_year" value="{{option.hrmlY_Id}}" ng-selected="{{option.Selected===true}}">
                                            {{option.hrmlY_LeaveYear}}

                                        </option>
                                    </select>
                                </div>
                                <div class="error-messages" ng-if="interacted(myForm.yer)" ng-messages="myForm.yer.$error">
                                    <div ng-message="required" style="margin-left:270px;">Select Leave Year</div>
                                </div>
                            </div>

                        </div>
                        <div class="col-sm-6">
                            <div class="form-group">

                                <label class="control-label col-sm-4">Employee :<span style="color:Red">*</span></label>

                                <div class="col-sm-8">
                                    <ui-select id="sel1" name="empname" ng-model="obj.hrmE_Id" ng-true-value="1" theme="bootstrap" ng-keyup="searchfilter($select,filterdata);" ng-change="emp_lop(obj.hrmE_Id)" title="Select Employee" required>
                                        <ui-select-match placeholder="Select or search Employee in the list...">
                                            {{$select.selected.hrmE_EmployeeFirstName}}
                                        </ui-select-match>
                                        <ui-select-choices repeat="option in employee | propsFilter: {hrmE_EmployeeFirstName: $select.search}"
                                                           value="{{option.hrmE_Id}}" ng-selected="{{option.Selected == true}}">
                                            <div ng-bind-html="option.hrmE_EmployeeFirstName | highlight: $select.search"></div>
                                        </ui-select-choices>
                                    </ui-select>
                                </div>
                                <div class="error-messages" ng-if="interacted(myForm.empname)" ng-messages="myForm.empname.$error">
                                    <div ng-message="required" style="margin-left:270px;"> Select Employee First</div>
                                </div>
                            </div>
                            <!--<div ng-if="divflg != true">
                                <div ui-grid="gridLeavetranslops" style="height: 270px;"></div>
                            </div>-->
                        </div>

                    </div>

                    <div class="row">
                        <div class="col-sm-6">
                            <div class="form-group">
                                <label class="control-label col-sm-4">From Date:<span style="color:red;">*</span></label>
                                <div class="col-sm-8">
                                    <md-datepicker name="fdate" ng-model="fromDate" md-max-date="maxDatefrom" md-min-date="minDatefrom" md-placeholder="Enter date" ng-true-value="1" ng-false-value="0" ng-change="frmdate()" required></md-datepicker>
                                </div>
                                <div class="error-messages" ng-if="interacted(myForm.fdate)" ng-messages="myForm.fdate.$error">
                                    <div ng-message="required" style="margin-left:270px;"> Select From Date</div>
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="control-label col-sm-4">To Date:<span style="color:red;">*</span></label>
                                <div class="col-sm-8">
                                    <md-datepicker name="tdate" ng-model="toDate" md-max-date="maxDatefrom" md-min-date="minDatefrom" md-placeholder="Enter date" ng-change="todate()" ng-disabled="!fromDate" required></md-datepicker>
                                </div>
                                <div class="error-messages" ng-if="interacted(myForm.tdate)" ng-messages="myForm.tdate.$error">
                                    <div ng-message="required" style="margin-left:270px;">Select To Date</div>
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="control-label col-sm-4">Total Days:<span style="color:red;">*</span></label>
                                <div class="col-sm-8">
                                    <input type="text" class="form-control" ng-model="totaldays" ng-disabled="true" />
                                </div>
                            </div>
                        </div>
                        <div class="col-sm-6">
                            <div class="form-group">
                                <label class="control-label col-sm-4">
                                    <input type="radio" name="lopck" value="lopdata" ng-model="cklop" ng-disabled="!totaldays" ng-true-value="1" ng-false-value="0" ng-click="activelop()" required>
                                    <span class="lbl padding-8">Loss Of Pay :</span>
                                </label>


                                <label class="control-label col-sm-6">
                                    <input type="radio" name="lopckhd" value="lopdatahd" ng-model="cklop" ng-disabled="!totaldays" ng-click="activelop()" required>
                                    <span class="lbl padding-8">Loss Off Pay Half Day:</span>
                                </label>
                                <div class="col-sm-8">
                                    <input type="text" class="form-control" ng-model="nooflop" ng-hide="txtlop" ng-disabled="true" />

                                </div>
                                <div class="error-messages" ng-if="interacted(myForm.lopck)" ng-messages="myForm.lopck.$error">
                                    <div ng-message="required" style="margin-left:100px;">Please Select Loss Off Pay</div>
                                </div>

                            </div>

                        </div>

                            <div class="form-group">
                                <label class="control-label col-sm-4">
                                    <input type="radio" name="lopckhd" value="lopdatahd" ng-model="cklop" ng-disabled="!totaldays" ng-click="activelop()" required>

                                </label>
                                <div class="col-sm-8">

                                </div>
                                <div class="error-messages" ng-if="interacted(myForm.lopckhd)" ng-messages="myForm.lopckhd.$error">
                                    <div ng-message="required" style="margin-left:100px;">Please Select Loss Off Pay</div>
                                </div>

                            </div>

                        </div>-->

                    </div>

                        </div>
                    </div>-->
                    <!--</form>-->
                    <!--</div>-->


                </form>


                <div class="text-center">
                    <input type="hidden" ng-model="hreltD_Id" value="{{HRELTD_Id}}" />

                    <md-button type="submit" ng-disabled="form.$invalid" class="md-raised md-primary" ng-click="savedata()">
                        <i class="fa fa-save" aria-hidden="true"></i> Save
                    </md-button>
                    <md-button type="button" class="md-raised md-warn" ng-click="cancel()">
                        <i class="fa fa-times" aria-hidden="true"></i> Cancel
                    </md-button>
                </div>







            </div>
        </div>
        <div class="box box-primary">
            <div class="box-header with-border">
                <h3 class="box-title">Leave Transaction List</h3>
                <div class="box-tools pull-right">
                    <button type="button" class="btn btn-box-tool" data-widget="collapse" data-placement="bottom" data-toggle="tooltip" title="collapsible"><i class="fa fa-minus"></i></button>
                </div>
            </div>
            <!-- /.box-header -->
            <div class="box-body">
                <div ui-grid="gridLeavetranslops" ui-grid-pagination ui-grid-edit class="grid text-center" id="style-4" style="height: 270px;"></div>
            </div>
        </div>



    </div>

</section>
