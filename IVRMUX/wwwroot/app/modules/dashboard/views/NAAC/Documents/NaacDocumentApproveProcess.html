<link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">

<style>
    body {
        font-family: 'Times New Roman';
    }

    ul.tree li {
        list-style-type: none;
        position: relative;
        border: 1px solid #3e85a0;
        padding: 10px;
        border-radius: 5px;
    }

        ul.tree li ul {
            display: none;
        }

        ul.tree li.open > ul {
            display: block;
        }

        ul.tree li a {
            color: black;
            text-decoration: none;
        }

            ul.tree li a:before {
                height: 1em;
                padding: 0 .1em;
                font-size: .8em;
                display: block;
                position: absolute;
                left: -1.3em;
                top: .2em;
            }

        ul.tree li > a:not(:last-child):before {
            content: "+";
            color: blue;
            font-size: 20px;
            border: 1px solid blue solid;
        }

        ul.tree li.open > a:not(:last-child):before {
            content: "-";
            color: blue;
            font-size: 20px;
            border: 1px solid blue solid;
        }

    .btnnacc {
        float: left;
        margin-left: 5px;
    }

    .a {
        width: 10px !important;
    }

    .tabdiv3_upload {
        background: rgb(90, 88, 183);
        color: #fff;
        border-radius: 3px;
        padding: 6px 6px;
        text-decoration: none;
        font-size: 13px;
        margin-right: 4px;
        float: right;
    }

    .tabdiv3_link {
        background: rgb(30, 162, 185);
        color: #fff;
        border-radius: 3px;
        /*padding: 6px 6px;*/
        text-decoration: none;
        font-size: 13px;
        /*margin-right: 4px;
        float: right;*/
        margin: auto;
        /*position: absolute*/
    }

        .tabdiv3_link .iconimg {
            width: 16px;
            height: 15px;
            margin-top: -3px;
        }

    img {
        vertical-align: middle;
        border: 0;
    }

    .box-body .btn {
        display: inline-block;
        padding: 4px 10px;
        margin-top: -5px;
        font-size: 14px;
        font-weight: 400;
        line-height: 1.3;
        text-align: center;
        white-space: nowrap;
        vertical-align: middle;
        -ms-touch-action: manipulation;
        touch-action: manipulation;
        cursor: pointer;
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
        background-image: none;
        border-radius: 0;
    }

    .file-bluedd:before {
        content: 'Download Template';
        background: #2757a6;
        border-color: #2757a6;
        color: #FFF;
        text-shadow: 1px 1px rgba(000,000,000,0.5);
    }

    .UploadPhoto .file-blue:before {
        content: 'Upload Document';
        font-size: 12px;
    }

    .lessonplanner .file-blue:before {
        content: 'Upload File';
        font-size: 13px;
        text-align: center
    }

    .progress {
        height: 3em;
    }

    .progress-bar {
        transition: width 1s ease-in-out;
    }

    .approvebar {
        width: 120px;
        height: 150%;
        font-size: large;
        COLOR: black;
        font-stretch: semi-condensed;
        text-transform: uppercase;
        font-weight: bold;
    }
</style>


<section class="content">
    <form class="form-horizontal ng-valid" role="form" name="myForm" ng-init="onload()" novalidate>
        <div class="box box-primary">
            <div class="box-header with-border">
                <h3 class="box-title">NAAC DOCUMENT APPROVE PROCESS</h3>
                <div class="box-tools pull-right">
                    <button type="button" class="btn btn-box-tool" data-widget="collapse"><i class="fa fa-minus"></i></button>
                </div>
            </div>
            <div class="box-body">
                <div class="row">
                    <div class="col-sm-12">
                        <div class="text-center">
                            <md-button type="button" class="md-raised md-primary" ng-click="getdata()">
                                Get Details <i class="fa fa-info-circle" aria-hidden="true"></i>
                            </md-button>
                        </div>
                    </div>
                </div>


                <div ng-show="ddfd">
                    <div class="w3-light-grey w3-round">
                        <div class="w3-container w3-round w3-blue text-center" style="width:25%">25% Completed</div>
                    </div>
                    <br />
                    <ul class="tree">
                        <li ng-repeat="dd in array">
                            <a href="">{{dd.NAACSL_SLNo}}. {{dd.NAACSL_SLNoDescription}}</a>
                            <ul>
                                <li ng-repeat="ddd in dd.temparra1">
                                    <a href="">{{ddd.naacsL_SLNo}}. {{ddd.naacsL_SLNoDescription}}</a>
                                    <ul ng-if="ddd.temparray2.length>0">
                                        <li ng-repeat="dddd in ddd.temparray2">
                                            <a href="" style="word-wrap :break-word; ">{{dddd.naacsL_SLNo}}. {{dddd.naacsL_SLNoDescription}}</a>

                                            <div class="padding-left-10">
                                                <label style="width:17%;margin:auto;" ng-if="dddd.document_Path!=null && dddd.document_Path!=''">
                                                    <a style="color: blue; text-decoration:underline; font-size:large"
                                                       ng-click="downloaddirectimage(dddd.document_Path,dddd.naacsL_SLNo,'Document')">
                                                        Download File
                                                    </a>
                                                </label>
                                                <label class="radio-inline" ng-if="dddd.document_Path!=null && dddd.document_Path!=''">
                                                    <input name="optradio" type="radio" ng-model="dddd.status" value="Approved"
                                                           ng-disabled="dddd.NAACMSL_Status=='Approved' || dddd.NAACMSL_Status=='Rejected'" 
                                                           ng-if="dddd.document_Path!=null && dddd.document_Path!=''">
                                                    <span class="lbl padding-8">Approved</span>
                                                </label>
                                                <label class="radio-inline" ng-if="dddd.document_Path!=null && dddd.document_Path!=''">
                                                    <input name="optradio" type="radio" ng-model="dddd.status" value="Rejected"
                                                           ng-disabled="dddd.NAACMSL_Status=='Approved' || dddd.NAACMSL_Status=='Rejected'" 
                                                           ng-if="dddd.document_Path!=null && dddd.document_Path!=''">
                                                    <span class="lbl padding-8">Rejected</span>
                                                </label>

                                                <label ng-if="dddd.document_Path!=null && dddd.document_Path!=''">
                                                    <textarea class="form-control" name="stubplace" id="usr" type="text" disabled
                                                              ng-model="dddd.usercomments" maxlength="1000" placeholder="User Comments"
                                                              ng-if="dddd.document_Path!=null && dddd.document_Path!=''"></textarea>
                                                </label>

                                                <label ng-if="dddd.document_Path!=null && dddd.document_Path!=''">
                                                    <textarea class="form-control" name="stubplace" id="usr" type="text" 
                                                              ng-disabled="dddd.NAACMSL_Status=='Approved' || dddd.NAACMSL_Status=='Rejected'"
                                                              ng-model="dddd.coordinatorcomments" maxlength="1000" placeholder="Coordinator Comments"
                                                              ng-if="dddd.document_Path!=null && dddd.document_Path!=''"></textarea>
                                                </label>

                                                <md-button type="button" class="md-raised md-primary" ng-click="saveapproved(dddd)"
                                                           ng-if="dddd.document_Path!=null && dddd.document_Path!=undefined"
                                                           ng-disabled="(dddd.document_Path!=null && dddd.document_Path!='') 
                                                           && (dddd.NAACMSL_Status=='Approved' || dddd.NAACMSL_Status=='Rejected')">
                                                    Save <i class="fa fa-chevron-circle-right" aria-hidden="true"></i>
                                                </md-button>
                                            </div>
                                        </li>
                                    </ul>
                                    <ul ng-if="ddd.temparray2.length==0">
                                        <li class="import">
                                            <div class="padding-left-10">
                                                <label style="width:17%;margin:auto;" ng-if="dd.document_Path!=null && dd.document_Path!=''">
                                                    <a style="color: blue; text-decoration:underline; font-size:large"
                                                       ng-click="downloaddirectimage(dd.document_Path,dd.naacsL_SLNo,'Document')">
                                                        Download File
                                                    </a>
                                                </label>
                                                <label class="radio-inline" ng-if="dd.document_Path!=null && dd.document_Path!=''">
                                                    <input name="optradio" type="radio" ng-model="dd.status" value="Approved"
                                                           ng-disabled="dd.NAACMSL_Status=='Approved' || dd.NAACMSL_Status=='Rejected'" 
                                                           ng-if="dd.document_Path!=null && dd.document_Path!=''">
                                                    <span class="lbl padding-8">Approved</span>
                                                </label>
                                                <label class="radio-inline" ng-if="dd.document_Path!=null && dd.document_Path!=''">
                                                    <input name="optradio" type="radio" ng-model="dd.status" value="Rejected"
                                                           ng-disabled="dd.NAACMSL_Status=='Approved' || dd.NAACMSL_Status=='Rejected'" 
                                                           ng-if="dd.document_Path!=null && dd.document_Path!=''">
                                                    <span class="lbl padding-8">Rejected</span>
                                                </label>
                                                <label ng-if="dd.document_Path!=null && dd.document_Path!=''">
                                                    <textarea class="form-control" name="stubplace" id="usr" type="text" disabled
                                                              ng-model="dd.usercomments" maxlength="1000"
                                                              ng-if="dd.document_Path!=null && dd.document_Path!=''"></textarea>
                                                </label>
                                                <label ng-if="dd.document_Path!=null && dd.document_Path!=''">
                                                    <textarea class="form-control" name="stubplace" id="usr" type="text" ng-disabled="dd.NAACMSL_Status=='Approved'"
                                                              ng-model="dd.coordinatorcomments" maxlength="1000" placeholder="Coordinator Comments"
                                                              ng-if="dd.document_Path!=null && dd.document_Path!=''"></textarea>
                                                </label>

                                                <md-button type="button" class="md-raised md-primary" ng-click="saveapproved(dd)"
                                                           ng-if="dd.document_Path!=null && dd.document_Path!=undefined"
                                                           ng-disabled="(dd.document_Path!=null && dd.document_Path!='') 
                                                           && (dd.NAACMSL_Status=='Approved' || dd.NAACMSL_Status=='Rejected' ">
                                                    Save <i class="fa fa-chevron-circle-right" aria-hidden="true"></i>
                                                </md-button>
                                            </div>
                                        </li>
                                    </ul>
                                </li>
                            </ul>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </form>
</section>
