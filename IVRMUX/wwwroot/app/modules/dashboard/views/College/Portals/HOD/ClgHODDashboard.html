<section class="content StudentDashBoard" data-ng-init="loaddata()">
    <div class="box box-primary">
        <div class="box-header with-border">
            <div class="row">
                <div class="col-sm-3" style="width:18%"><h3 class="box-title">HOD Dashboard </h3></div>
            </div>
        </div>


        <div class="box-body">

            <div class="row">
                <div class="col-sm-6">
                    <div class="form-group">
                        <label class="control-label col-sm-4">
                            Academic Year :<strong style="color:red;display:inline; font-weight: bolder; margin-left: 7px;">*</strong>
                        </label>
                        <div class="col-sm-8">
                            <select class="form-control" name="academicyear" id="sel1" data-ng-model="cfg.ASMAY_Id" ng-change="onselectacademic()" required>
                                <option value="" label="">--Select Academic Year--</option>
                                <option ng-repeat="option in acayrlst" value="{{option.asmaY_Id}}" ng-selected="{{option.asmaY_Id == cfg.ASMAY_Id}}">
                                    {{option.asmaY_Year}}
                                </option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
            <br />
            <div class="row">
                <div class="col-sm-6">
                    <md-subheader>HOD Information</md-subheader>
                    <div class="well text-bold sinfo">
                        <div class="row">
                            <div class="col-sm-4 col-xs-4 ">Name</div>
                            <div class="col-sm-8 col-xs-8"><span>: {{staffname}}</span></div>
                        </div>
                        <div class="row">
                            <div class="col-sm-4 col-xs-4 ">Department</div>
                            <div class="col-sm-8 col-xs-8"><span>: {{department}}</span></div>
                        </div>
                        <div class="row">
                            <div class="col-sm-4 col-xs-4">Emp Code</div>
                            <div class="col-sm-8 col-xs-8"><span>: {{empcode}}</span></div>
                        </div>
                        <div class="row">
                            <div class="col-sm-4 col-xs-4 "> Mobile No</div>
                            <div class="col-sm-8 col-xs-8"><span>: {{mobileno}}</span></div>
                        </div>
                        <div class="row">
                            <div class="col-sm-4 col-xs-4 ">Email-Id</div>
                            <div class="col-sm-8 col-xs-8"><span>: {{email}}</span></div>
                        </div>


                    </div>
                </div>
            </div>








            <div class="row" ng-show="studentstrenthgr">

                <div class="col-sm-12">
                    <div class="box box-danger">
                        <div class="box-header with-border">
                            <h3 class="box-title">Salary Details </h3>
                            <div class="box-tools pull-right">
                                <button type="button" class="btn btn-box-tool" data-widget="collapse"><i class="fa fa-minus"></i></button>
                            </div>
                        </div>
                        <div class="box-body">
                            <div id="areachart" style="height: 350px; width: 100%;"></div>
                        </div>
                    </div>
                </div>
              
            </div>






        </div><!--end row-->












    </div>

  
</section>
