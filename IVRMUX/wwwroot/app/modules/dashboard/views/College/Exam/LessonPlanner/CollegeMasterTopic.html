

<section class="content">
        <div class="box box-primary">
            <div class="box-header with-border">
                <h3 class="box-title">Master Topic</h3>
                <div class="box-tools pull-right">
                    <button type="button" class="btn btn-box-tool" data-widget="collapse"><i class="fa fa-minus"></i></button>
                </div>
            </div>
            <div class="box-body">
                <form class="form-horizontal ng-pristine ng-valid" name="myForm" data-ng-submit="saveddata()" role="form" novalidate>
                
                    <div data-ng-init="BindData()">

                        <div class="row">
                            <div class="col-sm-6 col-sm-offset-3">
                                <div class="form-group">
                                    <label class="control-label col-sm-4">Topic Name:<span style="color:red;">*</span></label>
                                    <div class="col-sm-8">
                                        <input type="text" name="topicname" class="form-control" ng-model="LPMT_TopicName" maxlength="100" required />
                                    </div>
                                    <div class="col-sm-8 col-sm-offset-4 error-messages" ng-if="interacted(myForm.topicname)" ng-messages="myForm.topicname.$error">
                                        <div ng-message="required">Enter Topic Name</div>
                                    </div>
                                </div>
                            </div>
                            <div class="col-sm-6 col-sm-offset-3">
                                <div class="form-group">
                                    <label class="control-label col-sm-4">No. Of Periods :<span style="color:red;">*</span></label>
                                    <div class="col-sm-8">
                                        <input type="text" name="topicperiods" allow-pattern="[0-9]" class="form-control" ng-model="LPMT_TopicPeriods" maxlength="3" required />
                                    </div>
                                    <div class="col-sm-8 col-sm-offset-4 error-messages" ng-if="interacted(myForm.topicperiods)" ng-messages="myForm.topicperiods.$error">
                                        <div ng-message="required">Enter No. Of Periods</div>
                                    </div>
                                </div>
                            </div>
                            <div class="col-sm-6 col-sm-offset-3">
                                <div class="form-group">
                                    <label class="control-label col-sm-4">Topic Description:<span style="color:red;">*</span></label>
                                    <div class="col-sm-8">
                                        <input type="text" name="topicdesc" class="form-control" ng-model="LPMT_TopicDescription" maxlength="100" required />
                                    </div>
                                    <div class="col-sm-8 col-sm-offset-4 error-messages" ng-if="interacted(myForm.topicdesc)" ng-messages="myForm.topicdesc.$error">
                                        <div ng-message="required">Enter Topic Description</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="text-center">
                                <input type="hidden" ng-model="LPMT_Id" value="{{LPMT_Id}}" />
                                <md-button type="submit" class="md-raised md-primary" ng-disabled="form.$invalid">
                                    <i class="fa fa-save" aria-hidden="true"></i> Save
                                </md-button>
                                <md-button type="button" class="md-raised md-warn" ng-click="cancel()">
                                    <i class="fa fa-times" aria-hidden="true"></i> Cancel
                                </md-button>
                                <md-button type="button" class="md-raised md-primary" data-toggle="modal" data-target="#myModal">
                                    Set  order
                                </md-button>
                            </div>
                        </div>
                        </div>
                </form>
                </div>
            </div>
            <div class="box box-primary">
                <div class="box-header with-border">
                    <h3 class="box-title">Master Topic</h3>
                    <div class="box-tools pull-right">
                        <button type="button" class="btn btn-box-tool" data-widget="collapse" data-placement="bottom" data-toggle="tooltip" title="collapsible"><i class="fa fa-minus"></i></button>

                    </div>
                </div>
                <!-- /.box-header -->
                <div class="box-body">
                    <div ui-grid="gridOptions" ui-grid-pagination  class="grid text-center" id="style-4" style="height: 270px;"></div>
                </div>

                <!---Order Set -->
                <div class="modal fade modal-medium" id="myModal" role="dialog" data-backdrop="static">
                    <div class="modal-dialog modal-md">
                        <!-- Modal content-->
                        <div class="modal-content">
                            <div class="modal-header">
                                <button type="button" class="close" data-dismiss="modal" ng-click="BindData()"><i class="fa fa-times text-white" aria-hidden="true"></i><!--&times;--></button>
                                <h4 class="modal-title text-white">Master Topic</h4>
                            </div>
                            <div class="modal-body">
                                <table class="table table-hover table-responsive table-bordered">
                                    <thead>
                                        <tr>
                                            <th>
                                                SLNO
                                            </th>
                                            <th>
                                                Topic Name
                                            </th>
                                            <th>
                                             Topic Description
                                            </th>
                                            <th>
                                                Topic Order
                                            </th>
                                        </tr>
                                    </thead>
                                    <tbody ng-sortable="configA">
                                        <tr ng-repeat="user in grouptypeListOrder">
                                            <td>{{$index+1}}</td>
                                            <td>{{ user.lpmT_TopicName}}</td>
                                            <td>{{ user.lpmT_TopicDescription}}</td>
                                            <td>{{ user.lpmT_Topicorder}}</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>

                            <div class="modal-footer">
                                <button type="button" class="btn btn-default" data-dismiss="modal" ng-click="getOrder(grouptypeListOrder);">Save</button>
                                <button type="button" class="btn btn-default" data-dismiss="modal" ng-click="BindData()">Close</button>
                            </div>
                        </div>

                    </div>
                </div>
            </div>

</section>
