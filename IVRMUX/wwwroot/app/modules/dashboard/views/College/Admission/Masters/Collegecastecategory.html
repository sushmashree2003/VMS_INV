
<section class="content">
    <form class="form-horizontal" role="form" name="myForm" ng-init="BindData()" novalidate>
        <div class="box box-primary">
            <div class="box-header with-border">
                <h3 class="box-title">Master Caste Category</h3>
                <div class="box-tools pull-right">
                    <button type="button" class="btn btn-box-tool" data-widget="collapse"><i class="fa fa-minus"></i></button>
                </div>
            </div>
            <div class="box-body">
                <div class="row">
                    <div class="col-sm-6 col-sm-offset-3">
                        <div class="form-group">
                            <label class="control-label col-sm-4">Caste Category Name:<span style="color:Red">*</span></label>
                            <div class="col-sm-8">
                                <input type="text" ng-model="name" name="Category" ng-paste="$event.preventDefault()" class="form-control" maxlength="20" required allow-pattern="(\s|[a-zA-Z])" />
                                <div class="error-messages" ng-if="interacted(myForm.Category)" ng-messages="myForm.Category.$error">
                                    <div ng-message="required">Enter Caste Category Name</div>
                                </div>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="control-label col-sm-4">Description:<span style="color:Red">*</span></label>
                            <div class="col-sm-8">
                                <textarea class="form-control" rows="4" name="Description" ng-paste="$event.preventDefault()" id="comment" maxlength="25" ng-model="description" allow-pattern="(\s|[a-zA-Z])" required></textarea>
                                <div class="error-messages" ng-if="interacted(myForm.Description)" ng-messages="myForm.Description.$error">
                                    <div ng-message="required">Enter Description</div>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
                <hr />
                <div class="text-center">
                    <input type="hidden" ng-model="IMCC_Id" />
                    <md-button type="submit" class="md-raised md-primary" ng-disabled="myForm1.$invalid" id="save-btn" ng-click="savecastecategorydata()">
                        <i class="fa fa-floppy-o" aria-hidden="true"></i>
                        Save
                    </md-button>
                    <md-button type="button" class="md-raised md-warn" ng-click="cancel()">
                        <i class="fa fa-times" aria-hidden="true"></i>
                        Cancel
                    </md-button>
                </div>

            </div>
        </div>
    </form>
    <div class="box box-primary">
        <div class="box-header with-border">
            <h3 class="box-title">Caste Category List</h3>
            <div class="box-tools pull-right">
                <button type="button" class="btn btn-box-tool" data-widget="collapse" data-placement="bottom" data-toggle="tooltip" title="collapsible"><i class="fa fa-minus"></i></button>

            </div>
        </div>
        <!-- /.box-header -->
        <div class="box-body">
            <div class="row">
                <div class="col-sm-4">
                    <div class="form-group">
                        <label class="control-label">
                            <b> Total Grid Records :</b>
                            <label class="badge">
                                {{presentCountgrid}}
                            </label>
                        </label>
                    </div>
                </div>
                <div class="col-sm-4">
                    <div class="form-group" ng-if="searchValue!=''">
                        <label class="control-label">
                            <b>Total Records Searched : </b>
                            <label class="badge">
                                {{filterValue1.length}}
                            </label>
                        </label>
                    </div>
                </div>             
                <div class="col-sm-4 pull-right">
                    <div class="form-group">
                        <div class="input-group">
                            <span class="input-group-addon">
                                <i class="fa fa-search"></i>
                            </span>
                            <input class="form-control" ng-model="searchValue" type="text" placeholder="search here...">
                        </div>
                    </div>
                </div>
            </div>
            <table class="table table-hover table-responsive table-bordered text-center">
                <thead>
                    <tr>
                        <th>
                            SL.NO
                        </th>
                        <th ng-click="sort('imcC_CategoryName')">
                            Caste Category Name
                            <!--<span class="glyphicon sort-icon" ng-show="sortKey=='imcC_CategoryName'" ng-class="{'glyphicon-chevron-up':reverse,'glyphicon-chevron-down':!reverse}"></span>-->
                        </th>
                        <th ng-click="sort('imcC_CategoryDesc')">
                            Description
                            <!--<span class="glyphicon sort-icon" ng-show="sortKey=='imcC_CategoryDesc'" ng-class="{'glyphicon-chevron-up':reverse,'glyphicon-chevron-down':!reverse}"></span>-->
                        </th>
                        <th>Action</th>
                        <th hidden="hidden"></th>
                    </tr>

                </thead>
                <tbody>
                    <tr dir-paginate="newuser in filterValue1 = (newuser | filter : filterValue)  |orderBy:sortKey:sortReverse  |itemsPerPage:itemsPerPage" current-page="currentPage">
                        <td style="text-align:center">{{itemsPerPage *(currentPage-1)+$index+1}}</td>
                        <td>{{ newuser.imcC_CategoryName }}</td>
                        <td>{{ newuser.imcC_CategoryDesc }}</td>
                        <td>
                            <a href="javascript:void(0)" ng-click="Editcastecategorydata(newuser)" data-toggle="tooltip" title="Edit"><i class="fa fa-pencil-square-o text-primary" aria-hidden="true"></i></a>
                            <a href="javascript:void(0)" ng-click="Deletecastecategorydata(newuser)" data-toggle="tooltip" title="Delete"><i class="fa fa-trash text-danger" aria-hidden="true"></i></a>
                        </td>
                        <td hidden="hidden">{{newuser.imcC_Id}}</td>
                    </tr>
                </tbody>
            </table>

            <dir-pagination-controls max-size="5"
                                     direction-links="true"
                                     boundary-links="true">
            </dir-pagination-controls>

        </div>
    </div>

</section>
