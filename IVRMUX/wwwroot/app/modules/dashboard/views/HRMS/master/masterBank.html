<style>
    .ui-grid-sort-priority-number {
        font-size: 0;
    }
</style>
<section class="content">
    <div class="box box-primary" data-ng-init="onLoadGetData()">
        <div class="box-header with-border">
            <h3 class="box-title">MASTER BANK</h3>
            <div class="box-tools pull-right">
                <button type="button" class="btn btn-box-tool" data-widget="collapse"><i class="fa fa-minus"></i></button>
            </div>
        </div>
        <form class="form-horizontal" role="form" name="myForm" data-ng-submit="saveData()" novalidate>
            <div class="box-body">
                <div class="col-sm-6">
                    <div class="form-group">
                        <label class="control-label col-sm-4">Bank Name:<span style="color:red;">*</span></label>
                        <div class="col-sm-6">
                            <input type="text" name="BankName" class="form-control active" allow-pattern="(\s|[a-zA-Z0-9])"  data-ng-model="Bank.hrmbD_BankName" id="BankName" maxlength="100" required>
                            <div class="error-messages" ng-if="interacted(myForm.BankName)" ng-messages="myForm.BankName.$error">
                                <div ng-message="required">Enter Bank Name</div>
                            </div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="control-label col-sm-4">Account Number:<span style="color:red;">*</span></label>
                        <div class="col-sm-6">
                            <input type="text" name="AccountNo" class="form-control active" allow-pattern="(\s|[0-9])" data-ng-model="Bank.hrmbD_BankAccountNo" id="AccountNo" minlength="6" maxlength="20" required>
                            <div class="error-messages" ng-if="interacted(myForm.AccountNo)" ng-messages="myForm.AccountNo.$error">
                                <div ng-message="required">Enter Account Number</div>
                                <div ng-message="minlength">Account Number must contain minimum 6 digits</div>
                            </div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="control-label col-sm-4">Bank Address:<span style="color:red;">*</span></label>
                        <div class="col-sm-6">
                            <input type="text" name="BankAddress" class="form-control active" allow-pattern="(\s|[a-zA-Z0-9]|-|,|:|.)" data-ng-model="Bank.hrmbD_BankAddress" id="BankAddress" maxlength="100" required>
                            <div class="error-messages" ng-if="interacted(myForm.BankAddress)" ng-messages="myForm.BankAddress.$error">
                                <div ng-message="required">Enter Bank Address</div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-sm-6">
                    <div class="form-group">
                        <label class="control-label col-sm-4">Account Holder Name:<span style="color:red;">*</span></label>
                        <div class="col-sm-6">
                            <input type="text" name="accountholder" class="form-control active" data-ng-model="Bank.hrmbD_AccountHolderName" id="accountholder" maxlength="50" allow-pattern="(\s|[a-zA-Z ])" required>
                            <div class="error-messages" ng-if="interacted(myForm.accountholder)" ng-messages="myForm.accountholder.$error">
                                <div ng-message="required">Enter Account Holder Name</div>
                            </div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="control-label col-sm-4">Account Type:<span style="color:red;">*</span></label>
                        <div class="col-sm-6">
                            <input type="text" name="accounttype" class="form-control active" data-ng-model="Bank.hrmbD_BankAccountType" id="accounttype" maxlength="50" required>
                            <div class="error-messages" ng-if="interacted(myForm.accounttype)" ng-messages="myForm.accounttype.$error">
                                <div ng-message="required">Enter Account Type</div>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="control-label col-sm-4">Branch Name:<span style="color:red;">*</span></label>
                        <div class="col-sm-6">
                            <input type="text" name="BranchName" class="form-control active" allow-pattern="(\s|[a-zA-Z0-9])" data-ng-model="Bank.hrmbD_BranchName" id="BranchName" maxlength="50" required>
                            <div class="error-messages" ng-if="interacted(myForm.BranchName)" ng-messages="myForm.BranchName.$error">
                                <div ng-message="required">Enter Branch Name</div>
                            </div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="control-label col-sm-4">IFSC Code:<span style="color:red;">*</span></label>
                        <div class="col-sm-6">
                            <input type="text" name="IFSCCode" class="form-control active" allow-pattern="([a-zA-Z0-9])" data-ng-model="Bank.hrmbD_IFSCCode" id="IFSCCode" maxlength="11" required>
                            <div class="error-messages" ng-if="interacted(myForm.IFSCCode)" ng-messages="myForm.IFSCCode.$error">
                                <div ng-message="required">Enter IFSC Code</div>
                                <div ng-message="pattern">Enter Valid IFSC Code</div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-sm-12" style="margin-top:10px;">
                    <div class="form-group">
                        <div class="text-center">
                            <input type="hidden" ng-model="Bank.hrmbD_Id" />
                            <md-button type="submit" class="md-raised md-primary" ng-disabled="form.$invalid" id="save-btn">
                                <i class="fa fa-floppy-o" aria-hidden="true"></i>
                                Save
                            </md-button>
                            <md-button type="button" class="md-raised md-warn" data-ng-click="cancel()">
                                <i class="fa fa-times" aria-hidden="true"></i>
                                Cancel
                            </md-button>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </div>

    <div class="box box-primary">
        <div class="box-header with-border">
            <h3 class="box-title">Master Bank List</h3>
            <div class="box-tools pull-right">
                <button type="button" class="btn btn-box-tool" data-widget="collapse" data-placement="bottom" data-toggle="tooltip" title="collapsible"><i class="fa fa-minus"></i></button>
            </div>
        </div>
        <!-- /.box-header -->
        <div class="box-body">
            <div ui-grid="gridOptions" ui-grid-pagination class="grid"></div>

        </div>
    </div>
</section>
