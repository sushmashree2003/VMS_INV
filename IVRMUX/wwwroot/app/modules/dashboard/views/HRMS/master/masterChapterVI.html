<style>
    .ui-grid-sort-priority-number {
        font-size: 0;
    }
</style>
<section class="content">
    <div class="box box-primary" data-ng-init="onLoadGetData()">
        <div class="box-header with-border">
            <h3 class="box-title">Master Chapter VI</h3>
            <div class="box-tools pull-right">
                <button type="button" class="btn btn-box-tool" data-widget="collapse"><i class="fa fa-minus"></i></button>
            </div>
        </div>
        <form class="form-horizontal" role="form" name="myForm" data-ng-submit="saveData()" novalidate>
            <div class="box-body">
                <div class="col-sm-6">
                    <div class="form-group">
                        <label class="control-label col-sm-4">Section Name:<span style="color:red;">*</span></label>
                        <div class="col-sm-8">
                            <input type="text" name="BankName" class="form-control active" ng-pattern="(\s|[a-zA-Z]-|,|:|.)" allow-pattern="(\s|[a-zA-Z]-|,|:|.)" ng-paste="$event.preventDefault()" data-ng-model="Bank.hrmcviA_SectionName" id="BankName" maxlength="100" required>
                            <div class="error-messages" ng-if="interacted(myForm.BankName)" ng-messages="myForm.BankName.$error">
                                <div ng-message="required">Enter Section Name</div>
                            </div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="control-label col-sm-4">Section Code:</label>
                        <div class="col-sm-8">
                            <select class="form-control" name="stubloodgrp" data-ng-model="Bank.hrmcviA_SectionCode" id="sel1">
                                <option value="">--Select--</option>
                                <option value="80C">80C</option>
                                <option value="80CCC">80CCC</option>
                                <option value="80E">80E</option>
                                <option value="80CCD">80CCD</option>
                                <option value="80EE">80EE</option>
                                <option value="80G">80G</option>
                                <option value="80GG">80GG</option>
                                <option value="80U">80U</option>
                                <option value="80DD">80DD</option>
                                <option value="80D">80D</option>
                                <option value="80DDB">80DDB</option>


                            </select>
                            <!--<div class="error-messages" ng-if="interacted1(myForm1.stubloodgrp)" ng-messages="myForm1.stubloodgrp.$error">
                                <div ng-message="required">Select Blood Group</div>
                            </div>-->
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="control-label col-sm-4 padding-right-none">
                            <input type="checkbox" name="Max" data-ng-model="Bank.hrmcviA_SubSectionAplFlg" ng-click="showleaves()" required>
                            <span class="lbl padding-8">SubSection Applicable </span>
                        </label>


                    </div>

                </div>
                <div class="col-sm-6">
                    <div class="form-group">
                        <label class="control-label col-sm-4 padding-right-none">
                            <input type="checkbox" name="Max" data-ng-model="Bank.hrmcviA_MaxLimitAplFlg" ng-click="showleave()" required>
                            <span class="lbl padding-8">Max Limit Applicable :</span>
                        </label>
                        <div class="col-sm-8">
                            <input class="form-control" name="maxtxt" data-ng-model="Bank.hrmcviA_MaxLimit" type="text" allow-pattern="\d" required maxlength="6" ng-disabled="selectcarry" />
                        </div>
                        <div class="error-messages" ng-if="interacted(myForm2.maxtxt)" ng-messages="myForm2.maxtxt.$error">
                            <div ng-message="required">Select Max Limit Applicable</div>
                        </div>
                    </div>






                    <div class="text-center">
                        <div class="well">
                            <label>Please Select Part:<span style="color:red;">*</span></label>
                            <label class="radio-inline">
                                <input type="radio" value="A" name="radioption" data-ng-model="Bank.hrmcviA_PartFlg" required />
                                <span class="lbl padding-8">A</span>
                            </label>
                            <label class="radio-inline">
                                <input type="radio" value="B" name="radioption" data-ng-model="Bank.hrmcviA_PartFlg" required />
                                <span class="lbl padding-8">B</span>
                            </label>
                            <div class="error-messages" ng-if="interacted(myForm.radioption)" ng-messages="myForm.radioption.$error">
                                <div ng-message="required">Please Select Radio Button</div>
                            </div>
                        </div>

                    </div>

                </div>
                <div class="col-sm-12" style="margin-top:10px;">
                    <div class="form-group">
                        <div class="text-center">
                            <input type="hidden" ng-model="Bank.hrmcviA_Id" />
                            <md-button type="submit" class="md-raised md-primary" ng-disabled="form.$invalid" id="save-btn">
                                <i class="fa fa-floppy-o" aria-hidden="true"></i>
                                Save
                            </md-button>
                            <!--<md-button type="button" class="md-raised md-primary" data-toggle="modal" data-target="#myModal">
                                <i class="fa icon-sort-by-order" aria-hidden="true"></i>
                                Set order
                            </md-button>-->
                            <md-button type="button" class="md-raised md-warn" data-ng-click="cancel()">
                                <i class="fa fa-times" aria-hidden="true"></i>
                                Cancel
                            </md-button>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </div>

    <div class="box box-primary">
        <div class="box-header with-border">
            <h3 class="box-title">Master Chapter List</h3>
            <div class="box-tools pull-right">
                <button type="button" class="btn btn-box-tool" data-widget="collapse" data-placement="bottom" data-toggle="tooltip" title="collapsible"><i class="fa fa-minus"></i></button>
            </div>
        </div>
        <!-- /.box-header -->
        <div class="box-body">
            <div ui-grid="gridOptions" ui-grid-pagination ui-grid-edit class="grid text-center" id="style-4" style="height: 270px;"></div>

        </div>
    </div>
 
    <div class="modal fade" id="myModal" role="dialog">
        <div class="modal-dialog modal-lg">
            <!-- Modal content-->
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal">
                        <i class="fa fa-times" aria-hidden="true" style="color:#fff !important;"></i>
                    </button>
                    <h4 class="modal-title" style="color:#fff !important;">Master Chapter List</h4>
                </div>
                <div class="modal-body">
                    <table class="table table-hover table-responsive table-bordered">
                        <thead>
                            <tr>
                                <th style="width:212px">SLNO</th>
                                <th style="width:212px">Chapter Name</th>
                                <th style="width:212px">Chapter Code</th>
                            </tr>
                        </thead>
                        <tbody ng-sortable="configA">
                            <tr ng-repeat="user in emploanList">
                                <td>{{$index+1}}</td>
                                <td>{{user.hrmcviA_SectionName}}</td>
                                <td>{{user.hrmcviA_SectionCode}}</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-default" data-dismiss="modal" ng-click="getOrder(emploanList);">Save</button>
                    <button type="button" class="btn btn-default" data-dismiss="modal">Close</button>
                </div>
            </div>

        </div>
    </div>

</section>
