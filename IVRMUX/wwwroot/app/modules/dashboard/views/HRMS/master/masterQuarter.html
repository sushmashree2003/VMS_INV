<style>
    .ui-grid-sort-priority-number {
        font-size: 0;
    }
</style>
<section class="content">
    <div class="box box-primary" data-ng-init="onLoadGetData()">
        <div class="box-header with-border">
            <h3 class="box-title">MASTER QUARTER</h3>
            <div class="box-tools pull-right">
                <button type="button" class="btn btn-box-tool" data-widget="collapse"><i class="fa fa-minus"></i></button>
            </div>
        </div>
        <form class="form-horizontal" role="form" name="myForm" data-ng-submit="saveData()" novalidate>
            <div class="box-body">
                <div class="col-sm-6">
                    <div class="form-group">
                        <label class="control-label col-sm-4">Quarter Name:<span style="color:red;">*</span></label>
                        <div class="col-sm-6">
                            <input type="text" name="BankName" class="form-control active" allow-pattern="(\s|[a-zA-Z0-9])" data-ng-model="Bank.hrmQ_QuarterName" id="BankName" maxlength="100" required>
                            <div class="error-messages" ng-if="interacted(myForm.BankName)" ng-messages="myForm.BankName.$error">
                                <div ng-message="required">Enter Bank Name</div>
                            </div>
                        </div>
                    </div>
                  
                    <div class="form-group">
                        <label class="control-label col-sm-4"> From Date:<span style="color:red;">*</span></label>
                        <div class="col-sm-6">
                            <md-datepicker name="AppliedDate" data-ng-model="Bank.hrmQ_FromDay" onkeydown="return false" md-placeholder="Select Date" ng-change="setMonthAndyear(Bank.hrmQ_FromDay)" required></md-datepicker>
                            <div class="error-messages" ng-if="interacted(myForm.AppliedDate)" ng-messages="myForm.AppliedDate.$error">
                                <div ng-message="required">Select Date Entry</div>
                            </div>
                        </div>
                    </div>


                    <div class="form-group">
                        <label class="control-label col-sm-4">From Month:<strong style="color:red;">*</strong></label>
                        <div class="col-sm-6">

                            <select class="form-control" name="mnth" id="sel12" data-ng-model="Bank.hrmQ_FromMonth" ng-disabled="monthDis" required>
                                <option value="">--Select--</option>
                                <option ng-repeat="month in monthdropdown" value="{{month.ivrM_Month_Name}}" ng-selected="{{month.Selected===true}}">
                                    {{month.ivrM_Month_Name}}
                                </option>
                            </select>

                            <div class="error-messages" ng-if="interacted(myForm.mnth)" ng-messages="myForm.mnth.$error">
                                <div ng-message="required">Select Month Name</div>
                            </div>
                        </div>
                    </div>

                    </div>
                    
   

                <div class="col-sm-6">

                    <div class="form-group">
                        <!--<label class="control-label col-sm-4">To Date:<span style="color:red;">*</span></label>-->
                        <div class="col-sm-6">
                            <!--<md-datepicker name="AppliedDates" data-ng-model="Bank.hrmQ_ToDay" onkeydown="return false" md-placeholder="Select Date" ng-change="setMonthAndyears(Bank.hrmQ_ToDay)" required></md-datepicker>
                            <div class="error-messages" ng-if="interacted(myForm.AppliedDates)" ng-messages="myForm.AppliedDates.$error">
                                <div ng-message="required">Select Date Entry</div>
                            </div>-->
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="control-label col-sm-4">To Date:<span style="color:red;">*</span></label>
                        <div class="col-sm-6">
                            <md-datepicker name="AppliedDates" data-ng-model="Bank.hrmQ_ToDay" onkeydown="return false" md-placeholder="Select Date" ng-change="setMonthAndyears(Bank.hrmQ_ToDay)" required></md-datepicker>
                            <div class="error-messages" ng-if="interacted(myForm.AppliedDates)" ng-messages="myForm.AppliedDates.$error">
                                <div ng-message="required">Select Date Entry</div>
                            </div>
                        </div>
                    </div>


                    <div class="form-group">
                        <label class="control-label col-sm-4">To Month:<strong style="color:red;">*</strong></label>
                        <div class="col-sm-6">

                            <select class="form-control" name="mnth" id="sel12" data-ng-model="Bank.hrmQ_ToMonth" ng-disabled="monthDis" required>
                                <option value="">--Select--</option>
                                <option ng-repeat="month in monthdropdown" value="{{month.ivrM_Month_Name}}" ng-selected="{{month.Selected===true}}">
                                    {{month.ivrM_Month_Name}}
                                </option>
                            </select>

                            <div class="error-messages" ng-if="interacted(myForm.mnth)" ng-messages="myForm.mnth.$error">
                                <div ng-message="required">Select Month Name</div>
                            </div>
                        </div>
                    </div>
                </div>
                        <div class="col-sm-12" style="margin-top:10px;">
                            <div class="form-group">
                                <div class="text-center">
                                    <input type="hidden" ng-model="Bank.hrmQ_Id" />
                                    <md-button type="submit" class="md-raised md-primary" ng-disabled="form.$invalid" id="save-btn">
                                        <i class="fa fa-floppy-o" aria-hidden="true"></i>
                                        Save
                                    </md-button>
                                    <md-button type="button" class="md-raised md-warn" data-ng-click="cancel()">
                                        <i class="fa fa-times" aria-hidden="true"></i>
                                        Cancel
                                    </md-button>
                                </div>
                            </div>
                        </div>
                    </div>
</form>
    </div>

    <div class="box box-primary">
        <div class="box-header with-border">
            <h3 class="box-title">Master Quarter List</h3>
            <div class="box-tools pull-right">
                <button type="button" class="btn btn-box-tool" data-widget="collapse" data-placement="bottom" data-toggle="tooltip" title="collapsible"><i class="fa fa-minus"></i></button>
            </div>
        </div>
        <!-- /.box-header -->
        <div class="box-body">
            <div ui-grid="gridOptions" ui-grid-pagination class="grid"></div>

        </div>
    </div>
</section>
