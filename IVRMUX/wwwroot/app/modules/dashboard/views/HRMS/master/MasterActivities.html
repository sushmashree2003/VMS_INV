<style>
    .box-content {
        list-style-type: none;
        position: relative;
        border: 1px solid #3e85a0;
        padding: 12px;
        min-height: 150px;
        border-radius: 5px;
    }
</style>

<section class="content">
    <div class="well">
        <md-content class="ng-pristine ng-valid" ng-init="Loaddata()">
            <form class="form-horizontal ng-pristine ng-valid" role="form" method="post" name="myForm" novalidate>
                <div class="box box-primary">
                    <div class="box-header with-border">
                        <h3 class="box-title">External Training</h3>
                        <div class="box-tools pull-right">
                            <button type="button" class="btn btn-box-tool" data-widget="collapse"><i class="fa fa-minus"></i></button>
                        </div>
                    </div>
                    <div class="box-body">
                        <div class="row">
                            <div class="col-sm-12">
                                <br />
                                <div class="form-group">
                                    <div class="row">
                                        <div class="col-sm-6">
                                            <label class="control-label col-sm-4">Activities:<span style="color:red">*</span></label>
                                            <div class="col-sm-8">
                                                <input type="text" name="Activities" class="form-control active" allow-pattern="(\s|[a-zA-Z])" ng-paste="$event.preventDefault()" data-ng-model="activities" id="Activities" maxlength="100" required>
                                                <div class="error-messages" ng-if="interacted(myForm.Activities)" ng-messages="myForm.Activities.$error">
                                                    <div ng-message="required">Enter Activities</div>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="col-sm-6">
                                            <label class="control-label col-sm-4">Discription:<span style="color:red">*</span></label>
                                            <div class="col-sm-8">
                                                <input type="text" name="Discription" class="form-control active" allow-pattern="(\s|[a-zA-Z])" ng-paste="$event.preventDefault()" data-ng-model="discription" id="discription" maxlength="200" required>
                                                <div class="error-messages" ng-if="interacted(myForm.Discription)" ng-messages="myForm.Discription.$error">
                                                    <div ng-message="required">Enter Discription</div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
    </div>



    <div class="row">
        <div class="text-center">
            <input type="hidden" ng-model="hr_pr_ID" value="{{hr_pr_ID}}" />
            <md-button type="submit" class="md-raised md-primary" ng-disabled="form.$invalid" ng-click="saverecord()" id="save-btn">
                <i class="fa fa-floppy-o" aria-hidden="true"></i>
                Save
            </md-button>
            <md-button type="button" class="md-raised md-warn" ng-click="Clearid()">
                <i class="fa fa-times" aria-hidden="true"></i>
                Cancel
            </md-button>
        </div>
    </div>





    <!--Grid-->
    <div class="box box-primary">
        <div class="box-header with-border">
            <h3 class="box-title">External Training List</h3>
            <div class="box-tools pull-right">
                <button type="button" class="btn btn-box-tool" data-widget="collapse" data-placement="bottom" data-toggle="tooltip" title="collapsible"><i class="fa fa-minus"></i></button>
            </div>
        </div>
        <!-- /.box-header -->
        <div class="box-body">
            <div class="row">
                <div class="col-sm-4">
                    <div class="form-group margin-left-none">
                        <label class="control-label">
                            <b> Total Grid Records :</b>
                            <label class="badge">
                                {{presentCountgrid}}
                            </label>
                        </label>
                    </div>
                </div>
                <div class="col-sm-4">
                    <div class="form-group">
                        <label class="control-label" ng-if="searchValue2!=''">
                            <b>Total Records Searched : </b>
                            <label class="badge">
                                {{filterValue.length}}
                            </label>
                        </label>
                    </div>
                </div>
                <div class="col-sm-4 pull-right">
                    <div class="form-group">
                        <div class="input-group">
                            <input class="form-control" ng-model="searchValue2" type="text" placeholder="search here...">
                            <span class="input-group-addon">
                                <i class="fa fa-search"></i>
                            </span>
                        </div>
                    </div>
                </div>
            </div>
            <table class="table table-hover table-responsive table-bordered">
                <thead>
                    <tr>
                        <th>SL NO</th>
                        <th>Activities</th>
                        <th>Discription</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr dir-paginate="indl in filterValue = (getloadgrid | filter : searchValue2)  | orderBy:propertyName:reverse |itemsPerPage:itemsPerPage" current-page="currentPage" ng-class-odd="'odd'" pagination-id="page1">

                        <td>{{itemsPerPage *(currentPage-1)+$index+1}}</td>
                        <td class="text-center">{{indl.hr_pR_NAME}}</td>
                        <td class="text-center">{{indl.hr_pR_DESC}}</td>
                        <td style="text-align:center">
                            <a href="javascript:void(0)" ng-click="EditData(indl)" class="text-primary" data-placement="bottom" data-toggle="tooltip" title="Edit">
                                <i class="fa fa-pencil-square-o" aria-hidden="true"></i>
                            </a>
                            |
                            <span ng-if="indl.hrexttrN_ActiveFlag === true">
                                <a href="" ng-click="deactiveY(indl)"
                                   class="text-danger" data-placement="bottom" data-toggle="tooltip" title="Deactivate">
                                    <i class="fa fa-toggle-on text-green" aria-hidden="true" title="Deactive Record"></i>
                                </a>
                            </span>
                            <span ng-if="indl.hrexttrN_ActiveFlag === false">
                                <a href="" ng-click="deactiveY(indl)"
                                   class="text-green" data-placement="bottom" data-toggle="tooltip" title="Activate">
                                    <i class="fa fa-toggle-off text-red" aria-hidden="true" itle="Activate Record"></i>
                                </a>
                            </span>
                        </td>
                    </tr>
                </tbody>
            </table>

            <dir-pagination-controls max-size="10"
                                     direction-links="true"
                                     boundary-links="true" pagination-id="page1">
            </dir-pagination-controls>
        </div>
    </div>

</section>
