<style>
    .ui-grid-sort-priority-number {
        font-size: 0;
    }
</style>
<section class="content">
    <div class="box box-primary" data-ng-init="onLoadGetData()">
        <div class="box-header with-border">
            <h3 class="box-title">TDS Quarter</h3>
            <div class="box-tools pull-right">
                <button type="button" class="btn btn-box-tool" data-widget="collapse"><i class="fa fa-minus"></i></button>
            </div>
        </div>
        <form class="form-horizontal" role="form" name="myForm" data-ng-submit="saveData()" novalidate>
            <div class="box-body">
                <div class="col-sm-6">
                    <div class="form-group">
                        <label class="control-label col-sm-4">Employee :<span style="color:red;">*</span></label>
                        <div class="col-sm-6">
                            <select class="form-control" id="sel1" data-ng-model="loan.hrmE_Id" name="hrmE_Id" required>
                                <option value="">Select</option>
                                <option ng-repeat="employee in employeedropdown" value="{{employee.hrmE_Id}}" ng-selected="{{employee.Selected===true}}">
                                    {{employee.hrmE_EmployeeFirstName}} {{employee.hrmE_EmployeeMiddleName}} {{employee.hrmE_EmployeeLastName}}
                                </option>
                            </select>
                            <div class="error-messages" ng-if="interacted(myForm.hrmE_Id)" ng-messages="myForm.hrmE_Id.$error">
                                <div ng-message="required">Select Employee</div>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="control-label col-sm-4">Financial Year :<span style="color:red;">*</span></label>
                        <div class="col-sm-6">
                            <select class="form-control" id="sel1" name="finanYearId" data-ng-model="loan.imfY_Id" ng-change="GetEmployeeListByFilterSelection()" required>
                                <option value="">Select</option>
                                <option ng-repeat="leaveyear in leaveyeardropdown" value="{{leaveyear.imfY_Id}}" ng-selected="{{leaveyear.Selected===true}}">
                                    {{leaveyear.imfY_FinancialYear}}
                                </option>
                            </select>
                            <div class="error-messages" ng-if="interacted(myForm.finanYearId)" ng-messages="myForm.finanYearId.$error">
                                <div ng-message="required">Select Financial Year </div>
                            </div>
                        </div>
                    </div>


                </div>
                <div class="col-sm-6">

                    <div class="form-group">
                        <label class="control-label col-sm-4">Quarter Name :<span style="color:red;">*</span></label>
                        <div class="col-sm-6">
                            <select class="form-control" id="sel1" name="wuarter" data-ng-model="loan.hrmQ_Id" required>
                                <option value="">Select</option>
                                <option ng-repeat="qnter in quarterdropdown" value="{{qnter.hrmQ_Id}}" ng-selected="{{qnter.hrmQ_Id===loan.hrmQ_Id}}">
                                    {{qnter.hrmQ_QuarterName}}
                                </option>
                            </select>
                            <div class="error-messages" ng-if="interacted(myForm.wuarter)" ng-messages="myForm.wuarter.$error">
                                <div ng-message="required">Select Quarter Name</div>
                            </div>
                        </div>
                    </div>


                    <div class="form-group">
                        <label class="control-label col-sm-4">Receipt No. :<span style="color:red;">*</span></label>
                        <div class="col-sm-6">
                            <input type="text" name="LoanAmount" class="form-control active" allow-pattern="([a-zA-Z0-9])|/" data-ng-model="loan.hretdsR_ReceiptNo" id="LoanAmount" maxlength="20" required>
                            <div class="error-messages" ng-if="interacted(myForm.LoanAmount)" ng-messages="myForm.LoanAmount.$error">
                                <div ng-message="required">Enter Receipt No.</div>

                            </div>
                        </div>
                    </div>

                    <!--<div class="form-group">
                        <label class="control-label col-sm-4">Amount Paid. :<span style="color:red;">*</span></label>
                        <div class="col-sm-6">
                            <input type="text" name="ReferenceNo" class="form-control active" allow-pattern="([a-zA-Z0-9])|/" ng-paste="$event.preventDefault()" required data-ng-model="loan.hreL_ReferenceNo" id="ReferenceNo" maxlength="15">
                            <div class="error-messages" ng-if="interacted(myForm.ReferenceNo)" ng-messages="myForm.ReferenceNo.$error">
                                <div ng-message="required"> Enter Challan No</div>
                            </div>
                        </div>
                    </div>-->
                    <!--<div class="form-group">
                        <label class="control-label col-sm-4">Amount Paid. <span style="color:red;">*</span></label>
                        <div class="col-sm-6">
                            <input type="text" name="ReferenceNo" class="form-control active" allow-pattern="([0-9])|/" ng-paste="$event.preventDefault()" required data-ng-model="loan.hretdS_AmountPaid" id="ReferenceNo" maxlength="15">
                            <div class="error-messages" ng-if="interacted(myForm.ReferenceNo)" ng-messages="myForm.ReferenceNo.$error">
                                <div ng-message="required"> Enter Amount Paid </div>
                            </div>
                        </div>
                    </div>-->

                </div>
                <div class="col-sm-12" style="margin-top:10px;">
                    <div class="form-group">
                        <div class="text-center">
                            <input type="hidden" ng-model="loan.hretdsQ_Id" />
                            <md-button type="submit" class="md-raised md-primary" ng-disabled="form.$invalid" id="save-btn">
                                <i class="fa fa-floppy-o" aria-hidden="true"></i>
                                Save
                            </md-button>
                            <md-button type="button" class="md-raised md-warn" data-ng-click="cancel()">
                                <i class="fa fa-times" aria-hidden="true"></i>
                                Cancel
                            </md-button>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </div>
    <div class="box box-primary">
        <div class="box-header with-border">
            <h3 class="box-title">TDS Quarter List</h3>
            <div class="box-tools pull-right">
                <button type="button" class="btn btn-box-tool" data-widget="collapse" data-placement="bottom" data-toggle="tooltip" title="collapsible"><i class="fa fa-minus"></i></button>
            </div>
        </div>
        <!-- /.box-header -->
        <div class="box-body">
            <div ui-grid="gridOptions" ui-grid-pagination class="grid"></div>
        </div>
    </div>
</section>
