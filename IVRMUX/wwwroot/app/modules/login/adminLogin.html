<link href="MDB-pro/css/mdb.min.css" rel="stylesheet" />
<link href="MDB-pro/css/compiled.min.css" rel="stylesheet" />
<link href="MDB-pro/css/bootstrap.min.css" rel="stylesheet" />
<style>
    body, html {
        margin: 0px;
        padding: 0px;
        width: 100%;
        height: 100%;
    }
</style>


<div class="card mt-5" style="width: 26rem;margin:auto;">

    <div class="card-body mx-4" data-ng-show="vm.signIn && loaddded">

        <!--Header-->
        <div class="text-left">
            <h3 class="dark-grey-text mb-1 animated fadeInUp" data-wow-delay="0.6s"><strong>Sign in</strong></h3>
            <p>to Continue Your Account</p>
        </div>
        <br />
        <form class="form-horizontal" data-ng-submit="vm.loginNEW(vm.getUser.Username,vm.getUser.Password,vm.getUser.txtCaptcha,vm.getUser.txtInput);">
            <!--Body-->
            <!-- Default input name -->
            <label for="defaultFormCardNameEx" class="grey-text font-weight-light">User Name</label>
            <input id="login-username" type="text" class="form-control" name="username" value="admin" placeholder="Username" data-ng-model="vm.getUser.Username" required>

            <br />
            <!-- Default input name -->
            <label for="defaultFormCardNameEx" class="grey-text font-weight-light">Password</label>
            <input id="login-password" type="password" class="form-control" name="password" placeholder="Password" data-ng-model="vm.getUser.Password" required value="admin">
            <p class="font-small blue-text d-flex justify-content-end mt-2">Forgot <a href="#" class="blue-text ml-1"> Password?</a></p>

            <br />

            <div class="text-center mb-3">
                <button type="submit"
                        class="btn blue-gradient btn-block btn-rounded z-depth-1a waves-effect waves-light"
                        data-ng-click="vm.login(vm.getUser.Username,vm.getUser.Password,vm.getUser.txtCaptcha,vm.getUser.txtInput);">
                    Sign in
                </button>
            </div>


        </form>
    </div>



</div>
